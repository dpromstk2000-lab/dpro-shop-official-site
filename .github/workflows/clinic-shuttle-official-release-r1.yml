name: DPRO Clinic Shuttle Official Release R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-official-release-r1.yml"
      - ".github/workflows/clinic-shuttle-official-release-r1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-official-release
  cancel-in-progress: false

jobs:
  official-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout official site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard OFFICIAL baseline and SYSTEM FINAL LOCK
        shell: bash
        run: |
          set -euo pipefail
          BASE="d6e70acf419134fbd16b9ad6b4c64c8ae8aa81fc"
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = "$BASE" || { echo "OFFICIAL baseline drift: $PARENT != $BASE"; exit 1; }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || { echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1; }

      - name: Prepare official product sources
        run: python .github/workflows/clinic-shuttle-official-release-r1.py sources

      - name: Local source QA
        run: python .github/workflows/clinic-shuttle-official-release-r1.py localqa

      - name: Commit official release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/clinic-shuttle.html systems/index.html index.html pricing.html site-config.js sitemap.xml assets/clinic-shuttle-release
          git commit -m "Add DPRO clinic shuttle official product page"
          git push origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for public deployment and run responsive QA
        run: python .github/workflows/clinic-shuttle-official-release-r1.py liveqa

      - name: Build official evidence manifest
        run: python .github/workflows/clinic-shuttle-official-release-r1.py manifest

      - name: Commit official public QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git add assets/clinic-shuttle-release
          git commit -m "Record clinic shuttle official public QA evidence"
          git push origin main

      - name: Remove one-shot official release workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/clinic-shuttle-official-release-r1.yml .github/workflows/clinic-shuttle-official-release-r1.py
          git commit -m "Remove completed clinic shuttle official release workflow"
          git push origin main
