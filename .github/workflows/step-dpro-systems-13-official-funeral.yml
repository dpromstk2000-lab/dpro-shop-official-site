name: STEP DPRO-SYSTEMS-13 Official Funeral Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-13-official-funeral.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create official funeral page and connect catalog
        shell: python
        run: |
          from pathlib import Path
          import base64
          import xml.etree.ElementTree as ET

          page = base64.b64decode("").decode("utf-8")
          css_append = base64.b64decode("").decode("utf-8")
          card = base64.b64decode("").decode("utf-8")
          old_item = base64.b64decode("ICAgICAgICB7CiAgICAgICAgICAiQHR5cGUiOiJMaXN0SXRlbSIsCiAgICAgICAgICAicG9zaXRpb24iOjEwLAogICAgICAgICAgInVybCI6Imh0dHBzOi8vZHByby1zaG9wLmNvbS9zeXN0ZW1zL2l6YWtheWEiLAogICAgICAgICAgIm5hbWUiOiJEUFJPIOWxhemFkuWxiyBMSU5FIgogICAgICAgIH0=").decode("utf-8")
          new_item = base64.b64decode("").decode("utf-8")

          systems_dir = Path("systems")
          systems_dir.mkdir(exist_ok=True)

          page_path = systems_dir / "funeral.html"
          page_path.write_text(page, encoding="utf-8")

          css_path = systems_dir / "systems.css"
          css = css_path.read_text(encoding="utf-8")
          marker = "/* DPRO-SYSTEMS-13 FUNERAL PRODUCT PAGE */"
          if marker not in css:
              css_path.write_text(css.rstrip() + "\n\n" + css_append.strip() + "\n", encoding="utf-8")

          index_path = systems_dir / "index.html"
          index = index_path.read_text(encoding="utf-8")

          old_filter = '<button class="sys-filter" type="button" data-system-filter="food-restaurant" aria-pressed="false">飲食店</button>'
          new_filter = old_filter + '\n<button class="sys-filter" type="button" data-system-filter="funeral-memorial" aria-pressed="false">葬儀・法要</button>'
          if 'data-system-filter="funeral-memorial"' not in index:
              if old_filter not in index:
                  raise SystemExit("ERROR: funeral category filter target not found")
              index = index.replace(old_filter, new_filter, 1)

          if 'href="funeral" data-system-category="funeral-memorial"' not in index:
              target = '<div class="systems-empty" data-system-empty hidden>該当する公開ページは、現在準備中です。</div>'
              if target not in index:
                  raise SystemExit("ERROR: catalog card target not found")
              index = index.replace(target, card + "\n" + target, 1)

          if '"numberOfItems":10' in index:
              index = index.replace('"numberOfItems":10', '"numberOfItems":11', 1)
          elif '"numberOfItems":11' not in index:
              raise SystemExit("ERROR: ItemList count target not found")

          if '"url":"https://dpro-shop.com/systems/funeral"' not in index:
              if old_item not in index:
                  raise SystemExit("ERROR: JSON-LD target not found")
              index = index.replace(old_item, new_item, 1)

          footer_old = '<div><strong>PRODUCT</strong><a href="./">DPROシステム</a><a href="vet">動物病院</a><a href="shuttle">福祉施設送迎</a><a href="caretaxi">介護タクシー</a><a href="estate">不動産・賃貸内見</a><a href="cleaning">クリーニング</a><a href="repair">修理受付</a><a href="dayservice">デイサービス</a><a href="hair">美容室</a><a href="nail">ネイルサロン</a><a href="izakaya">居酒屋</a></div>'
          footer_new = '<div><strong>PRODUCT</strong><a href="./">DPROシステム</a><a href="vet">動物病院</a><a href="shuttle">福祉施設送迎</a><a href="caretaxi">介護タクシー</a><a href="estate">不動産・賃貸内見</a><a href="cleaning">クリーニング</a><a href="repair">修理受付</a><a href="dayservice">デイサービス</a><a href="hair">美容室</a><a href="nail">ネイルサロン</a><a href="izakaya">居酒屋</a><a href="funeral">葬儀・法要</a></div>'
          if footer_new not in index:
              if footer_old not in index:
                  raise SystemExit("ERROR: footer target not found")
              index = index.replace(footer_old, footer_new, 1)

          index_path.write_text(index, encoding="utf-8")

          sitemap_path = Path("sitemap.xml")
          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          target_url = "https://dpro-shop.com/systems/funeral"

          urls = [node.find(ns + "loc").text for node in root.findall(ns + "url") if node.find(ns + "loc") is not None]

          if target_url not in urls:
              node = ET.SubElement(root, ns + "url")
              ET.SubElement(node, ns + "loc").text = target_url
              ET.SubElement(node, ns + "lastmod").text = "2026-07-30"
              ET.SubElement(node, ns + "changefreq").text = "monthly"
              ET.SubElement(node, ns + "priority").text = "0.9"

          for node in root.findall(ns + "url"):
              loc = node.find(ns + "loc")
              if loc is not None and loc.text == "https://dpro-shop.com/systems/":
                  lastmod = node.find(ns + "lastmod")
                  if lastmod is not None:
                      lastmod.text = "2026-07-30"

          tree.write(sitemap_path, encoding="utf-8", xml_declaration=True)

          updated_page = page_path.read_text(encoding="utf-8")
          updated_index = index_path.read_text(encoding="utf-8")
          updated_css = css_path.read_text(encoding="utf-8")
          updated_sitemap = sitemap_path.read_text(encoding="utf-8")

          assert "公式製品紹介ページ" in updated_page
          assert "DPRO 葬儀・法要サポート LINE" in updated_page
          assert "緊急時の電話案内" in updated_page
          assert "ご家族マイページ" in updated_page
          assert "会館iPad受付" in updated_page
          assert "system-check" not in updated_page
          assert "営業前DEMO準備" not in updated_page
          assert "STEP FUNERAL-" not in updated_page
          assert 'data-system-filter="funeral-memorial"' in updated_index
          assert 'href="funeral" data-system-category="funeral-memorial"' in updated_index
          assert '"numberOfItems":11' in updated_index
          assert '"url":"https://dpro-shop.com/systems/funeral"' in updated_index
          assert '<a href="funeral">葬儀・法要</a>' in updated_index
          assert marker in updated_css
          assert target_url in updated_sitemap

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add systems/funeral.html systems/index.html systems/systems.css sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-13 add official funeral page"
          git push
