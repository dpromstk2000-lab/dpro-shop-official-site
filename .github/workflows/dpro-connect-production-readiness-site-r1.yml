name: DPRO CONNECT Production Readiness Site R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply DPRO CONNECT public pages
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/dpro_connect_site_patch.py
          python /tmp/dpro_connect_site_patch.py

      - name: Validate
        shell: bash
        run: |
          test -f connect/index.html
          grep -q 'DPRO CONNECT' connect/index.html
          grep -q 'Googleユーザーデータの取扱い' connect/index.html
          grep -q 'Google API・Googleカレンダー連携について' privacy.html
          grep -q 'Google API Services User Data Policy' privacy.html
          grep -q 'DPRO CONNECTを通じてGoogleカレンダー' terms.html
          grep -q 'https://dpro-shop.com/connect/' sitemap.xml
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connect/index.html privacy.html terms.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Prepare DPRO CONNECT for Google OAuth production"
          git push
