name: DPRO Clinic Shuttle Visibility Hotfix R5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-visibility-hotfix-r5.yml"
      - ".github/workflows/clinic-shuttle-visibility-hotfix-r5.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-visibility-hotfix-r5
  cancel-in-progress: false

jobs:
  visibility-hotfix-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard current OFFICIAL SYSTEM FINAL LOCK and PRODUCT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a049a74fe1602ebf7a42cdf88d606e3a124e310f" || {
            echo "OFFICIAL parent drift"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          PRODUCT_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-line-systems-site.git refs/heads/main | awk '{print $1}')"
          test "$PRODUCT_HEAD" = "7bfb6ae44e53aeb470664aeec2991752ae5c3cbc" || {
            echo "PRODUCT head drift: $PRODUCT_HEAD"; exit 1;
          }

      - name: Apply clinic shuttle visibility fail-safe
        run: python .github/workflows/clinic-shuttle-visibility-hotfix-r5.py prepare

      - name: Commit visible-page hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/clinic-shuttle.html assets/clinic-shuttle-release/R5_VISIBILITY_FIX_SOURCE.json
          git commit -m "Fix clinic shuttle hidden reveal content"
          git push origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser visibility QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Audit actual visible content on custom domain and GitHub Pages
        run: python .github/workflows/clinic-shuttle-visibility-hotfix-r5.py audit

      - name: Commit corrected completion evidence
        shell: bash
        run: |
          set -euo pipefail
          git add assets/clinic-shuttle-release
          git commit -m "Record clinic shuttle R5 visibility QA"
          git push origin main

      - name: Remove R5 one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/clinic-shuttle-visibility-hotfix-r5.yml .github/workflows/clinic-shuttle-visibility-hotfix-r5.py
          git commit -m "Remove clinic shuttle R5 visibility workflow"
          git push origin main
