name: Finalize DPRO SHOP Official 52 Copy V1.7
on:
  push:
    paths:
      - .github/workflows/finalize-official-52-copy.yml
permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix final stale count and run official 52 QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('systems/systems.js')
          before = js_path.read_text(encoding='utf-8')
          old = '>50システム説明<'
          new = '>52システム説明<'
          assert old in before, 'expected stale shared footer copy not found'
          after = before.replace(old, new)
          assert old not in after
          js_path.write_text(after, encoding='utf-8')

          # Hub is already canonical #52 and must remain unchanged/valid.
          hub = Path('systems/index.html').read_text(encoding='utf-8')
          assert '52システムの公式説明' in hub
          assert '"numberOfItems":52' in hub
          assert '"position":52' in hub
          assert 'https://dpro-shop.com/systems/visit-ahaki' in hub
          assert re.search(r'data-filter-count="all"[^>]*>52<', hub)
          assert re.search(r'data-filter-count="medical"[^>]*>6<', hub)
          hrefs = re.findall(r'<a class="sys33-card"[^>]*href="([^"]+)"', hub)
          assert len(hrefs) == 52, f'official card count={len(hrefs)}'
          assert len(set(hrefs)) == 52
          assert 'visit-ahaki' in hrefs

          cfg = Path('site-config.js').read_text(encoding='utf-8')
          assert 'productCount: 52' in cfg

          visit = Path('systems/visit-ahaki.html').read_text(encoding='utf-8')
          assert 'PRODUCT 52 / VISIT CARE OPERATION' in visit
          assert '<link rel="canonical" href="https://dpro-shop.com/systems/visit-ahaki">' in visit
          assert 'https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/visit-ahaki.html' in visit

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('https://dpro-shop.com/systems/visit-ahaki') == 1

          runtime = js_path.read_text(encoding='utf-8')
          assert '50システム説明' not in runtime
          assert '51システム説明' not in runtime
          assert '52システム説明' in runtime
          assert 'cdn.jsdelivr.net/gh/dpromstk2000-lab/dpro-shop-official-site@' not in runtime

          print('OFFICIAL_52_FINAL_COPY_QA=PASS cards=52 medical=6 jsonld=52 sitemap_visit=1 shared_footer=52')
          PY
          node --check site-config.js
          node --check systems/systems.js

      - name: Commit final official 52 copy
        shell: bash
        run: |
          rm -f .github/workflows/finalize-official-52-copy.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize DPRO SHOP official 52 copy"
          git push
