name: OFFICIAL final heading wrap fix V1.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-text-fix-official-v3.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Balance customer-facing H3 headings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          if not css_path.exists():
              raise SystemExit('styles.css missing')

          marker = '/* FINAL VISUAL QA V1.3 / HEADING BALANCE */'
          patch = '\n/* FINAL VISUAL QA V1.3 / HEADING BALANCE */\nmain h3{\n  text-wrap:balance;\n}\n'
          css = css_path.read_text(encoding='utf-8')
          if marker not in css:
              css_path.write_text(css.rstrip() + patch, encoding='utf-8')

          print('OFFICIAL heading balance applied')
          PY

      - name: Static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          assert 'FINAL VISUAL QA V1.3 / HEADING BALANCE' in css
          assert 'text-wrap:balance' in css
          assert Path('.github/workflows/final-visual-qa.yml').exists()
          print('OFFICIAL V1.3 STATIC QA PASS')
          PY

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/final-visual-text-fix-official-v3.yml
          git add styles.css
          git commit -m "Balance OFFICIAL final customer headings"
          git push origin HEAD:main

      - name: Wait for live CSS
        shell: bash
        run: |
          set -e
          URL="https://dpro-shop.com/styles.css?qa=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for i in $(seq 1 60); do
            css="$(curl -fsSL "$URL" 2>/dev/null || true)"
            if printf '%s' "$css" | grep -q "FINAL VISUAL QA V1.3 / HEADING BALANCE"; then
              echo "OFFICIAL V1.3 deployment confirmed"
              exit 0
            fi
            echo "Waiting for OFFICIAL V1.3 deployment... ${i}/60"
            sleep 5
          done
          exit 1

      - name: Dispatch FINAL visual QA V1.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run final-visual-qa.yml --ref main
          echo "FINAL visual QA V1.3 dispatched"
