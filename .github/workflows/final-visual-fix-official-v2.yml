name: OFFICIAL final visual fix V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-fix-official-v2.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final system-page overflow guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          css_path = Path("systems/systems.css")
          if not css_path.exists():
              raise SystemExit("systems/systems.css not found")

          marker = "/* FINAL VISUAL QA FIX V1.2 / SYSTEM PAGE OVERFLOW GUARD */"

          patch = r"""
          /* FINAL VISUAL QA FIX V1.2 / SYSTEM PAGE OVERFLOW GUARD */
          html{
            overflow-x:clip;
            max-width:100%;
          }
          body.system-product-page{
            overflow-x:clip!important;
            max-width:100%;
          }
          body.system-product-page main,
          body.system-product-page .product-hero,
          body.system-product-page .section,
          body.system-product-page .product-local-nav,
          body.system-product-page .site-footer{
            max-width:100%;
            overflow-x:clip;
          }
          body.system-product-page .product-hero-inner,
          body.system-product-page .product-hero-stage,
          body.system-product-page .product-stage-monitor,
          body.system-product-page .product-live-row,
          body.system-product-page .product-live-copy,
          body.system-product-page .product-live-stage,
          body.system-product-page .product-map-board,
          body.system-product-page .product-map-flow,
          body.system-product-page .product-map-core,
          body.system-product-page .product-feature-grid,
          body.system-product-page .product-role-grid,
          body.system-product-page .product-safety-grid,
          body.system-product-page .product-price-grid,
          body.system-product-page .product-after-grid,
          body.system-product-page .product-flow-list{
            min-width:0;
            max-width:100%;
          }
          @media(max-width:760px){
            body.system-product-page .product-stage-phone{
              max-width:min(150px,42vw)!important;
            }
            body.system-product-page .product-stage-tablet{
              right:0!important;
              max-width:min(190px,52vw)!important;
            }
            body.system-product-page .product-stage-phone,
            body.system-product-page .product-stage-tablet{
              box-sizing:border-box;
            }
            body.system-product-page [class*="-live-"],
            body.system-product-page [class*="-monitor-"]{
              min-width:0;
              max-width:100%;
            }
            body.system-product-page img,
            body.system-product-page iframe,
            body.system-product-page video,
            body.system-product-page canvas,
            body.system-product-page svg{
              max-width:100%;
            }
          }
          """

          current = css_path.read_text(encoding="utf-8")
          if marker not in current:
              css_path.write_text(
                  current.rstrip() + "\n\n" + textwrap.dedent(patch).strip() + "\n",
                  encoding="utf-8",
              )

          print("OFFICIAL system-page overflow guard added")
          PY

      - name: Static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("systems/systems.css").read_text(encoding="utf-8")
          assert "FINAL VISUAL QA FIX V1.2 / SYSTEM PAGE OVERFLOW GUARD" in css
          assert "overflow-x:clip" in css
          assert ".product-stage-tablet" in css
          assert Path(".github/workflows/final-visual-qa.yml").exists()

          print("OFFICIAL V1.2 STATIC QA PASS")
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/final-visual-fix-official-v2.yml
          git add systems/systems.css

          git diff --cached --name-only
          git commit -m "Finish OFFICIAL mobile overflow visual fix"
          git push origin HEAD:main

      - name: Wait for live CSS
        shell: bash
        run: |
          set -e
          URL="https://dpro-shop.com/systems/systems.css?qa=${GITHUB_SHA}-${GITHUB_RUN_ID}"

          for i in $(seq 1 60); do
            css="$(curl -fsSL "$URL" 2>/dev/null || true)"
            if printf '%s' "$css" | grep -q "FINAL VISUAL QA FIX V1.2 / SYSTEM PAGE OVERFLOW GUARD"; then
              echo "OFFICIAL V1.2 deployment confirmed"
              exit 0
            fi
            echo "Waiting for OFFICIAL V1.2 deployment... ${i}/60"
            sleep 5
          done

          echo "Source committed, but live CSS was not confirmed in time."
          exit 1

      - name: Dispatch FINAL visual QA V1.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run final-visual-qa.yml --ref main
          echo "FINAL visual QA V1.2 dispatched"
