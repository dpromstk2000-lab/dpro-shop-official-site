name: DPRO DAYCARE SEO Guide Link R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Add SEO guide route from DAYCARE product page
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          grep -q 'DPRO DAYCARE SEO GUIDE LINK R1 20261001' systems/dayservice.html
          grep -q '介護・LINE活用ガイドを見る' systems/dayservice.html
          grep -q '../seo/carefacility-emergency-contact' systems/dayservice.html
          echo "STATIC_QA=PASS"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/dayservice.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add DAYCARE SEO guide route"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE SEO Guide Link R1"
            echo ""
            echo "- Product page -> SEO guide route: added"
            echo "- Product page -> emergency contact guide route: added"
            echo "- Footer guide link: added"
            echo "- Existing DAYCARE structure and pricing: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
