name: OFFICIAL all pages customer copy brushup V1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-all-pages-customer-copy-brushup-v1.yml'

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brush up every public HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib
          import re
          import subprocess

          # All tracked HTML is public unless it lives under .github.
          tracked = subprocess.check_output(
              ["git", "ls-files", "*.html"],
              text=True,
          ).splitlines()

          pages = [
              Path(p) for p in tracked
              if not p.startswith(".github/")
          ]

          print("PUBLIC HTML PAGES:", len(pages))
          if len(pages) < 55:
              raise SystemExit(
                  f"Expected at least 55 public HTML pages, found {len(pages)}"
              )

          for p in pages:
              if not p.exists():
                  raise SystemExit(f"Tracked HTML missing: {p}")

          # Critical source/runtime files must remain byte-identical.
          protect_candidates = [
              "site-config.js",
              "official-v3.2.1.js",
              "official-v3.3.js",
              "systems/systems.js",
              "contact-web.js",
          ]
          protected = [
              Path(p) for p in protect_candidates if Path(p).exists()
          ]
          protected_before = {
              str(p): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in protected
          }

          def link_targets(html):
              values = []
              for attr in (
                  "href", "src", "data-src", "action", "formaction"
              ):
                  values += re.findall(
                      rf'\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      html,
                      flags=re.I,
                  )
              return Counter(values)

          def price_strings(html):
              return Counter(
                  re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', html)
              )

          def form_contract(html):
              values = []
              for attr in ("name", "id", "type"):
                  values += re.findall(
                      rf'<(?:input|select|textarea|form)\b[^>]*\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      html,
                      flags=re.I | re.S,
                  )
              return Counter(values)

          def stash_non_customer_code(html):
              saved = []
              pattern = re.compile(
                  r'<!--.*?-->|<script\b.*?</script>|<style\b.*?</style>',
                  flags=re.S | re.I,
              )
              def repl(match):
                  token = f"___OFFICIAL_STASH_{len(saved)}___"
                  saved.append(match.group(0))
                  return token
              return pattern.sub(repl, html), saved

          def restore_non_customer_code(html, saved):
              for i, value in enumerate(saved):
                  html = html.replace(
                      f"___OFFICIAL_STASH_{i}___",
                      value,
                  )
              return html

          # These are wording-only replacements.
          # Longer phrases first to avoid awkward fragments.
          EXACT_TEXT = [
              (
                  "青で理解する。",
                  "詳しく知る。"
              ),
              (
                  "赤で、実際に触る。",
                  "実画面で確かめる。"
              ),
              (
                  "青のOFFICIAL SITEで仕組み・料金・導入を説明し、赤のPRODUCT SITEで50の完成システムを実際に操作できます。",
                  "DPRO SHOPで仕組み・料金・導入内容を確認し、PRODUCT SITEで50の業種別システムの実画面やデモを確認できます。"
              ),
              (
                  "DPRO単体契約は現在行っていません。",
                  "DPROはLINE構築・運用をご契約の店舗向け追加サービスです。"
              ),
              (
                  "DPRO単体提供なし",
                  "DPROはLINE契約店舗向け"
              ),
              (
                  "DPROのみ提供条件があります。",
                  "DPROはLINE構築・運用をご契約の店舗向けサービスです。"
              ),
              (
                  "LINE構築・運用契約店舗だけが、",
                  "LINE構築・運用をご契約の店舗は、"
              ),
              (
                  "OFFICIAL PRODUCT GUIDE",
                  "DPRO SHOP 製品紹介"
              ),
              (
                  "ONE OPERATION CORE",
                  "DPRO SYSTEM"
              ),
              (
                  "ONE CONNECTED OPERATION",
                  "LINE・WEB・DPRO連携"
              ),
              (
                  "CONNECTED OPERATION / MONTHLY",
                  "LINE + HP + DPRO / MONTHLY"
              ),
              (
                  "CONTRACT STORE OPTION",
                  "DPRO OPTION"
              ),
              (
                  "LIVE SYNC",
                  "連携中"
              ),
              (
                  "CONNECTED LIVE",
                  "連携イメージ"
              ),
              (
                  "STORE OPERATION",
                  "店舗運用"
              ),
              (
                  "WEB RESERVATION ENTRY",
                  "WEB予約の入口"
              ),
              (
                  "CUSTOMER ENTRY",
                  "お客様の入口"
              ),
              (
                  "UNDERSTAND IN 30 SECONDS",
                  "30秒で分かる"
              ),
              (
                  "ONE CUSTOMER, FIVE EXPERIENCES",
                  "一つの顧客情報でつながる"
              ),
              (
                  "SYSTEM CODE",
                  "製品名"
              ),
              (
                  "BLUE / OFFICIAL SITE",
                  "DPRO SHOP"
              ),
              (
                  "RED / PRODUCT SITE",
                  "PRODUCT SITE"
              ),
              (
                  "青のOFFICIAL SITE",
                  "DPRO SHOP"
              ),
              (
                  "青OFFICIAL",
                  "DPRO SHOP"
              ),
              (
                  "赤のPRODUCT SITE",
                  "PRODUCT SITE"
              ),
              (
                  "CENTRAL LOCKED",
                  ""
              ),
              (
                  "CENTRAL確認済み",
                  ""
              ),
              (
                  "START PACKAGE",
                  "デモ構成"
              ),
              (
                  "VERIFIED LIVE DEMO",
                  "LIVE DEMO"
              ),
              (
                  "VERIFIED DEMO",
                  "LIVE DEMO"
              ),
              (
                  "MOBILE FIRST",
                  "スマートフォン対応"
              ),
              (
                  "初期iframe",
                  "初期読み込み"
              ),
          ]

          def clean_customer_text(value):
              for before, after in EXACT_TEXT:
                  value = value.replace(before, after)

              # General customer wording for terms that sometimes vary.
              value = value.replace(
                  "公式製品紹介ページ",
                  "製品紹介ページ",
              )
              value = value.replace(
                  "正式な案内",
                  "詳しい案内",
              )
              value = value.replace(
                  "正式実装",
                  "現在の対応内容",
              )
              value = value.replace(
                  "正式DEMO",
                  "公開デモ",
              )
              value = value.replace(
                  "正式URL",
                  "公開URL",
              )

              # PREVIEW is acceptable in code/classes, but customer-facing text
              # should be plain Japanese.
              value = re.sub(
                  r'(?<![A-Za-z0-9_-])PREVIEW(?![A-Za-z0-9_-])',
                  "画面イメージ",
                  value,
              )

              # Repair combinations after replacing internal labels.
              value = value.replace(
                  "DPRO SYSTEM / DPRO SYSTEM",
                  "DPRO SYSTEM / 店舗運用",
              )
              value = value.replace(
                  "DPRO SYSTEMDPRO SYSTEM",
                  "DPRO SYSTEM",
              )
              value = value.replace(
                  "DPRO SHOP DPRO SHOP",
                  "DPRO SHOP",
              )

              value = re.sub(r'[ \t]{2,}', ' ', value)
              value = re.sub(r'。{2,}', '。', value)
              return value

          # Page-specific wording where a simple global replacement would not
          # produce the best customer-facing sentence.
          PAGE_REPLACEMENTS = {
              "about.html": [
                  (
                      '<h2>青で理解する。<br><em style="color:#c22c5d">赤で、実際に触る。</em></h2>',
                      '<h2>詳しく知る。<br><em style="color:#c22c5d">実画面で確かめる。</em></h2>'
                  ),
                  (
                      "DPROには役割の違う2つのサイトがあります。情報を重複させるのではなく、検討の段階に合わせて使い分けます。",
                      "DPRO SHOPではサービス・料金・導入内容を確認でき、PRODUCT SITEでは実際の画面やデモを確認できます。"
                  ),
                  (
                      "今いるこのサイト。仕組み・サービス・料金・提供条件・相談方法を確認する場所です。",
                      "仕組み・サービス・料金・提供条件・相談方法を詳しく確認できます。"
                  ),
                  (
                      "完成システムを探し、実際のスマホ・PC・iPad画面やデモを操作する場所です。",
                      "業種別システムを探し、スマホ・PC・iPadの実画面やデモを確認できます。"
                  ),
              ],
              "pricing.html": [
                  (
                      "<span>DPROはLINE契約店舗向け</span>",
                      "<span>DPROはLINE契約店舗向け</span>"
                  ),
                  (
                      "LINE構築・運用契約店舗向け追加サービス。DPROはLINE構築・運用をご契約の店舗向け追加サービスです。",
                      "DPROはLINE構築・運用をご契約の店舗向け追加サービスです。"
                  ),
              ],
          }

          def clean_customer_attributes(html):
              customer_meta = {
                  "description",
                  "og:title",
                  "og:description",
                  "twitter:title",
                  "twitter:description",
              }

              def meta_repl(match):
                  tag = match.group(0)
                  key = re.search(
                      r'(?:name|property)\s*=\s*["\']([^"\']+)["\']',
                      tag,
                      flags=re.I,
                  )
                  if (
                      not key
                      or key.group(1).lower() not in customer_meta
                  ):
                      return tag

                  def content_repl(cm):
                      quote = cm.group(1)
                      return (
                          "content="
                          + quote
                          + clean_customer_text(cm.group(2))
                          + quote
                      )

                  return re.sub(
                      r'content\s*=\s*(["\'])(.*?)\1',
                      content_repl,
                      tag,
                      count=1,
                      flags=re.I | re.S,
                  )

              html = re.sub(
                  r'<meta\b[^>]*>',
                  meta_repl,
                  html,
                  flags=re.I | re.S,
              )

              def attr_repl(match):
                  return (
                      f'{match.group(1)}={match.group(2)}'
                      f'{clean_customer_text(match.group(3))}'
                      f'{match.group(2)}'
                  )

              html = re.sub(
                  r'\b(aria-label|title|data-title)\s*=\s*(["\'])(.*?)\2',
                  attr_repl,
                  html,
                  flags=re.I | re.S,
              )
              return html

          def transform(path, before):
              work = before

              # Apply page-specific sentences before the generic pass.
              for old, new in PAGE_REPLACEMENTS.get(
                  path.as_posix(),
                  PAGE_REPLACEMENTS.get(path.name, []),
              ):
                  work = work.replace(old, new)

              body, saved = stash_non_customer_code(work)

              body = re.sub(
                  r'>([^<>]+)<',
                  lambda m: ">"
                  + clean_customer_text(m.group(1))
                  + "<",
                  body,
              )

              # Visible escaped internal comments should never reach customers.
              body = re.sub(
                  r'\s*&lt;!--.*?(?:CENTRAL|DPRO_[A-Z0-9_:-]+).*?--&gt;\s*',
                  '\n',
                  body,
                  flags=re.S,
              )

              # Only fix clearly broken HTML line breaks:
              # duplicate BR, BR before punctuation, BR at end of heading.
              body = re.sub(
                  r'(?:<br\s*/?>\s*){2,}',
                  '<br>',
                  body,
                  flags=re.I,
              )
              body = re.sub(
                  r'<br\s*/?>\s*([、。！？])',
                  r'\1',
                  body,
                  flags=re.I,
              )
              body = re.sub(
                  r'<br\s*/?>\s*(</h[1-3]>)',
                  r'\1',
                  body,
                  flags=re.I,
              )

              work = restore_non_customer_code(body, saved)
              work = clean_customer_attributes(work)

              # Clean the document title text without touching attributes.
              work = re.sub(
                  r'(<title>)(.*?)(</title>)',
                  lambda m: m.group(1)
                  + clean_customer_text(m.group(2))
                  + m.group(3),
                  work,
                  flags=re.I | re.S,
              )
              return work

          def customer_surface(html):
              s = re.sub(r'<!--.*?-->', ' ', html, flags=re.S)
              s = re.sub(
                  r'<script\b.*?</script>',
                  ' ',
                  s,
                  flags=re.S | re.I,
              )
              s = re.sub(
                  r'<style\b.*?</style>',
                  ' ',
                  s,
                  flags=re.S | re.I,
              )

              attrs = re.findall(
                  r'\b(?:aria-label|title|data-title)\s*=\s*["\']([^"\']*)["\']',
                  s,
                  flags=re.I,
              )
              metas = []
              for tag in re.findall(
                  r'<meta\b[^>]*>',
                  s,
                  flags=re.I | re.S,
              ):
                  key = re.search(
                      r'(?:name|property)\s*=\s*["\']([^"\']+)["\']',
                      tag,
                      flags=re.I,
                  )
                  if key and key.group(1).lower() in {
                      "description",
                      "og:title",
                      "og:description",
                      "twitter:title",
                      "twitter:description",
                  }:
                      content = re.search(
                          r'content\s*=\s*["\']([^"\']*)["\']',
                          tag,
                          flags=re.I,
                      )
                      if content:
                          metas.append(content.group(1))

              visible = re.sub(r'<[^>]+>', ' ', s)
              visible = (
                  visible
                  .replace("&lt;", "<")
                  .replace("&gt;", ">")
                  .replace("&amp;", "&")
              )
              return re.sub(
                  r'\s+',
                  ' ',
                  visible
                  + " "
                  + " ".join(attrs)
                  + " "
                  + " ".join(metas),
              ).strip()

          banned_customer_terms = [
              "BLUE / OFFICIAL SITE",
              "RED / PRODUCT SITE",
              "青のOFFICIAL SITE",
              "赤のPRODUCT SITE",
              "青OFFICIAL",
              "ONE OPERATION CORE",
              "ONE CONNECTED OPERATION",
              "CONNECTED OPERATION / MONTHLY",
              "LIVE SYNC",
              "CONNECTED LIVE",
              "STORE OPERATION",
              "OFFICIAL PRODUCT GUIDE",
              "SYSTEM CODE",
              "CENTRAL LOCKED",
              "CENTRAL確認済み",
              "START PACKAGE",
              "VERIFIED LIVE DEMO",
              "VERIFIED DEMO",
              "MOBILE FIRST",
              "初期iframe",
              "DPRO単体提供なし",
              "DPRO単体契約は現在行っていません",
          ]

          changed = []
          unchanged = []
          failures = []

          for path in pages:
              before = path.read_text(encoding="utf-8")

              old_links = link_targets(before)
              old_prices = price_strings(before)
              old_forms = form_contract(before)

              after = transform(path, before)

              if link_targets(after) != old_links:
                  failures.append(
                      f"{path}: href/src/data-src/action target changed"
                  )
              if price_strings(after) != old_prices:
                  failures.append(
                      f"{path}: price strings changed"
                  )
              if form_contract(after) != old_forms:
                  failures.append(
                      f"{path}: form id/name/type contract changed"
                  )

              remaining = [
                  term
                  for term in banned_customer_terms
                  if term in customer_surface(after)
              ]
              if remaining:
                  failures.append(
                      f"{path}: internal wording remains visible: "
                      f"{remaining}"
                  )

              if re.search(
                  r'<br\s*/?>\s*<br\s*/?>',
                  after,
                  flags=re.I,
              ):
                  failures.append(
                      f"{path}: duplicate BR remains"
                  )

              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(path)
              else:
                  unchanged.append(path)

              # Keep an existing recovery mirror aligned.
              mirror = Path(str(path) + ".txt")
              if mirror.exists():
                  mirror_before = mirror.read_text(
                      encoding="utf-8"
                  )
                  mirror_after = transform(
                      path,
                      mirror_before,
                  )
                  if mirror_after != mirror_before:
                      mirror.write_text(
                          mirror_after,
                          encoding="utf-8",
                      )

          for p in protected:
              current = hashlib.sha256(p.read_bytes()).hexdigest()
              if current != protected_before[str(p)]:
                  failures.append(
                      f"{p}: protected runtime/source file changed"
                  )

          print("PUBLIC HTML REVIEWED:", len(pages))
          print("CHANGED HTML:", len(changed))
          print("ALREADY CLEAN / UNCHANGED:", len(unchanged))

          if failures:
              print("\nVALIDATION FAIL")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          for path in changed:
              print("  CHANGED", path)

          Path("/tmp/official-public-pages.txt").write_text(
              "\n".join(str(p) for p in pages),
              encoding="utf-8",
          )
          print("\nOFFICIAL CUSTOMER COPY VALIDATION PASS")
          PY

      - name: Cross-page static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path(line)
              for line in Path(
                  "/tmp/official-public-pages.txt"
              ).read_text(
                  encoding="utf-8"
              ).splitlines()
              if line
          ]

          assert len(paths) >= 55

          for path in paths:
              html = path.read_text(encoding="utf-8")
              assert "<html" in html.lower(), f"{path}: html root missing"
              assert "</html>" in html.lower(), f"{path}: html close missing"

          # Key customer pages must retain their essential copy.
          pricing = Path("pricing.html").read_text(encoding="utf-8")
          assert "77,000円" in pricing
          assert "5,500円" in pricing
          assert "DPROはLINE" in pricing

          index = Path("index.html").read_text(encoding="utf-8")
          assert "LINE・WEB" in index
          assert "DPRO SYSTEM" in index

          about = Path("about.html").read_text(encoding="utf-8")
          assert "実画面で確かめる" in about
          assert "PRODUCT SITE" in about

          print(
              "CROSS-PAGE STATIC QA PASS:",
              len(paths),
              "public HTML pages",
          )
          PY

      - name: Commit successful all-page brushup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/official-all-pages-customer-copy-brushup-v1.yml

          # Stage only tracked modifications/deletions.
          git add -u

          echo "Changed paths:"
          git diff --cached --name-only

          # Runtime JavaScript and CSS must never be changed by this copy pass.
          if git diff --cached --name-only | grep -E '\.(js|css)$'; then
            echo "ERROR: runtime JS/CSS was staged"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Brush up OFFICIAL customer-facing copy across all pages"
          git push origin HEAD:main
