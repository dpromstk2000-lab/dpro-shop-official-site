name: OFFICIAL all pages customer copy brushup V1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-all-pages-customer-copy-brushup-v1.yml'

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final customer-facing cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.html"],
              text=True,
          ).splitlines()

          pages = [
              Path(p) for p in tracked
              if not p.startswith(".github/")
          ]

          if len(pages) < 55:
              raise SystemExit(f"Expected at least 55 public HTML pages, found {len(pages)}")

          def links(html):
              values = []
              for attr in ("href", "src", "data-src", "action", "formaction"):
                  values += re.findall(
                      rf'\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      html,
                      flags=re.I,
                  )
              return Counter(values)

          def prices(html):
              return Counter(re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', html))

          def form_contract(html):
              vals = []
              for attr in ("name", "id", "type"):
                  vals += re.findall(
                      rf'<(?:input|select|textarea|form)\b[^>]*\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      html,
                      flags=re.I | re.S,
                  )
              return Counter(vals)

          def stash(html):
              saved = []
              pat = re.compile(
                  r'<!--.*?-->|<script\b.*?</script>|<style\b.*?</style>',
                  flags=re.S | re.I,
              )
              def repl(m):
                  token = f"___V11_STASH_{len(saved)}___"
                  saved.append(m.group(0))
                  return token
              return pat.sub(repl, html), saved

          def restore(html, saved):
              for i, value in enumerate(saved):
                  html = html.replace(f"___V11_STASH_{i}___", value)
              return html

          EXACT = [
              (
                  "RED = PRODUCT SITE / REAL DEMO",
                  "PRODUCT SITE / LIVE DEMO"
              ),
              (
                  "OFFICIAL SITE = BLUE / PRODUCT SITE = RED",
                  "DPRO SHOP / PRODUCT SITE"
              ),
              (
                  "PRODUCT SITE / RED",
                  "PRODUCT SITE"
              ),
              (
                  "PRODUCT SITE・RED",
                  "PRODUCT SITE"
              ),
              (
                  "RED / PRODUCT SITE",
                  "PRODUCT SITE"
              ),
              (
                  "BLUE / OFFICIAL SITE",
                  "DPRO SHOP"
              ),
              (
                  "COMPLETED SYSTEMS",
                  "業種別システム"
              ),
              (
                  "50の完成システム",
                  "50の業種別システム"
              ),
              (
                  "完成製品の実画面・操作体験",
                  "実際の製品画面・デモ"
              ),
              (
                  "OFFICIAL SITEは説明・料金・契約条件。PRODUCT SITEは実際の製品画面・デモという役割で分けています。",
                  "DPRO SHOPでは説明・料金・契約条件を確認でき、PRODUCT SITEでは実画面やデモを確認できます。"
              ),
              (
                  "OFFICIAL SITEは説明・料金・契約条件。PRODUCT SITEは完成製品の実画面・操作体験という役割で分けています。",
                  "DPRO SHOPでは説明・料金・契約条件を確認でき、PRODUCT SITEでは実画面やデモを確認できます。"
              ),
              (
                  "料金を確認したら、50の業種別システムを実際に触る。",
                  "料金を確認したら、50の業種別システムを実画面で確認。"
              ),
              (
                  "料金を確認したら、50の完成システムを実際に触る。",
                  "料金を確認したら、50の業種別システムを実画面で確認。"
              ),
              (
                  "LINE構築・運用契約店舗向け追加サービス。DPROはLINE構築・運用をご契約の店舗向け追加サービスです。",
                  "DPROはLINE構築・運用をご契約の店舗向け追加サービスです。"
              ),
              (
                  "LINE構築・運用契約店舗向け追加サービス。LINE構築・運用をご契約の店舗向け追加サービスです。",
                  "LINE構築・運用をご契約の店舗向け追加サービスです。"
              ),
              (
                  "OFFICIAL PRODUCT GUIDE",
                  "DPRO SHOP 製品紹介"
              ),
              (
                  "OFFICIAL PRODUCT",
                  "DPRO SHOP 製品"
              ),
              (
                  "REAL DEMO",
                  "LIVE DEMO"
              ),
          ]

          def clean_text(value):
              for old, new in EXACT:
                  value = value.replace(old, new)

              value = value.replace("DPRO SHOP DPRO SHOP", "DPRO SHOP")
              value = value.replace("PRODUCT SITE PRODUCT SITE", "PRODUCT SITE")
              value = re.sub(r'[ \t]{2,}', ' ', value)
              value = re.sub(r'。{2,}', '。', value)
              return value

          def clean_attrs(html):
              keys = {
                  "description",
                  "og:title",
                  "og:description",
                  "twitter:title",
                  "twitter:description",
              }

              def meta_repl(m):
                  tag = m.group(0)
                  k = re.search(
                      r'(?:name|property)\s*=\s*["\']([^"\']+)["\']',
                      tag,
                      flags=re.I,
                  )
                  if not k or k.group(1).lower() not in keys:
                      return tag

                  def cr(cm):
                      q = cm.group(1)
                      return f'content={q}{clean_text(cm.group(2))}{q}'

                  return re.sub(
                      r'content\s*=\s*(["\'])(.*?)\1',
                      cr,
                      tag,
                      count=1,
                      flags=re.I | re.S,
                  )

              html = re.sub(r'<meta\b[^>]*>', meta_repl, html, flags=re.I | re.S)

              def ar(m):
                  return f'{m.group(1)}={m.group(2)}{clean_text(m.group(3))}{m.group(2)}'

              return re.sub(
                  r'\b(aria-label|title|data-title)\s*=\s*(["\'])(.*?)\2',
                  ar,
                  html,
                  flags=re.I | re.S,
              )

          def transform(html):
              work, saved = stash(html)

              work = re.sub(
                  r'>([^<>]+)<',
                  lambda m: ">" + clean_text(m.group(1)) + "<",
                  work,
              )

              work = re.sub(
                  r'(?:<br\s*/?>\s*){2,}',
                  '<br>',
                  work,
                  flags=re.I,
              )
              work = re.sub(
                  r'<br\s*/?>\s*([、。！？])',
                  r'\1',
                  work,
                  flags=re.I,
              )
              work = re.sub(
                  r'<br\s*/?>\s*(</h[1-3]>)',
                  r'\1',
                  work,
                  flags=re.I,
              )

              work = restore(work, saved)
              work = clean_attrs(work)
              work = re.sub(
                  r'(<title>)(.*?)(</title>)',
                  lambda m: m.group(1) + clean_text(m.group(2)) + m.group(3),
                  work,
                  flags=re.I | re.S,
              )
              return work

          def customer_surface(html):
              s = re.sub(r'<!--.*?-->', ' ', html, flags=re.S)
              s = re.sub(r'<script\b.*?</script>', ' ', s, flags=re.S | re.I)
              s = re.sub(r'<style\b.*?</style>', ' ', s, flags=re.S | re.I)

              attrs = re.findall(
                  r'\b(?:aria-label|title|data-title)\s*=\s*["\']([^"\']*)["\']',
                  s,
                  flags=re.I,
              )
              metas = []
              for tag in re.findall(r'<meta\b[^>]*>', s, flags=re.I | re.S):
                  key = re.search(
                      r'(?:name|property)\s*=\s*["\']([^"\']+)["\']',
                      tag,
                      flags=re.I,
                  )
                  if key and key.group(1).lower() in {
                      "description",
                      "og:title",
                      "og:description",
                      "twitter:title",
                      "twitter:description",
                  }:
                      c = re.search(
                          r'content\s*=\s*["\']([^"\']*)["\']',
                          tag,
                          flags=re.I,
                      )
                      if c:
                          metas.append(c.group(1))

              visible = re.sub(r'<[^>]+>', ' ', s)
              visible = (
                  visible.replace("&lt;", "<")
                         .replace("&gt;", ">")
                         .replace("&amp;", "&")
              )
              return re.sub(
                  r'\s+',
                  ' ',
                  visible + " " + " ".join(attrs) + " " + " ".join(metas),
              ).strip()

          banned = [
              "RED = PRODUCT SITE",
              "OFFICIAL SITE = BLUE",
              "PRODUCT SITE / RED",
              "PRODUCT SITE・RED",
              "RED / PRODUCT SITE",
              "BLUE / OFFICIAL SITE",
              "COMPLETED SYSTEMS",
              "OFFICIAL PRODUCT GUIDE",
              "完成製品の実画面・操作体験",
              "DPRO単体提供なし",
              "ONE OPERATION CORE",
              "ONE CONNECTED OPERATION",
              "LIVE SYNC",
              "CONNECTED LIVE",
              "STORE OPERATION",
              "CENTRAL LOCKED",
              "CENTRAL確認済み",
              "START PACKAGE",
              "VERIFIED DEMO",
          ]

          changed = []
          failures = []

          for path in pages:
              before = path.read_text(encoding="utf-8")
              before_links = links(before)
              before_prices = prices(before)
              before_forms = form_contract(before)

              after = transform(before)

              if links(after) != before_links:
                  failures.append(f"{path}: link target changed")
              if prices(after) != before_prices:
                  failures.append(f"{path}: price strings changed")
              if form_contract(after) != before_forms:
                  failures.append(f"{path}: form contract changed")

              remain = [term for term in banned if term in customer_surface(after)]
              if remain:
                  failures.append(f"{path}: old/internal wording remains: {remain}")

              if re.search(r'<br\s*/?>\s*<br\s*/?>', after, flags=re.I):
                  failures.append(f"{path}: duplicate BR remains")

              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(path)

              mirror = Path(str(path) + ".txt")
              if mirror.exists():
                  mb = mirror.read_text(encoding="utf-8")
                  ma = transform(mb)
                  if ma != mb:
                      mirror.write_text(ma, encoding="utf-8")

          print("PUBLIC HTML REVIEWED:", len(pages))
          print("CHANGED HTML:", len(changed))

          if failures:
              print("\nVALIDATION FAIL")
              for f in failures:
                  print(" -", f)
              raise SystemExit(1)

          for path in changed:
              print("  CHANGED", path)

          Path("/tmp/official-v11-pages.txt").write_text(
              "\n".join(str(p) for p in pages),
              encoding="utf-8",
          )
          print("\nOFFICIAL FINAL CUSTOMER COPY VALIDATION PASS")
          PY

      - name: Final static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path(x)
              for x in Path("/tmp/official-v11-pages.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              if x
          ]

          assert len(paths) >= 55

          pricing = Path("pricing.html").read_text(encoding="utf-8")
          assert "77,000円" in pricing
          assert "5,500円" in pricing
          assert "DPROはLINE構築・運用をご契約の店舗向け追加サービスです。" in pricing
          assert "RED = PRODUCT SITE" not in pricing
          assert "OFFICIAL SITE = BLUE" not in pricing
          assert "COMPLETED SYSTEMS" not in pricing

          about = Path("about.html").read_text(encoding="utf-8")
          assert "詳しく知る。" in about
          assert "実画面で確かめる。" in about

          print("FINAL STATIC QA PASS:", len(paths), "public HTML pages")
          PY

      - name: Commit final cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/official-all-pages-customer-copy-brushup-v1.yml
          git add -u

          echo "Changed paths:"
          git diff --cached --name-only

          if git diff --cached --name-only | grep -E '\.(js|css)$'; then
            echo "ERROR: JS/CSS staged"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Finish OFFICIAL customer copy cleanup"
          git push origin HEAD:main
