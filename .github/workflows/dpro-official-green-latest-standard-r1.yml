name: DPRO OFFICIAL GREEN Latest Standard R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply GREEN latest-standard marketing update
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "official_green_latest_standard_r1.py", "exec"))
      - name: Validate
        shell: bash
        run: |
          grep -q 'id="green-latest-standard"' systems/green-rental.html
          grep -q 'ブログ予約公開' systems/green-rental.html
          grep -q 'id="green-standard-proof"' index.html
          grep -q 'DPRO GREEN LATEST STANDARD R1' green-standard-20261007.css
          grep -q '2026-10-07' systems/green-rental.html
      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/dpro-official-green-latest-standard-r1.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Showcase GREEN connected HP LINE blog standard"
          git push
