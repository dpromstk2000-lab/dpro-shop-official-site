name: DPRO Clinic Shuttle Visibility Final QA R6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-visibility-final-qa-r6.yml"
      - ".github/workflows/clinic-shuttle-visibility-final-qa-r6.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-visibility-final-qa-r6
  cancel-in-progress: false

jobs:
  visibility-final-qa-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard R5 source SYSTEM FINAL LOCK and PRODUCT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "baff0129da88d099e8bafd6de5b00c78c61e613f" || {
            echo "R5 OFFICIAL source parent drift"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          PRODUCT_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-line-systems-site.git refs/heads/main | awk '{print $1}')"
          test "$PRODUCT_HEAD" = "7bfb6ae44e53aeb470664aeec2991752ae5c3cbc" || {
            echo "PRODUCT head drift: $PRODUCT_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scroll-based final visibility QA
        run: python .github/workflows/clinic-shuttle-visibility-final-qa-r6.py

      - name: Commit R6 verified completion evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clinic-shuttle-release
          git commit -m "Verify clinic shuttle visible content with scroll QA"
          git push origin main

      - name: Remove R5 and R6 one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          for f in \
            .github/workflows/clinic-shuttle-visibility-hotfix-r5.yml \
            .github/workflows/clinic-shuttle-visibility-hotfix-r5.py \
            .github/workflows/clinic-shuttle-visibility-final-qa-r6.yml \
            .github/workflows/clinic-shuttle-visibility-final-qa-r6.py; do
              test -e "$f" && git rm -f "$f" || true
          done
          git commit -m "Remove completed clinic shuttle visibility QA workflows"
          git push origin main
