name: Add GAKUDO to DPRO SHOP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-gakudo-to-dpro-shop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GAKUDO and update counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, json, sys

          def read(path): return Path(path).read_text(encoding="utf-8")
          def write(path, text): Path(path).write_text(text, encoding="utf-8")
          def require(cond, message):
              if not cond:
                  raise SystemExit(message)

          page = base64.b64decode("").decode("utf-8")
          Path("systems").mkdir(exist_ok=True)
          write("systems/gakudo.html", page)

          # Top page count
          p = read("index.html")
          if "<strong>48</strong><small>業種別システム" not in p:
              p2 = p.replace("<strong>47</strong><small>業種別システム", "<strong>48</strong><small>業種別システム", 1)
              require(p2 != p, "index.html: 47-system metric anchor not found")
              p = p2
          p = p.replace('"dateModified":"2026-07-31"', '"dateModified":"2026-08-02"')
          write("index.html", p)

          # Systems hub count, JSON-LD and card
          p = read("systems/index.html")
          repls = [
              ("公開中47システム", "公開中48システム"),
              ("業種別47システム", "業種別48システム"),
              ("47 INDUSTRY-SPECIFIC DPRO SYSTEMS", "48 INDUSTRY-SPECIFIC DPRO SYSTEMS"),
              ("公式紹介ページ 47件", "公式紹介ページ 48件"),
              ("47 OFFICIAL PAGES", "48 OFFICIAL PAGES"),
              ("47 SYSTEMS", "48 SYSTEMS"),
              ("47 OFFICIAL SYSTEM PAGES", "48 OFFICIAL SYSTEM PAGES"),
              ("現在の <strong>47システム</strong>", "現在の <strong>48システム</strong>"),
              ("47件を表示中", "48件を表示中"),
              ('data-filter-count="all">47', 'data-filter-count="all">48'),
              ('data-filter-count="education-school">1', 'data-filter-count="education-school">2'),
              ("実在する47個別ページ", "実在する48個別ページ"),
              ("47システムの中", "48システムの中"),
              ('"numberOfItems": 47', '"numberOfItems": 48'),
              ('"dateModified": "2026-08-01"', '"dateModified": "2026-08-02"'),
          ]
          for a,b in repls: p = p.replace(a,b)
          # Hero badge exact fallback
          p = p.replace('<span class="line-badge">47</span><span>公開中のシステムを見る', '<span class="line-badge">48</span><span>公開中のシステムを見る')
          p = p.replace('data-system-filter="all" type="button">すべて（<span data-filter-count="all">47', 'data-system-filter="all" type="button">すべて（<span data-filter-count="all">48')
          # JSON-LD item
          if 'https://dpro-shop.com/systems/gakudo' not in p:
              item = '''        ,{
                    "@type": "ListItem",
                    "position": 48,
                    "url": "https://dpro-shop.com/systems/gakudo",
                    "name": "DPRO 学童保育・放課後児童クラブ LINE"
                  }
          '''
              marker = '''        {
                    "@type": "ListItem",
                    "position": 47,
                    "url": "https://dpro-shop.com/systems/funeral",
                    "name": "DPRO 葬儀・法要サポート LINE"
                  }
          '''
              require(marker in p, "systems/index.html: JSON-LD funeral item anchor not found")
              p = p.replace(marker, marker + item, 1)
          # Catalog card before stay
          if 'href="gakudo"' not in p:
              card = '''<a class="sys-product-card is-gakudo reveal" data-system-category="education-school" href="gakudo">
          <div class="sys-product-visual">
          <span class="sys-product-status">公式紹介ページ公開中</span>
          <div class="sys-product-monitor"><div class="sys-product-monitor-grid"><span>保護者LINE</span><span>欠席・利用</span><span>入退室</span><span>お迎え照合</span><span>長期休暇</span><span>通知・警告</span></div></div>
          <div class="sys-product-phone"><div class="sys-product-phone-inner"><b>学童保育</b><span>LINE・スマホ</span><span>PC・iPad</span><span>実画面デモ</span></div></div>
          </div>
          <div class="sys-product-card-copy"><small>AFTER-SCHOOL CHILDCARE</small><h3>DPRO 学童保育・放課後児童クラブ LINE<br/>学童保育・放課後児童クラブ</h3><p>欠席・利用変更、お迎え連絡、入退室、代理お迎え・一人帰り、長期休暇、日別定員、通知・安全警告をつなぎます。</p><span class="sys-product-card-link">詳しい機能と実画面を見る <b>→</b></span></div>
          </a>'''
              anchor = '<a class="sys-product-card is-stay reveal"'
              require(anchor in p, "systems/index.html: stay card anchor not found")
              p = p.replace(anchor, card + anchor, 1)
          write("systems/index.html", p)

          # Sitemap
          p = read("sitemap.xml")
          if "/systems/gakudo" not in p:
              entry = '  <url><loc>https://dpro-shop.com/systems/gakudo</loc><lastmod>2026-08-02</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>\n'
              anchor = '  <url><loc>https://dpro-shop.com/systems/school</loc>'
              i = p.find(anchor)
              require(i >= 0, "sitemap.xml: school anchor not found")
              end = p.find('</url>', i) + len('</url>')
              p = p[:end] + '\n' + entry.rstrip('\n') + p[end:]
          write("sitemap.xml", p)

          # Public release checker copy
          p = read("system-check.html")
          for a,b in [
              ("全57ページ", "全58ページ"),
              ("47 SYSTEMS RELEASE CHECK", "48 SYSTEMS RELEASE CHECK"),
              ("業種別47システム", "業種別48システム"),
              ("システム47", "システム48"),
              ("全47個別ページ", "全48個別ページ"),
              ("sitemap.xmlが57URL", "sitemap.xmlが58URL"),
              ("47システム一覧", "48システム一覧"),
              ("STEP DPRO-SYSTEMS-CAREPLAN-47", "STEP DPRO-SYSTEMS-GAKUDO-48"),
          ]: p = p.replace(a,b)
          write("system-check.html", p)

          p = read("system-check.js")
          if '"gakudo"' not in p:
              p2 = p.replace('"school", "stay"', '"school", "gakudo", "stay"', 1)
              require(p2 != p, "system-check.js: school/stay slug anchor not found")
              p = p2
          if '"gakudo": "学童保育・放課後児童クラブ"' not in p:
              p2 = p.replace('"school": "学習塾・習い事", "stay"', '"school": "学習塾・習い事", "gakudo": "学童保育・放課後児童クラブ", "stay"', 1)
              require(p2 != p, "system-check.js: system name anchor not found")
              p = p2
          write("system-check.js", p)

          # Final validation
          checks = {
            "page": Path("systems/gakudo.html").exists(),
            "index_count": "<strong>48</strong><small>業種別システム" in read("index.html"),
            "hub_count": "公開中48システム" in read("systems/index.html"),
            "hub_card": 'href="gakudo"' in read("systems/index.html"),
            "education_count": 'data-filter-count="education-school">2' in read("systems/index.html"),
            "sitemap": "/systems/gakudo" in read("sitemap.xml"),
            "checker_slug": '"gakudo"' in read("system-check.js"),
            "checker_count": "全58ページ" in read("system-check.html"),
          }
          failed = [k for k,v in checks.items() if not v]
          print(json.dumps({"ok": not failed, "checks": checks, "failed": failed}, ensure_ascii=False, indent=2))
          require(not failed, "Validation failed: " + ", ".join(failed))
          PY

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          test -s systems/gakudo.html
          grep -q 'dpro-gakudo-line' systems/gakudo.html
          grep -q 'GAKUDO-10' systems/gakudo.html
          git diff --check
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required. GAKUDO is already present."
            exit 0
          fi
          git commit -m "Add GAKUDO as system 48"
          git push
