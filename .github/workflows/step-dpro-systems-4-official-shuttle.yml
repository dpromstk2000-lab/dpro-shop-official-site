name: STEP DPRO-SYSTEMS-4 Official Shuttle Page R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-4-official-shuttle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create official shuttle page and connect catalog
        shell: python
        run: |
          from pathlib import Path
          import base64
          import xml.etree.ElementTree as ET

          page = base64.b64decode("").decode("utf-8")
          css_append = base64.b64decode("").decode("utf-8")
          shuttle_card = base64.b64decode("").decode("utf-8")
          old_item = base64.b64decode("ICAgICAgICB7CiAgICAgICAgICAiQHR5cGUiOiJMaXN0SXRlbSIsCiAgICAgICAgICAicG9zaXRpb24iOjEsCiAgICAgICAgICAidXJsIjoiaHR0cHM6Ly9kcHJvLXNob3AuY29tL3N5c3RlbXMvdmV0IiwKICAgICAgICAgICJuYW1lIjoiRFBSTyBQRVQgQ0FSRSBMSU5F772c5YuV54mp55eF6ZmiIgogICAgICAgIH0=").decode("utf-8")
          new_item = base64.b64decode("").decode("utf-8")

          systems_dir = Path("systems")
          systems_dir.mkdir(exist_ok=True)
          shuttle_path = systems_dir / "shuttle.html"
          shuttle_path.write_text(page, encoding="utf-8")

          css_path = systems_dir / "systems.css"
          current_css = css_path.read_text(encoding="utf-8")
          marker = "/* DPRO-SYSTEMS-4 SHUTTLE PRODUCT PAGE */"
          if marker not in current_css:
              css_path.write_text(
                  current_css.rstrip() + "\n\n" + css_append.strip() + "\n",
                  encoding="utf-8"
              )

          index_path = systems_dir / "index.html"
          index = index_path.read_text(encoding="utf-8")

          old_filter = '<button class="sys-filter" type="button" data-system-filter="medical-pet" aria-pressed="false">医療・ペット</button>'
          new_filter = old_filter + '\n<button class="sys-filter" type="button" data-system-filter="welfare-care" aria-pressed="false">福祉・介護</button>'
          if 'data-system-filter="welfare-care"' not in index:
              if old_filter not in index:
                  raise SystemExit("ERROR: filter target not found")
              index = index.replace(old_filter, new_filter, 1)

          if 'href="shuttle" data-system-category="welfare-care"' not in index:
              card_target = '<div class="systems-empty" data-system-empty hidden>該当する公開ページは、現在準備中です。</div>'
              if card_target not in index:
                  raise SystemExit("ERROR: catalog card target not found")
              index = index.replace(card_target, shuttle_card + "\n" + card_target, 1)

          if '"numberOfItems":1' in index:
              index = index.replace('"numberOfItems":1', '"numberOfItems":2', 1)
          elif '"numberOfItems":2' not in index:
              raise SystemExit("ERROR: ItemList count target not found")

          if '"url":"https://dpro-shop.com/systems/shuttle"' not in index:
              if old_item not in index:
                  raise SystemExit("ERROR: JSON-LD target not found")
              index = index.replace(old_item, new_item, 1)

          old_footer = '<div><strong>PRODUCT</strong><a href="./">DPROシステム</a><a href="vet">動物病院</a></div>'
          new_footer = '<div><strong>PRODUCT</strong><a href="./">DPROシステム</a><a href="vet">動物病院</a><a href="shuttle">福祉施設送迎</a></div>'
          if new_footer not in index:
              if old_footer not in index:
                  raise SystemExit("ERROR: footer target not found")
              index = index.replace(old_footer, new_footer, 1)

          index_path.write_text(index, encoding="utf-8")

          sitemap_path = Path("sitemap.xml")
          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          target_url = "https://dpro-shop.com/systems/shuttle"
          urls = [
              node.find(ns + "loc").text
              for node in root.findall(ns + "url")
              if node.find(ns + "loc") is not None
          ]
          if target_url not in urls:
              node = ET.SubElement(root, ns + "url")
              ET.SubElement(node, ns + "loc").text = target_url
              ET.SubElement(node, ns + "lastmod").text = "2026-07-29"
              ET.SubElement(node, ns + "changefreq").text = "monthly"
              ET.SubElement(node, ns + "priority").text = "0.9"
          tree.write(sitemap_path, encoding="utf-8", xml_declaration=True)

          updated_page = shuttle_path.read_text(encoding="utf-8")
          updated_index = index_path.read_text(encoding="utf-8")
          updated_css = css_path.read_text(encoding="utf-8")
          updated_sitemap = sitemap_path.read_text(encoding="utf-8")

          assert "公式製品紹介ページ" in updated_page
          assert "DPRO 福祉施設送迎 LINE" in updated_page
          assert "system-check" not in updated_page
          assert "システム一括検査" not in updated_page
          assert 'href="shuttle" data-system-category="welfare-care"' in updated_index
          assert 'data-system-filter="welfare-care"' in updated_index
          assert '"numberOfItems":2' in updated_index
          assert '"url":"https://dpro-shop.com/systems/shuttle"' in updated_index
          assert marker in updated_css
          assert target_url in updated_sitemap

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add systems/shuttle.html systems/index.html systems/systems.css sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-4-R2 add official welfare shuttle page"
          git push
