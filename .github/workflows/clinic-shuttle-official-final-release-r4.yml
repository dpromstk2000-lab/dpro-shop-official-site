name: DPRO Clinic Shuttle Official Final Release R4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-official-final-release-r4.yml"
      - ".github/workflows/clinic-shuttle-official-final-release-r4.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-official-final-release-r4
  cancel-in-progress: false

jobs:
  final-release-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout official site
        uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Guard OFFICIAL source SYSTEM FINAL LOCK and PRODUCT head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "abecfc70d39155ebb13566065b231c28c528ac84" || {
            echo "OFFICIAL source parent drift"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          PRODUCT_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-line-systems-site.git refs/heads/main | awk '{print $1}')"
          test "$PRODUCT_HEAD" = "7bfb6ae44e53aeb470664aeec2991752ae5c3cbc" || {
            echo "PRODUCT head drift: $PRODUCT_HEAD"; exit 1;
          }

      - name: Verify final source state
        run: python .github/workflows/clinic-shuttle-official-final-release-r4.py source_guard

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install final browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run BRUSHUP B1-B4 and FINAL F1-F4
        run: python .github/workflows/clinic-shuttle-official-final-release-r4.py audit

      - name: Build PRODUCT RELEASE COMPLETE manifest
        run: python .github/workflows/clinic-shuttle-official-final-release-r4.py manifest

      - name: Commit PRODUCT RELEASE COMPLETE evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clinic-shuttle-release
          git commit -m "Lock DPRO clinic shuttle product release complete"
          git push origin main

      - name: Remove all clinic shuttle one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          for f in \
            .github/workflows/clinic-shuttle-official-release-r1.yml \
            .github/workflows/clinic-shuttle-official-release-r1.py \
            .github/workflows/clinic-shuttle-official-release-r2.yml \
            .github/workflows/clinic-shuttle-official-release-r2.py \
            .github/workflows/clinic-shuttle-official-release-r3.yml \
            .github/workflows/clinic-shuttle-official-release-r3.py \
            .github/workflows/clinic-shuttle-official-final-release-r4.yml \
            .github/workflows/clinic-shuttle-official-final-release-r4.py; do
              test -e "$f" && git rm -f "$f" || true
          done
          git commit -m "Remove completed clinic shuttle release workflows"
          git push origin main
