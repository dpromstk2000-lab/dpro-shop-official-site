name: DPRO SEO DAYCARE First 5 R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build SEO pages
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          test -f seo/index.html
          test -f seo/dayservice-line-family.html
          test -f seo/carefacility-emergency-contact.html
          test -f seo/dayservice-absence-line.html
          test -f seo/rehab-family-line.html
          test -f seo/dayservice-transport-contact.html
          grep -q 'FAQPage' seo/carefacility-emergency-contact.html
          grep -q 'https://dpro-shop.com/seo/dayservice-line-family' sitemap.xml
          echo 'SEO_STATIC_QA=PASS'
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo sitemap.xml DPRO_SEO_MASTER_DAYCARE_R1.txt
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Add DAYCARE SEO first 5 guides'; git push origin HEAD:main; fi
      - name: Summary
        shell: bash
        run: |
          echo '## DPRO SEO DAYCARE First 5 R1' >> "$GITHUB_STEP_SUMMARY"
          echo '- SEO hub + first 5 guides: added' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical / FAQ schema / internal links: added' >> "$GITHUB_STEP_SUMMARY"
          echo '- sitemap.xml: updated' >> "$GITHUB_STEP_SUMMARY"
          echo '- DPRO SEO MASTER: added' >> "$GITHUB_STEP_SUMMARY"
