name: DPRO SHOP DAYCARE Product Brushup R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch DAYCARE product page
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          grep -q 'DPRO DAYCARE PRODUCT BRUSHUP R1 20261001' systems/dayservice.html
          grep -q 'EMERGENCY FAMILY CONTACT' systems/dayservice.html
          grep -q '14の主要機能' systems/dayservice.html
          grep -q 'owner.html?demo=1' systems/dayservice.html
          echo "STATIC_QA=PASS"

      - name: Commit page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/dayservice.html
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "DAYCARE product page brushup R1"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO SHOP DAYCARE Product Brushup R1"
            echo ""
            echo "- Hero: latest DAYCARE positioning"
            echo "- Main features: 10 -> 14"
            echo "- Multiple family contacts / priority routing: added"
            echo "- Emergency broadcast: added"
            echo "- Auto escalation: added"
            echo "- History UX: added"
            echo "- OWNER public demo link: owner.html?demo=1"
            echo "- FAQ: emergency contact questions added"
            echo "- Pricing section: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
