name: STEP DPRO-SYSTEMS-15 Official Yakiniku Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-15-official-yakiniku.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create official yakiniku page only
        shell: python
        run: |
          from pathlib import Path
          import base64

          page = base64.b64decode("").decode("utf-8")
          target = Path("systems/yakiniku.html")
          target.parent.mkdir(exist_ok=True)
          target.write_text(page, encoding="utf-8")

          content = target.read_text(encoding="utf-8")

          assert "公式製品紹介ページ" in content
          assert "DPRO 焼肉店 予約・順番受付 LINE" in content
          assert "30分単位の日時予約" in content
          assert "当日の順番受付" in content
          assert "呼び出し・再呼出" in content
          assert "テーブル回転管理" in content
          assert "店頭・電話受付" in content
          assert "待合モニター" in content
          assert "モバイルオーダー・店内注文" in content
          assert "POS・レジ・キャッシュレス決済" in content
          assert "https://dpro-shop.com/systems/yakiniku" in content
          assert "https://dpromstk2000-lab.github.io/dpro-yakiniku-line-liff/" in content
          assert "system-check" not in content
          assert "営業前DEMO準備" not in content
          assert "STEP YAKINIKU-" not in content

          # 今回は専用ページ以外を変更しない
          allowed = {"systems/yakiniku.html"}
          assert str(target) in allowed

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add systems/yakiniku.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          test "$changed" = "systems/yakiniku.html"
          git commit -m "STEP DPRO-SYSTEMS-15 add official yakiniku page"
          git push
