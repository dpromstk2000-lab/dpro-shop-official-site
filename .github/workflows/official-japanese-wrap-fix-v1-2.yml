name: OFFICIAL Japanese heading wrap fix V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-japanese-wrap-fix-v1-2.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix remaining headings and FAQ endings with word joiners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import html
          import re

          WJ = "&#8288;"

          heading_targets = {
              "about.html": [
                  (
                      "どこまでつなぐかは、店舗ごとに違っていい。",
                      "つなぐかは、",
                  ),
              ],
              "index.html": [
                  (
                      "4つのサービスが、ひとつの運営としてつながる。",
                      "つながる。",
                  ),
              ],
              "pricing.html": [
                  (
                      "DPROは、LINEとWEBの入口を店舗管理へつなぐ追加サービス。",
                      "つなぐ追加サービス。",
                  ),
              ],
              "systems/bakery.html": [
                  (
                      "パンの魅力を写真で伝え、そのままLINEで取り置きへ。",
                      "取り置きへ。",
                  ),
                  (
                      "いつものパンを取り置き",
                      "いつもの",
                  ),
              ],
              "systems/esthe.html": [
                  (
                      "来店から施術完了まで",
                      "施術完了まで",
                  ),
              ],
              "systems/eye-salon.html": [
                  (
                      "施術進行・カルテ",
                      "施術進行・カルテ",
                  ),
              ],
              "systems/photo-studio.html": [
                  (
                      "受付・準備・撮影を更新",
                      "準備・撮影を",
                  ),
              ],
              "systems/shiho.html": [
                  (
                      "相続相談から登記完了までを、LINEと案件管理でつなぐ。",
                      "登記完了までを、",
                  ),
              ],
          }

          faq_endings = [
              "利用できますか？",
              "利用できますか。",
              "対応できますか？",
              "対応できますか。",
              "予約できますか？",
              "予約できますか。",
              "確認できますか？",
              "確認できますか。",
              "できますか？",
              "できますか。",
              "ありますか？",
              "ありますか。",
              "でしょうか？",
              "でしょうか。",
              "ませんか？",
              "ませんか。",
              "ですか？",
              "ですか。",
              "ますか？",
              "ますか。",
          ]
          faq_endings.sort(key=len, reverse=True)

          heading_re = re.compile(
              r'(<h([1-4])\b[^>]*>)(.*?)(</h\2>)',
              flags=re.I | re.S,
          )
          summary_re = re.compile(
              r'(<summary\b[^>]*>)(.*?)(</summary>)',
              flags=re.I | re.S,
          )

          def visible_compact(inner):
              plain = re.sub(r'<[^>]+>', '', inner)
              plain = html.unescape(plain)
              plain = plain.replace("\u2060", "")
              return re.sub(r'\s+', '', plain)

          def raw_visible_map(inner):
              chars = []
              raw_pos = []
              i = 0
              n = len(inner)
              while i < n:
                  ch = inner[i]
                  if ch == "<":
                      j = inner.find(">", i + 1)
                      if j < 0:
                          i += 1
                      else:
                          i = j + 1
                      continue
                  if ch == "&":
                      j = inner.find(";", i + 1, min(n, i + 16))
                      if j > i:
                          entity = inner[i:j+1]
                          decoded = html.unescape(entity)
                          if decoded == "\u2060":
                              i = j + 1
                              continue
                          if len(decoded) == 1 and not decoded.isspace():
                              chars.append(decoded)
                              raw_pos.append(i)
                              i = j + 1
                              continue
                  if ch == "\u2060":
                      i += 1
                      continue
                  if not ch.isspace():
                      chars.append(ch)
                      raw_pos.append(i)
                  i += 1
              return "".join(chars), raw_pos

          def join_phrase(inner, phrase, from_end=False):
              compact, pos = raw_visible_map(inner)
              needle = re.sub(r'\s+', '', phrase)
              idx = compact.rfind(needle) if from_end else compact.find(needle)
              if idx < 0:
                  return inner, False

              insert_positions = []
              for offset in range(len(needle) - 1):
                  raw_index = pos[idx + offset] + 1
                  # Do not add a duplicate entity if one is already adjacent.
                  if inner.startswith(WJ, raw_index):
                      continue
                  insert_positions.append(raw_index)

              if not insert_positions:
                  return inner, False

              out = inner
              for raw_index in sorted(insert_positions, reverse=True):
                  out = out[:raw_index] + WJ + out[raw_index:]
              return out, True

          def links(source):
              vals = []
              for attr in ("href", "src", "data-src", "action", "formaction"):
                  vals += re.findall(
                      rf'\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      source,
                      flags=re.I,
                  )
              return Counter(vals)

          def prices(source):
              return Counter(
                  re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', source)
              )

          heading_fixed = 0
          faq_fixed = 0
          changed_pages = set()

          # Exact 9 remaining H1/H2/H3 issues.
          for file_name, targets in heading_targets.items():
              path = Path(file_name)
              if not path.exists():
                  raise SystemExit(f"Missing target file: {path}")

              before = path.read_text(encoding="utf-8")
              before_links = links(before)
              before_prices = prices(before)

              expected = {
                  re.sub(r'\s+', '', visible): phrase
                  for visible, phrase in targets
              }
              found = set()

              def heading_repl(match):
                  nonlocal_state = None
                  inner = match.group(3)
                  compact = visible_compact(inner)
                  phrase = expected.get(compact)
                  if not phrase:
                      return match.group(0)

                  updated, did = join_phrase(inner, phrase)
                  if not did:
                      raise SystemExit(
                          f"{file_name}: could not join phrase '{phrase}' "
                          f"inside heading '{compact}'"
                      )
                  found.add(compact)
                  return match.group(1) + updated + match.group(4)

              after = heading_re.sub(heading_repl, before)

              if found != set(expected):
                  missing = set(expected) - found
                  raise SystemExit(
                      f"{file_name}: missing exact heading targets: {missing}"
                  )

              if links(after) != before_links:
                  raise SystemExit(f"{file_name}: link targets changed")
              if prices(after) != before_prices:
                  raise SystemExit(f"{file_name}: price strings changed")

              path.write_text(after, encoding="utf-8")
              changed_pages.add(file_name)
              heading_fixed += len(found)

          # FAQ polite endings. Only SUMMARY elements are touched.
          tracked = [
              Path(p)
              for p in __import__("subprocess").check_output(
                  ["git", "ls-files", "*.html"],
                  text=True,
              ).splitlines()
              if not p.startswith((".github/", ".dpro/", ".dpro-next/"))
          ]

          for path in tracked:
              before = path.read_text(encoding="utf-8")
              before_links = links(before)
              before_prices = prices(before)
              local_count = [0]

              def summary_repl(match):
                  inner = match.group(2)
                  compact = visible_compact(inner)
                  chosen = None
                  for ending in faq_endings:
                      if compact.endswith(
                          re.sub(r'\s+', '', ending)
                      ):
                          chosen = ending
                          break
                  if not chosen:
                      return match.group(0)

                  updated, did = join_phrase(
                      inner,
                      chosen,
                      from_end=True,
                  )
                  if not did:
                      return match.group(0)

                  local_count[0] += 1
                  return match.group(1) + updated + match.group(3)

              after = summary_re.sub(summary_repl, before)

              if local_count[0]:
                  if links(after) != before_links:
                      raise SystemExit(f"{path}: FAQ link targets changed")
                  if prices(after) != before_prices:
                      raise SystemExit(f"{path}: FAQ price strings changed")
                  path.write_text(after, encoding="utf-8")
                  changed_pages.add(str(path))
                  faq_fixed += local_count[0]

          print("Remaining headings fixed:", heading_fixed)
          print("FAQ endings protected:", faq_fixed)
          print("Changed pages:", len(changed_pages))

          if heading_fixed != 9:
              raise SystemExit(
                  f"Expected exactly 9 remaining headings, fixed {heading_fixed}"
              )
          if faq_fixed < 50:
              raise SystemExit(
                  f"Expected at least 50 FAQ endings, fixed {faq_fixed}"
              )

          Path("/tmp/official-jp-v12-stats.txt").write_text(
              f"heading_fixed={heading_fixed}\n"
              f"faq_fixed={faq_fixed}\n"
              f"changed_pages={len(changed_pages)}\n",
              encoding="utf-8",
          )

          print("OFFICIAL JAPANESE WRAP V1.2 PREP PASS")
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stats = Path("/tmp/official-jp-v12-stats.txt").read_text(
              encoding="utf-8"
          )

          assert "heading_fixed=9" in stats

          faq = int(
              [
                  line.split("=", 1)[1]
                  for line in stats.splitlines()
                  if line.startswith("faq_fixed=")
              ][0]
          )
          assert faq >= 50

          targets = [
              "about.html",
              "index.html",
              "pricing.html",
              "systems/bakery.html",
              "systems/esthe.html",
              "systems/eye-salon.html",
              "systems/photo-studio.html",
              "systems/shiho.html",
          ]
          for name in targets:
              html = Path(name).read_text(encoding="utf-8")
              assert "&#8288;" in html, f"No word joiner found in {name}"

          assert Path(
              ".github/workflows/japanese-mobile-reaudit-v1.yml"
          ).exists()

          print(stats)
          print("OFFICIAL JAPANESE WRAP V1.2 STATIC QA PASS")
          PY

      - name: Commit V1.2 and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/official-japanese-wrap-fix-v1-2.yml
          git add -u

          echo "Changed paths:"
          git diff --cached --name-only

          if git diff --cached --name-only | grep -E '\.(js|css)$'; then
            echo "ERROR: V1.2 must not change JS/CSS"
            exit 1
          fi

          git commit -m "Finish OFFICIAL Japanese mobile wraps V1.2"
          git push origin HEAD:main

      - name: Wait for public V1.2 HTML
        shell: bash
        run: |
          set -e

          URL="https://dpro-shop.com/about.html?qa=${GITHUB_SHA}-${GITHUB_RUN_ID}"

          for i in $(seq 1 60); do
            page="$(curl -fsSL "$URL" 2>/dev/null || true)"
            if printf '%s' "$page" | grep -q "&#8288;"; then
              echo "OFFICIAL Japanese wrap V1.2 is live"
              exit 0
            fi
            echo "Waiting for V1.2 HTML... ${i}/60"
            sleep 5
          done

          echo "V1.2 source committed, but public HTML was not confirmed."
          exit 1

      - name: Dispatch Japanese mobile reaudit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run japanese-mobile-reaudit-v1.yml --ref main
          echo "Japanese mobile reaudit dispatched after V1.2"
