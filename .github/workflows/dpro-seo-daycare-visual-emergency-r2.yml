name: DPRO SEO DAYCARE Visual Emergency R2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply visual and emergency R2
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          test -f assets/seo-daycare-r2/family-line-flow.svg
          test -f assets/seo-daycare-r2/emergency-routing.svg
          test -f assets/seo-daycare-r2/absence-flow.svg
          test -f assets/seo-daycare-r2/rehab-complement.svg
          test -f assets/seo-daycare-r2/transport-split.svg
          grep -q 'SEO DAYCARE VISUAL R2 20261001' seo/dayservice-line-family.html
          grep -q 'SEO DAYCARE EMERGENCY R2 20261001' seo/carefacility-emergency-contact.html
          grep -q '未確認なら' seo/carefacility-emergency-contact.html
          grep -q '自動段階配信' seo/carefacility-emergency-contact.html
          echo "R2_STATIC_QA=PASS"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo assets/seo-daycare-r2
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Brush up DAYCARE SEO visuals and emergency content R2"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO SEO DAYCARE Visual + Emergency R2"
            echo ""
            echo "- 5 SEO pages: visual diagrams added"
            echo "- Family LINE flow visual: added"
            echo "- Emergency routing visual: added"
            echo "- Absence flow visual: added"
            echo "- Rehab complement visual: added"
            echo "- Transport role split visual: added"
            echo "- Emergency page: disaster / urgent notice content strengthened"
            echo "- Multiple family / priority routing: explicit"
            echo "- Resend / next-contact / automatic staged escalation: explicit"
            echo "- Emergency history scenario: added"
            echo "- Existing DPRO positioning: preserved"
          } >> "$GITHUB_STEP_SUMMARY"
