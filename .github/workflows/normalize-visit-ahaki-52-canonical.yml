name: Normalize DPRO SHOP Canonical 52
on:
  push:
    paths:
      - .github/workflows/normalize-visit-ahaki-52-canonical.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize canonical 52 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          REF51='4e1685f6a859f424a2326656152faee1b1e55984'
          CORE50='8dea80228bbd7b0a2863605f0bb8425e1203f453'

          def gitshow(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)

          def function_span(src, name):
              start=src.find(f'function {name}(')
              if start < 0: raise RuntimeError(f'function not found: {name}')
              brace=src.find('{', start)
              i=brace; depth=0; state='code'; quote=''
              while i < len(src):
                  c=src[i]; n=src[i+1] if i+1 < len(src) else ''
                  if state=='code':
                      if c=='/' and n=='/': state='line'; i+=2; continue
                      if c=='/' and n=='*': state='block'; i+=2; continue
                      if c in "'\"": state='string'; quote=c; i+=1; continue
                      if c=='`': state='template'; i+=1; continue
                      if c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return start, i+1
                      i+=1; continue
                  if state=='line':
                      if c=='\n': state='code'
                      i+=1; continue
                  if state=='block':
                      if c=='*' and n=='/': state='code'; i+=2; continue
                      i+=1; continue
                  if state in ('string','template'):
                      if c=='\\': i+=2; continue
                      if (state=='string' and c==quote) or (state=='template' and c=='`'):
                          state='code'
                      i+=1; continue
              raise RuntimeError(f'unclosed function: {name}')

          def extract_function(src, name):
              a,b=function_span(src,name); return src[a:b]

          def replace_function(src, name, replacement):
              a,b=function_span(src,name); return src[:a]+replacement+src[b:]

          claim_pairs=[]
          for n in ('50','51'):
              claim_pairs += [
                  (f'PRODUCT SITE・{n}製品','PRODUCT SITE・52製品'),
                  (f'PRODUCT SITE / {n}製品','PRODUCT SITE / 52製品'),
                  (f'{n}製品','52製品'),(f'{n}システム','52システム'),
                  (f'{n}の業種別','52の業種別'),(f'{n}の完成DPRO','52の完成DPRO'),
                  (f'{n}の完成システム','52の完成システム'),
                  (f'{n} OFFICIAL GUIDES','52 OFFICIAL GUIDES'),
                  (f'{n}件を表示中','52件を表示中')
              ]
          def normalize_claims(text):
              for a,b in claim_pairs: text=text.replace(a,b)
              text=re.sub(r'(data-product-count[^>]*>)(?:50|51)(<)',r'\g<1>52\2',text)
              return text

          # Source-level normalization across public HTML.
          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              ns=normalize_claims(s)
              if ns!=s: p.write_text(ns,encoding='utf-8')

          idx=Path('index.html').read_text(encoding='utf-8')
          assert re.search(r'data-product-count[^>]*>52<',idx), 'index product count not canonical 52'

          # Direct site-config source based on the complete 51 lock, with no 51->52 text walker.
          sc=gitshow(REF51,'site-config.js')
          sc=sc.replace('productCount: 51','productCount: 52')
          sc=normalize_claims(sc)
          direct_fn='''function normalizeProductClaims() {\n    document.querySelectorAll('[data-product-count]').forEach((el) => {\n      el.textContent = String(CFG.productCount);\n    });\n    document.querySelectorAll('[data-product-site]').forEach((el) => {\n      if (!el.getAttribute('href')) el.setAttribute('href', PRODUCT_SITE);\n    });\n  }'''
          sc=replace_function(sc,'normalizeProductClaims',direct_fn)
          Path('site-config.js').write_text(sc,encoding='utf-8')

          # Systems hub: preserve the 51 canonical cards and add Visit Ahaki statically as #52.
          hubp=Path('systems/index.html')
          hub=hubp.read_text(encoding='utf-8')
          before_hrefs=re.findall(r'<a class="sys33-card"[^>]*href="([^"]+)"',hub)
          if 'visit-ahaki' not in before_hrefs:
              visit='<a class="sys33-card" data-system-category="medical" data-dpro-visit-ahaki-card="1" href="visit-ahaki"><span class="sys33-card__cat">医療・ペット</span><h3>訪問マッサージ・鍼灸</h3><p>問い合わせ・患者・訪問予定・施術者割当・施術記録・家族連絡・継続管理</p><span class="sys33-card__more">公式説明を見る <b>→</b></span></a>'
              pos=hub.find('href="osteopathic"')
              if pos<0: raise RuntimeError('osteopathic card not found')
              end=hub.find('</a>',pos)
              if end<0: raise RuntimeError('osteopathic card end not found')
              hub=hub[:end+4]+visit+hub[end+4:]
          hub=normalize_claims(hub)
          hub=re.sub(r'(data-filter-count="all"[^>]*>)\d+(<)',r'\g<1>52\2',hub)
          hub=re.sub(r'(data-filter-count="medical"[^>]*>)\d+(<)',r'\g<1>6\2',hub)
          hub=re.sub(r'(data-system-result-count[^>]*>)\d+件を表示中(<)',r'\g<1>52件を表示中\2',hub)

          def patch_jsonld(m):
              obj=json.loads(m.group(2))
              def walk(x):
                  if isinstance(x,dict):
                      if x.get('@type')=='ItemList' and isinstance(x.get('itemListElement'),list):
                          url='https://dpro-shop.com/systems/visit-ahaki'
                          if not any(isinstance(i,dict) and i.get('url')==url for i in x['itemListElement']):
                              x['itemListElement'].append({'@type':'ListItem','position':52,'url':url,'name':'DPRO 訪問マッサージ・鍼灸'})
                          x['numberOfItems']=52
                      for k,v in list(x.items()):
                          if isinstance(v,str): x[k]=normalize_claims(v)
                          else: walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(obj)
              return m.group(1)+json.dumps(obj,ensure_ascii=False,separators=(',',':'))+m.group(3)
          hub=re.sub(r'(<script type="application/ld\+json">)(.*?)(</script>)',patch_jsonld,hub,flags=re.S)
          hubp.write_text(hub,encoding='utf-8')

          # Flatten systems runtime: direct stable core + preserved Bakery tutorial only.
          core=gitshow(CORE50,'systems/systems.js')
          addon51=gitshow(REF51,'systems/systems.js')
          bakery=extract_function(addon51,'injectBakeryTutorial')
          final_js=core.rstrip()+"\n\n/* DPRO BAKERY tutorial bridge preserved after canonical-52 flattening. */\n(() => {\n  'use strict';\n"+bakery+"\n  injectBakeryTutorial();\n})();\n"
          Path('systems/systems.js').write_text(final_js,encoding='utf-8')

          # Canonical sitemap contains #52 once.
          smp=Path('sitemap.xml'); sm=smp.read_text(encoding='utf-8')
          url='https://dpro-shop.com/systems/visit-ahaki'
          if url not in sm:
              sm=sm.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-09-03</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>\n</urlset>')
          assert sm.count(url)==1
          smp.write_text(sm,encoding='utf-8')

          # Source/regression QA.
          final_hub=hubp.read_text(encoding='utf-8')
          after_hrefs=re.findall(r'<a class="sys33-card"[^>]*href="([^"]+)"',final_hub)
          assert len(before_hrefs)==51, f'preexisting card count={len(before_hrefs)}'
          assert len(after_hrefs)==52, f'canonical card count={len(after_hrefs)}'
          assert set(before_hrefs).issubset(after_hrefs) and len(set(after_hrefs))==52
          assert 'visit-ahaki' in after_hrefs
          assert 'numberOfItems":52' in final_hub and 'position":52' in final_hub
          assert re.search(r'data-filter-count="all"[^>]*>52<',final_hub)
          assert re.search(r'data-filter-count="medical"[^>]*>6<',final_hub)
          assert '51システム' not in final_hub and '51製品' not in final_hub
          site_cfg=Path('site-config.js').read_text(encoding='utf-8')
          systems_js=Path('systems/systems.js').read_text(encoding='utf-8')
          assert 'productCount: 52' in site_cfg
          assert 'cdn.jsdelivr.net/gh/dpromstk2000-lab/dpro-shop-official-site@' not in site_cfg
          assert 'cdn.jsdelivr.net/gh/dpromstk2000-lab/dpro-shop-official-site@' not in systems_js
          assert 'prepareMedicalHub' not in systems_js
          print('OFFICIAL_CANONICAL_52_QA=PASS cards=52 medical=6 structured=52 old51_preserved=51/51')
          PY
          node --check site-config.js
          node --check systems/systems.js
      - name: Commit normalized canonical source
        shell: bash
        run: |
          rm -f .github/workflows/normalize-visit-ahaki-52-canonical.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Normalize DPRO SHOP canonical source to 52 products"
          git push
