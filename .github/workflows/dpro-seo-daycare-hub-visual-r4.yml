name: DPRO SEO DAYCARE Hub Visual R4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update SEO hub
        shell: bash
        env:
          HUB_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64,pathlib; p=pathlib.Path("seo/index.html"); p.write_bytes(base64.b64decode(os.environ["HUB_B64"]))'
          grep -q 'SEO DAYCARE HUB R4 20261001' seo/index.html
          grep -q 'LATEST BRUSHUP / EMERGENCY' seo/index.html
          grep -q '自動段階配信' seo/index.html
          grep -q 'family-line-flow.svg' seo/index.html
          grep -q 'emergency-routing-mobile.svg' seo/index.html
          echo "HUB_R4_STATIC_QA=PASS"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Brush up DAYCARE SEO guide hub R4"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO SEO DAYCARE Hub Visual R4"
            echo ""
            echo "- SEO hub hero visual: added"
            echo "- 5 guide cards: image thumbnails added"
            echo "- Emergency brushup spotlight: added"
            echo "- Disaster / resend / next contact / auto escalation: highlighted"
            echo "- Existing care software vs DPRO positioning: added"
            echo "- Mobile vertical diagrams: reused"
            echo "- Existing 5 guide URLs: preserved"
          } >> "$GITHUB_STEP_SUMMARY"
