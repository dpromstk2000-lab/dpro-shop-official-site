name: DPRO Official 52-54 Detail Page Parity Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-official-52-54-detail-parity-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-official-52-54-detail-parity-fix
  cancel-in-progress: false

jobs:
  parity_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify target scope has not drifted
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)"
          test "$(git hash-object systems/visit-ahaki.html)" = "f9bbbd8f1f528af12b31bb76610d277d5cdb0c76"
          test "$(git hash-object systems/landscape-exterior.html)" = "3d1b3bdb86e926afa733cbe6a3fa290992121b26"
          test "$(git hash-object systems/pest-env.html)" = "8ecad566b2fbe3aeaff8e4d9ba6cee10ba302ea0"
          echo "TARGET_SCOPE_DRIFT=NONE"

      - name: Install formal Official detail pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          payloads = {'systems/visit-ahaki.html': '', 'systems/landscape-exterior.html': '', 'systems/pest-env.html': ''}
          for path,b64 in payloads.items():
              Path(path).write_bytes(base64.b64decode(b64))
              print('WROTE', path, Path(path).stat().st_size)
          PY

      - name: Blocking detail parity QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets = ["systems/visit-ahaki.html","systems/landscape-exterior.html","systems/pest-env.html"]
          required_ids = ["summary","system-map","features","flow","roles","demo","after","safety","pricing","documents","faq"]
          for path in targets:
              s=Path(path).read_text(encoding="utf-8")
              assert 'class="system-product-page official-product-page parity-product-page' in s, path
              assert "systems-hub-page" not in s and "systems-v33-page" not in s, path
              for sec in required_ids:
                  assert f'id="{sec}"' in s, (path,sec)
              assert s.count('class="parity-feature"') == 10, path
              assert s.count('class="parity-flow-step"') == 6, path
              assert s.count('class="parity-role"') == 4, path
              assert s.count('class="parity-demo-card"') == 4, path
              assert s.count("<details>") >= 5, path
              assert "33,000円" in s and "月額1,100円" in s, path
              assert '<link rel="stylesheet" href="systems.css?v=1">' in s, path
              assert "@media(max-width:720px)" in s and "@media(max-width:420px)" in s, path
          assert "QUICK_START_MASTER_V1.2.2_20260905.pdf" in Path(targets[0]).read_text(encoding="utf-8")
          assert "DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf" in Path(targets[0]).read_text(encoding="utf-8")
          assert "QUICK_START_MASTER_V1.2.2_20260905.pdf" in Path(targets[1]).read_text(encoding="utf-8")
          assert "DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf" in Path(targets[1]).read_text(encoding="utf-8")
          p54=Path(targets[2]).read_text(encoding="utf-8")
          assert "QUICK_START_FINAL_V1.2.2.pdf" in p54 and "DETAILED_MANUAL_FINAL_V1.2.2.pdf" in p54
          assert "DPRO_PEST_ENV_A4_FLYER_FINAL_V1.1_G8.pdf" in p54
          print("OFFICIAL_DETAIL_PAGE_PARITY=PASS")
          print("TARGETS=3")
          print("FEATURES_EACH=10")
          print("FLOW_STEPS_EACH=6")
          print("ROLE_CARDS_EACH=4")
          print("DEMO_CARDS_EACH=4")
          print("PRICING=PASS")
          print("CURRENT_SUPPORT_LINKS=PASS")
          PY
          git diff --check

      - name: Commit parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO CENTRAL"
          git config user.email "actions@users.noreply.github.com"
          git add systems/visit-ahaki.html systems/landscape-exterior.html systems/pest-env.html
          git commit -m "fix: align products 52-54 official detail page parity"
          git push origin HEAD:main

      - name: Optional temporary workflow cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/dpro-official-52-54-detail-parity-fix.yml
          git commit -m "chore: remove temporary official detail parity workflow"
          git push origin HEAD:main

      - name: Final summary
        shell: bash
        run: |
          echo "DPRO OFFICIAL DETAIL PARITY: PASS"
          echo "PRODUCT_52=FORMAL_DETAIL_PAGE"
          echo "PRODUCT_53=FORMAL_DETAIL_PAGE"
          echo "PRODUCT_54=FORMAL_DETAIL_PAGE"
          echo "CORE_REBUILD=NONE"
          echo "SHARED_CSS_CHANGE=NONE"
