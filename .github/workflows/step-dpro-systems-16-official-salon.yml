name: STEP DPRO-SYSTEMS-16 Official Salon Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-16-official-salon.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create official salon page only
        shell: python
        run: |
          from pathlib import Path
          import base64

          page = base64.b64decode("").decode("utf-8")
          target = Path("systems/salon.html")
          target.parent.mkdir(exist_ok=True)
          target.write_text(page, encoding="utf-8")

          content = target.read_text(encoding="utf-8")
          assert "公式製品紹介ページ" in content
          assert "DPRO 美容サロン LINE" in content
          assert "美容サロン・複合ビューティーサロン" in content
          assert "LINEから新規予約" in content
          assert "電話・店頭予約" in content
          assert "LINE文面の作成・コピー" in content
          assert "シンプル管理" in content
          assert "スタッフ用" in content
          assert "美容室とは別" in content
          assert "https://dpro-shop.com/systems/salon" in content
          assert "https://dpromstk2000-lab.github.io/liff-salon-reserve/" in content
          assert "system-check" not in content
          assert "営業前DEMO準備" not in content
          assert "STEP SALON-" not in content

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add systems/salon.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          test "$changed" = "systems/salon.html"
          git commit -m "STEP DPRO-SYSTEMS-16 add official salon page"
          git push
