name: STEP DPRO-SYSTEMS-9 Official Day Service Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-9-official-dayservice.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create official day service page and connect catalog
        shell: python
        run: |
          from pathlib import Path
          import base64
          import xml.etree.ElementTree as ET

          page = base64.b64decode("").decode("utf-8")
          css_append = base64.b64decode("").decode("utf-8")
          card = base64.b64decode("").decode("utf-8")
          old_item = base64.b64decode("ICAgICAgICB7CiAgICAgICAgICAiQHR5cGUiOiJMaXN0SXRlbSIsCiAgICAgICAgICAicG9zaXRpb24iOjYsCiAgICAgICAgICAidXJsIjoiaHR0cHM6Ly9kcHJvLXNob3AuY29tL3N5c3RlbXMvcmVwYWlyIiwKICAgICAgICAgICJuYW1lIjoiRFBSTyDkv67nkIblj5fku5ggTElORSIKICAgICAgICB9").decode("utf-8")
          new_item = base64.b64decode("").decode("utf-8")

          systems_dir = Path("systems")
          systems_dir.mkdir(exist_ok=True)

          page_path = systems_dir / "dayservice.html"
          page_path.write_text(page, encoding="utf-8")

          css_path = systems_dir / "systems.css"
          css = css_path.read_text(encoding="utf-8")
          marker = "/* DPRO-SYSTEMS-9 DAY SERVICE PRODUCT PAGE */"
          if marker not in css:
              css_path.write_text(
                  css.rstrip() + "\n\n" + css_append.strip() + "\n",
                  encoding="utf-8"
              )

          index_path = systems_dir / "index.html"
          index = index_path.read_text(encoding="utf-8")

          if 'href="dayservice" data-system-category="welfare-care"' not in index:
              target = '<div class="systems-empty" data-system-empty hidden>該当する公開ページは、現在準備中です。</div>'
              if target not in index:
                  raise SystemExit("ERROR: catalog card target not found")
              index = index.replace(target, card + "\n" + target, 1)

          if '"numberOfItems":6' in index:
              index = index.replace('"numberOfItems":6', '"numberOfItems":7', 1)
          elif '"numberOfItems":7' not in index:
              raise SystemExit("ERROR: ItemList count target not found")

          if '"url":"https://dpro-shop.com/systems/dayservice"' not in index:
              if old_item not in index:
                  raise SystemExit("ERROR: JSON-LD target not found")
              index = index.replace(old_item, new_item, 1)

          footer_old = '<div><strong>PRODUCT</strong><a href="./">DPROシステム</a><a href="vet">動物病院</a><a href="shuttle">福祉施設送迎</a><a href="caretaxi">介護タクシー</a><a href="estate">不動産・賃貸内見</a><a href="cleaning">クリーニング</a><a href="repair">修理受付</a></div>'
          footer_new = '<div><strong>PRODUCT</strong><a href="./">DPROシステム</a><a href="vet">動物病院</a><a href="shuttle">福祉施設送迎</a><a href="caretaxi">介護タクシー</a><a href="estate">不動産・賃貸内見</a><a href="cleaning">クリーニング</a><a href="repair">修理受付</a><a href="dayservice">デイサービス</a></div>'
          if footer_new not in index:
              if footer_old not in index:
                  raise SystemExit("ERROR: footer target not found")
              index = index.replace(footer_old, footer_new, 1)

          index_path.write_text(index, encoding="utf-8")

          sitemap_path = Path("sitemap.xml")
          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          target_url = "https://dpro-shop.com/systems/dayservice"

          urls = [
              node.find(ns + "loc").text
              for node in root.findall(ns + "url")
              if node.find(ns + "loc") is not None
          ]

          if target_url not in urls:
              node = ET.SubElement(root, ns + "url")
              ET.SubElement(node, ns + "loc").text = target_url
              ET.SubElement(node, ns + "lastmod").text = "2026-07-30"
              ET.SubElement(node, ns + "changefreq").text = "monthly"
              ET.SubElement(node, ns + "priority").text = "0.9"

          for node in root.findall(ns + "url"):
              loc = node.find(ns + "loc")
              if loc is not None and loc.text == "https://dpro-shop.com/systems/":
                  lastmod = node.find(ns + "lastmod")
                  if lastmod is not None:
                      lastmod.text = "2026-07-30"

          tree.write(sitemap_path, encoding="utf-8", xml_declaration=True)

          updated_page = page_path.read_text(encoding="utf-8")
          updated_index = index_path.read_text(encoding="utf-8")
          updated_css = css_path.read_text(encoding="utf-8")
          updated_sitemap = sitemap_path.read_text(encoding="utf-8")

          assert "公式製品紹介ページ" in updated_page
          assert "DPRO デイサービス LINE" in updated_page
          assert "介護請求ソフトではない" in updated_page
          assert "system-check" not in updated_page
          assert "営業前チェック" not in updated_page
          assert "STEP DAYCARE-" not in updated_page
          assert 'href="dayservice" data-system-category="welfare-care"' in updated_index
          assert '"numberOfItems":7' in updated_index
          assert '"url":"https://dpro-shop.com/systems/dayservice"' in updated_index
          assert '<a href="dayservice">デイサービス</a>' in updated_index
          assert marker in updated_css
          assert target_url in updated_sitemap

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add systems/dayservice.html systems/index.html systems/systems.css sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-9 add official day service page"
          git push
