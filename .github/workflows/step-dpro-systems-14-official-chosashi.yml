name: STEP DPRO-SYSTEMS-14 Official Chosashi Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-14-official-chosashi.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create official chosashi page only
        shell: python
        run: |
          from pathlib import Path
          import base64
          from html.parser import HTMLParser

          page = base64.b64decode("").decode("utf-8")
          target = Path("systems/chosashi.html")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(page, encoding="utf-8")

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicate_ids = []
                  self.title_found = False
                  self.canonical_found = False
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == "title":
                      self.title_found = True
                  if tag == "link" and data.get("rel") == "canonical" and data.get("href") == "https://dpro-shop.com/systems/chosashi":
                      self.canonical_found = True
                  if "id" in data:
                      if data["id"] in self.ids:
                          self.duplicate_ids.append(data["id"])
                      self.ids.add(data["id"])

          checker = Checker()
          checker.feed(page)

          assert "DPRO 土地家屋調査士 LINE" in page
          assert "公式製品紹介ページ" in page
          assert "土地・建物相談受付" in page
          assert "案件マイページ" in page
          assert "必要書類の依頼・提出" in page
          assert "隣接地・境界立会い管理" in page
          assert "現場報告・写真・位置情報" in page
          assert page.count('class="product-feature reveal"') == 10
          assert page.count('class="product-live-row"') == 5
          assert page.count('class="product-flow-step reveal"') == 8
          assert "system-check" not in page.lower()
          assert "営業前DEMO準備" not in page
          assert "STEP CHOSASHI-" not in page
          assert not checker.duplicate_ids
          assert checker.canonical_found

          # 担当範囲外の共通ファイルは変更しない
          assert target.as_posix() == "systems/chosashi.html"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add systems/chosashi.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-14 add official chosashi page"
          git push
