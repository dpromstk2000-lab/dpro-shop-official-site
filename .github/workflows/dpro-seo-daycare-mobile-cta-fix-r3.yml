name: DPRO SEO DAYCARE Mobile CTA Fix R3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply mobile visual and CTA fix
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          test -f assets/seo-daycare-r2/family-line-flow-mobile.svg
          test -f assets/seo-daycare-r2/emergency-routing-mobile.svg
          test -f assets/seo-daycare-r2/absence-flow-mobile.svg
          test -f assets/seo-daycare-r2/rehab-complement-mobile.svg
          test -f assets/seo-daycare-r2/transport-split-mobile.svg
          grep -q 'SEO DAYCARE MOBILE R3 20261001' seo/carefacility-emergency-contact.html
          grep -q 'background:#fff;color:#073c2a' seo/carefacility-emergency-contact.html
          grep -q 'emergency-routing-mobile.svg' seo/carefacility-emergency-contact.html
          echo "R3_STATIC_QA=PASS"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo assets/seo-daycare-r2
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix DAYCARE SEO CTA contrast and mobile diagrams R3"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO SEO DAYCARE Mobile + CTA Fix R3"
            echo ""
            echo "- DPRO POSITION white CTA text contrast: fixed"
            echo "- 5 mobile-specific vertical diagrams: added"
            echo "- Desktop diagrams: preserved"
            echo "- Mobile picture source switching: added"
            echo "- Mobile visual note/card spacing: adjusted"
            echo "- Emergency R2 content: preserved"
          } >> "$GITHUB_STEP_SUMMARY"
