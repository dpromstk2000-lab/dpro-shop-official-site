name: DPRO Clinic Shuttle V1.2 Brushup B1-B4 R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-v12-brushup-b1-b4-r1.yml"
      - ".github/workflows/clinic-shuttle-v12-brushup-b1-b4-r1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-v12-brushup-b1-b4-r1
  cancel-in-progress: false

jobs:
  brushup-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Guard REL-01 FACT LOCK and baseline HEADs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b92a4d6444375aefc481db267d626c5a712164a5" || {
            echo "OFFICIAL drift before V1.2 brushup"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          PRODUCT_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-line-systems-site.git refs/heads/main | awk '{print $1}')"
          test "$PRODUCT_HEAD" = "357f01ca3d2d0596e57af8e893cc7e76eff5f3b1" || {
            echo "PRODUCT drift: $PRODUCT_HEAD"; exit 1;
          }
          CONTROL_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-shop-control-center.git refs/heads/main | awk '{print $1}')"
          test "$CONTROL_HEAD" = "47afd09887aab6d9430005c49eca87cd8c93d0ce" || {
            echo "CONTROL CENTER drift: $CONTROL_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install V1.2 QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pymupdf numpy opencv-python-headless zxing-cpp pillow
          python -m playwright install --with-deps chromium

      - name: Preserve one-shot runner
        run: cp .github/workflows/clinic-shuttle-v12-brushup-b1-b4-r1.py /tmp/clinic-shuttle-v12-brushup.py

      - name: REL-B1 FACT scan and close audited DEF-016 locally
        run: python /tmp/clinic-shuttle-v12-brushup.py prepare

      - name: Commit only DEF-016 fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html
          git rm -f \
            .github/workflows/clinic-shuttle-v12-brushup-b1-b4-r1.yml \
            .github/workflows/clinic-shuttle-v12-brushup-b1-b4-r1.py
          git commit -m "Close clinic shuttle V1.2 DEF-016 and run release brushup"
          FINAL_HEAD="$(git rev-parse HEAD)"
          echo "FINAL_OFFICIAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          git push origin main

      - name: REL-B2 B3 and B4 public evidence
        run: python /tmp/clinic-shuttle-v12-brushup.py publicqa

      - name: Upload V1.2 brushup evidence
        uses: actions/upload-artifact@v4
        with:
          name: clinic-shuttle-v12-brushup-evidence
          path: release-evidence-v12/
          if-no-files-found: error
          retention-days: 30
