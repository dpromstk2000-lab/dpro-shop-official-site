name: OFFICIAL Japanese heading wrap fix V1.4R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-japanese-wrap-fix-v1-4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: official-japanese-wrap-fix-v1-4r1
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply final runtime and page-specific Japanese wrap fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import html
          import re
          import json

          targets = {
              "systems/systems.js": {
                  "old": '<h2>ここまでが公式説明。<br>次は完成システムを実際に操作。</h2>',
                  "new": '<h2>ここまでが公式説明。<br>次は完成システムを<span class="dpro-jp-keep">実際に操作。</span></h2>',
              },
              "systems/salon.html": {
                  "old": '<h3>担当者と希&#8288;望&#8288;日&#8288;を&#8288;選&#8288;択</h3>',
                  "new": '<h3>担当者と<span class="dpro-jp-keep">希望日を選択</span></h3>',
              },
              "systems/bakery.html": {
                  "old": '<h1 id="product-title"><span>パンの魅力を写真で伝え、</span><span><em>そのままLINEで<span class="dpro-jp-keep">取&#8288;り&#8288;置&#8288;き&#8288;</span>へ&#8288;。</em></span></h1>',
                  "new": '<h1 id="product-title"><span>パンの魅力を写真で伝え、</span><span><em>そのままLINEで<span class="dpro-jp-keep">取り置きへ。</span></em></span></h1>',
              },
              "systems/esthe.html": {
                  "old": '<h3>来店から施&#8288;術&#8288;完&#8288;了&#8288;ま&#8288;で</h3>',
                  "new": '<h3>来店から<span class="dpro-jp-keep">施術完了まで</span></h3>',
              },
          }

          WJ_ENTITIES = ("&#8288;", "&#x2060;", "&#X2060;")
          TAG_RE = re.compile(r"<[^>]+>", re.S)
          PRICE_RE = re.compile(r"(?:\d{1,3}(?:,\d{3})+|\d+)円")
          URL_RE = re.compile(
              r'''(?:href|src|data-src|data-demo-url|data-demo-src|data-live-url|data-live-src)\s*=\s*(["'])(.*?)\1''',
              re.I | re.S,
          )

          def customer_text(source):
              for entity in WJ_ENTITIES:
                  source = source.replace(entity, "")
              source = source.replace("\u2060", "")
              source = TAG_RE.sub("", source)
              source = html.unescape(source)
              return re.sub(r"\s+", " ", source).strip()

          def prices(source):
              cleaned = source
              for entity in WJ_ENTITIES:
                  cleaned = cleaned.replace(entity, "")
              cleaned = cleaned.replace("\u2060", "")
              return Counter(PRICE_RE.findall(cleaned))

          def urls(source):
              return Counter(m.group(2) for m in URL_RE.finditer(source))

          stats = {}

          for filename, rule in targets.items():
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing required target: {filename}")

              before = path.read_text(encoding="utf-8")
              old_count = before.count(rule["old"])
              new_count_before = before.count(rule["new"])

              if old_count != 1:
                  raise SystemExit(
                      f"{filename}: expected exactly 1 current target, got {old_count}"
                  )
              if new_count_before:
                  raise SystemExit(
                      f"{filename}: V1.4R1 replacement already present before rewrite"
                  )

              before_text = customer_text(before)
              before_prices = prices(before)
              before_urls = urls(before)

              after = before.replace(rule["old"], rule["new"], 1)

              if customer_text(after) != before_text:
                  raise SystemExit(f"{filename}: customer-visible text changed")
              if prices(after) != before_prices:
                  raise SystemExit(f"{filename}: price strings changed")
              if urls(after) != before_urls:
                  raise SystemExit(f"{filename}: URL attributes changed")
              if after.count(rule["new"]) != 1:
                  raise SystemExit(f"{filename}: replacement verification failed")

              path.write_text(after, encoding="utf-8")
              stats[filename] = {
                  "target_count": old_count,
                  "replacement_count": after.count(rule["new"]),
              }

          # Shared runtime fix must remain a single source of truth.
          systems_js = Path("systems/systems.js").read_text(encoding="utf-8")
          assert systems_js.count(
              '<span class="dpro-jp-keep">実際に操作。</span>'
          ) == 1

          salon = Path("systems/salon.html").read_text(encoding="utf-8")
          bakery = Path("systems/bakery.html").read_text(encoding="utf-8")
          esthe = Path("systems/esthe.html").read_text(encoding="utf-8")

          assert '<span class="dpro-jp-keep">希望日を選択</span>' in salon
          assert '<span class="dpro-jp-keep">取り置きへ。</span>' in bakery
          assert '<span class="dpro-jp-keep">施術完了まで</span>' in esthe

          # Existing shared nowrap rule must be present; do not add a second CSS system.
          systems_css = Path("systems/systems.css").read_text(encoding="utf-8")
          if ".dpro-jp-keep" not in systems_css:
              raise SystemExit("systems/systems.css: dpro-jp-keep rule missing")

          Path("/tmp/official-v14r1.json").write_text(
              json.dumps(stats, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("OFFICIAL V1.4R1 PREP PASS")
          print(Path("/tmp/official-v14r1.json").read_text(encoding="utf-8"))
          PY

      - name: Static safety QA
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          changed="$(git diff --name-only)"
          echo "$changed"

          expected="$(printf '%s\n' \
            systems/bakery.html \
            systems/esthe.html \
            systems/salon.html \
            systems/systems.js | sort)"
          actual="$(printf '%s\n' "$changed" | sed '/^$/d' | sort)"

          test "$actual" = "$expected"

          python - <<'PY'
          from pathlib import Path
          import json

          stats = json.loads(
              Path("/tmp/official-v14r1.json").read_text(encoding="utf-8")
          )
          assert set(stats) == {
              "systems/systems.js",
              "systems/salon.html",
              "systems/bakery.html",
              "systems/esthe.html",
          }

          js = Path("systems/systems.js").read_text(encoding="utf-8")
          salon = Path("systems/salon.html").read_text(encoding="utf-8")
          bakery = Path("systems/bakery.html").read_text(encoding="utf-8")
          esthe = Path("systems/esthe.html").read_text(encoding="utf-8")

          assert '完成システムを<span class="dpro-jp-keep">実際に操作。</span>' in js
          assert '<span class="dpro-jp-keep">希望日を選択</span>' in salon
          assert '<span class="dpro-jp-keep">取り置きへ。</span>' in bakery
          assert '<span class="dpro-jp-keep">施術完了まで</span>' in esthe

          print("OFFICIAL V1.4R1 STATIC QA PASS")
          PY

      - name: Commit V1.4R1 and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            systems/systems.js \
            systems/salon.html \
            systems/bakery.html \
            systems/esthe.html

          git rm .github/workflows/official-japanese-wrap-fix-v1-4.yml

          git commit -m "Finish OFFICIAL Japanese mobile wraps V1.4R1"
          git push origin HEAD:main

      - name: Wait for public deployment
        shell: bash
        run: |
          echo "Waiting for GitHub Pages deployment..."
          sleep 75

      - name: Dispatch Japanese mobile reaudit V1.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run japanese-mobile-reaudit-v1.yml \
            --repo dpromstk2000-lab/dpro-shop-official-site \
            --ref main
          echo "Dispatched JAPANESE mobile visual reaudit V1.1"
