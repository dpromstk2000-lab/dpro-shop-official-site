name: DPRO Clinic Shuttle Visibility Final QA R7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-visibility-final-qa-r7.yml"
      - ".github/workflows/clinic-shuttle-visibility-final-qa-r7.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-visibility-final-qa-r7
  cancel-in-progress: false

jobs:
  visibility-final-qa-r7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Guard R5 fix SYSTEM FINAL LOCK and PRODUCT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a6321a681d236dec4067ee8bb76ff285cef90a4b" || {
            echo "OFFICIAL R6 parent drift"; exit 1;
          }
          grep -q "DPRO CLINIC SHUTTLE R5" systems/clinic-shuttle.html
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          PRODUCT_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-line-systems-site.git refs/heads/main | awk '{print $1}')"
          test "$PRODUCT_HEAD" = "7bfb6ae44e53aeb470664aeec2991752ae5c3cbc" || {
            echo "PRODUCT head drift: $PRODUCT_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Human-like final visibility QA
        run: python .github/workflows/clinic-shuttle-visibility-final-qa-r7.py

      - name: Commit R7 verified completion evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clinic-shuttle-release
          git commit -m "Verify clinic shuttle final visible content R7"
          git push origin main

      - name: Remove R5 R6 R7 one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          for f in \
            .github/workflows/clinic-shuttle-visibility-hotfix-r5.yml \
            .github/workflows/clinic-shuttle-visibility-hotfix-r5.py \
            .github/workflows/clinic-shuttle-visibility-final-qa-r6.yml \
            .github/workflows/clinic-shuttle-visibility-final-qa-r6.py \
            .github/workflows/clinic-shuttle-visibility-final-qa-r7.yml \
            .github/workflows/clinic-shuttle-visibility-final-qa-r7.py; do
              test -e "$f" && git rm -f "$f" || true
          done
          git commit -m "Remove completed clinic shuttle visibility workflows"
          git push origin main
