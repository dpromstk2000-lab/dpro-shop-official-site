name: OFFICIAL Japanese heading wrap fix V1.3R1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-japanese-wrap-fix-v1-3.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix remaining OFFICIAL Japanese wraps across inline tags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import html
          import re
          import subprocess

          HEADING_RULES = {'難しい仕組みを、店舗で使える形にする。': ['形にする。'], '休日を登録する。ホームページにも出る。': ['にも出る。'], 'パンの魅力を写真で伝え、そのままLINEで取り置きへ。': ['取り置きへ。'], '30秒で分かる、このシステムの役割。': ['システムの役割。'], 'ここまでが公式説明。次は完成システムを実際に操作。': ['実際に操作。'], '利用相談から、通所・送迎・作業・支援・工賃まで。': ['利用相談から、', '作業・支援・工賃まで。'], '説明画像ではなく、実際の操作デモを体験。': ['操作デモを体験。'], '利用者・家族・現場・管理を、同じ利用者情報で確認。': ['利用者情報で確認。'], '説明画像ではなく、実際の操作デモを確認。': ['操作デモを確認。'], '介護の相談から、ケアプランと家族連携まで。': ['介護の相談から、', '家族連携まで。'], '説明画像ではなく、完成した実画面を体験。': ['実画面を体験。'], '送迎依頼の受付から、配車・運行・請求まで。': ['送迎依頼の受付から、', '配車・運行・請求まで。'], '30秒で分かる、介護タクシー業務の流れ。': ['業務の流れ。'], 'お預かりの受付から、仕上がり・受け渡しまで。': ['お預かりの受付から、', '受け渡しまで。'], '30秒で分かる、受付から受け渡しまでの流れ。': ['までの流れ。'], 'ご家族との連絡から、送迎・今日の利用状況まで。': ['ご家族との連絡から、', '利用状況まで。'], '待ち列・次の予約・急患受付': ['予約・急患受付'], '片付けのお困りごとを相談': ['お困りごとを相談'], '内見予約の受付から、追客・申込・契約準備まで。': ['内見予約の受付から、', '契約準備まで。'], '来店から施術完了まで': ['施術完了まで'], '説明画像ではなく、実際に動く7つの画面。': ['7つの画面。'], '大切な情報を扱うから、急ぎ・日時・連絡先・権限に配慮。': ['権限に配慮。'], '植物と鉢を、「いまどこにあるか」まで。': ['あるか」まで。'], '作業前後を、お客様へ分かりやすく。': ['分かりやすく。'], '説明画像ではなく、本物の5画面を体験。': ['5画面を体験。'], 'LINE予約から施術後の再来店フォローまで。': ['再来店フォローまで。'], '訪問予定から、ご家族への報告まで。': ['訪問予定から、', 'ご家族への報告まで。'], '訪問予定から、実施記録・家族報告まで。': ['訪問予定から、', '家族報告まで。'], '電話・LINE・予約帳に分かれた確認を、今日の営業画面へまとめる。': ['営業画面へまとめる。'], 'デザイン選びから、次回来店の提案まで。': ['デザイン選びから、', '次回来店の提案まで。'], '説明画像だけでなく、実際の操作デモを確認。': ['操作デモを確認。'], '予約からお渡し、次回希望まで、同じペット情報で確認。': ['ペット情報で確認。'], '受付・準備・撮影を更新': ['準備・撮影を更新'], '30秒で分かる、写真館システムの役割。': ['写真館システムの役割。'], '修理相談の受付から、見積・進捗・引き渡しまで。': ['修理相談の受付から、', '引き渡しまで。'], '「どこへ行ったか」ではなく、次に何をするかまで残す。': ['するかまで残す。'], '説明の次は、実際の営業ナビを触る。': ['営業ナビを触る。'], '予約の入口はシンプルに、店舗側は必要なだけ高機能に。': ['だけ高機能に。'], '担当者と希望日を選択': ['希望日を選択'], '汎用版でできることと、専門版へ分けるもの。': ['専門版へ分けるもの。'], '注文受付から、厨房・配達・家族連絡まで。': ['注文受付から、', '家族連絡まで。'], '事業所・利用者・厨房・配達を、実際の完成画面で確認。': ['完成画面で確認。'], 'ご家族の連絡から、配車・乗降・引渡しまで。': ['ご家族の連絡から、', '引渡しまで。'], '初回相談から、計画・提出・モニタリングまで。': ['初回相談から、', 'モニタリングまで。'], '宿泊前の連絡から、清掃・忘れ物対応まで。': ['宿泊前の連絡から、', '忘れ物対応まで。'], '連絡手段を増やすのではなく、宿泊情報へまとめる。': ['宿泊情報へまとめる。'], 'カメラで診察券QRを読取': ['診察券QRを読取'], '30秒で分かる、予約と順番受付の違い。': ['順番受付の違い。']}

          SUMMARY_RULES = {
              "現在の電子申請・給与計算・勤怠システムと併用できますか。": ["勤怠システム"],
              "送迎車の現在地を地図で追跡するシステムですか。": ["追跡するシステム"],
              "今使っている販売管理や整備システムと併用できますか。": ["整備システム"],
              "どのDPROシステムが合うか分かりません。": ["分かりません。"],
              "LINE運用契約店舗のHP保守1,100円とは？": ["1,100円とは？"],
          }
          H4_RULES = {
              "写真から、贈るお花を選ぶ": ["写真から、"],
          }
          BUTTON_RULES = {
              "この画面を大きく表示": ["大きく表示"],
          }

          WJ = "&#8288;"
          WJ_TEXT = "\u2060"
          WJ_ENTITIES = ("&#8288;", "&#x2060;", "&#X2060;")

          def clean_joiners(source):
              for entity in WJ_ENTITIES:
                  source = source.replace(entity, "")
              return source.replace(WJ_TEXT, "")

          def visible_map(inner):
              # Return visible text without whitespace plus raw end offsets for
              # each visible character. Tags are skipped, so a phrase may span
              # <em>, <span>, <br>, etc. Existing WORD JOINERs are ignored.
              chars = []
              raw_ends = []
              i = 0
              n = len(inner)

              while i < n:
                  ch = inner[i]

                  if ch == "<":
                      j = inner.find(">", i + 1)
                      if j < 0:
                          i += 1
                      else:
                          i = j + 1
                      continue

                  if ch == "&":
                      j = inner.find(";", i + 1, min(n, i + 20))
                      if j > i:
                          entity = inner[i:j + 1]
                          decoded = html.unescape(entity)
                          if decoded == WJ_TEXT:
                              i = j + 1
                              continue
                          if len(decoded) == 1:
                              if not decoded.isspace():
                                  chars.append(decoded)
                                  raw_ends.append(j + 1)
                              i = j + 1
                              continue

                  if ch == WJ_TEXT:
                      i += 1
                      continue

                  if not ch.isspace():
                      chars.append(ch)
                      raw_ends.append(i + 1)

                  i += 1

              return "".join(chars), raw_ends

          def join_visible_phrase(inner, phrase):
              target = re.sub(r"\s+", "", phrase)
              visible, raw_ends = visible_map(inner)

              start = visible.find(target)
              if start < 0:
                  return inner, False

              # Insert WORD JOINER after each visible char except the last.
              insert_positions = []
              for offset in range(len(target) - 1):
                  raw_pos = raw_ends[start + offset]
                  # Avoid duplicate if an entity already immediately follows.
                  tail = inner[raw_pos:raw_pos + 12]
                  if any(tail.startswith(entity) for entity in WJ_ENTITIES):
                      continue
                  if tail.startswith(WJ_TEXT):
                      continue
                  insert_positions.append(raw_pos)

              if not insert_positions:
                  # Phrase can already be fully joined from a previous run.
                  return inner, True

              out = inner
              for raw_pos in sorted(insert_positions, reverse=True):
                  out = out[:raw_pos] + WJ + out[raw_pos:]

              return out, True

          def apply_phrases(inner, phrases):
              # Keep existing dpro-jp-keep spans. Remove only old WORD JOINERs
              # inside this element, then rebuild all requested phrase joins.
              inner = clean_joiners(inner)
              applied = 0
              for phrase in phrases:
                  inner, ok = join_visible_phrase(inner, phrase)
                  if not ok:
                      return inner, applied, phrase
                  applied += 1
              return inner, applied, None

          def normalized_visible(inner):
              source = clean_joiners(inner)
              source = re.sub(r"<[^>]+>", "", source)
              source = html.unescape(source)
              return re.sub(r"\s+", "", source)

          def links(source):
              vals = []
              for attr in ("href", "src", "data-src", "action", "formaction"):
                  vals += re.findall(
                      rf'\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      source,
                      flags=re.I,
                  )
              return Counter(vals)

          def prices(source):
              return Counter(
                  re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', source)
              )

          def visible_document(source):
              source = clean_joiners(source)
              source = re.sub(
                  r"<script\b.*?</script>",
                  "",
                  source,
                  flags=re.I | re.S,
              )
              source = re.sub(
                  r"<style\b.*?</style>",
                  "",
                  source,
                  flags=re.I | re.S,
              )
              source = re.sub(r"<[^>]+>", "", source)
              source = html.unescape(source)
              return re.sub(r"\s+", " ", source).strip()

          tracked = [
              Path(p)
              for p in subprocess.check_output(
                  ["git", "ls-files", "*.html"],
                  text=True,
              ).splitlines()
              if not p.startswith((".github/", ".dpro/", ".dpro-next/"))
          ]

          element_re = re.compile(
              r'(<(?P<tag>h[1-4]|summary|button)\b[^>]*>)'
              r'(?P<inner>.*?)'
              r'(</(?P=tag)>)',
              flags=re.I | re.S,
          )

          seen_heading_rules = set()
          stats = {
              "heading_elements": 0,
              "heading_phrases": 0,
              "summary_elements": 0,
              "h4_elements": 0,
              "button_elements": 0,
          }
          changed_pages = set()

          for path in tracked:
              before = path.read_text(encoding="utf-8")
              before_links = links(before)
              before_prices = prices(before)
              before_visible = visible_document(before)
              local_changed = [False]

              def repl(match):
                  tag = match.group("tag").upper()
                  inner = match.group("inner")
                  compact = normalized_visible(inner)

                  if tag in ("H1", "H2", "H3"):
                      rules = HEADING_RULES.get(compact)
                      kind = "heading"
                  elif tag == "SUMMARY":
                      rules = SUMMARY_RULES.get(compact)
                      kind = "summary"
                  elif tag == "H4":
                      rules = H4_RULES.get(compact)
                      kind = "h4"
                  elif tag == "BUTTON":
                      rules = BUTTON_RULES.get(compact)
                      kind = "button"
                  else:
                      rules = None
                      kind = None

                  if not rules:
                      return match.group(0)

                  updated, applied, missing = apply_phrases(inner, rules)
                  if missing is not None:
                      raise SystemExit(
                          f"{path}: matched {kind} '{compact}' but phrase "
                          f"'{missing}' was not found across inline tags"
                      )

                  local_changed[0] = True

                  if kind == "heading":
                      stats["heading_elements"] += 1
                      stats["heading_phrases"] += applied
                      seen_heading_rules.add(compact)
                  else:
                      stats[f"{kind}_elements"] += 1

                  return match.group(1) + updated + match.group(4)

              after = element_re.sub(repl, before)

              if local_changed[0]:
                  if links(after) != before_links:
                      raise SystemExit(f"{path}: link target changed")
                  if prices(after) != before_prices:
                      raise SystemExit(f"{path}: price strings changed")
                  if visible_document(after) != before_visible:
                      raise SystemExit(
                          f"{path}: visible customer text changed"
                      )

                  path.write_text(after, encoding="utf-8")
                  changed_pages.add(str(path))

          missing_rules = set(HEADING_RULES) - seen_heading_rules
          print("Unique heading rules:", len(HEADING_RULES))
          print("Unique heading rules matched:", len(seen_heading_rules))
          print("Heading elements:", stats["heading_elements"])
          print("Heading phrases:", stats["heading_phrases"])
          print("Summary elements:", stats["summary_elements"])
          print("H4 elements:", stats["h4_elements"])
          print("Button elements:", stats["button_elements"])
          print("Changed pages:", len(changed_pages))

          if missing_rules:
              raise SystemExit(
                  "Heading rules not found in current OFFICIAL HTML: "
                  + repr(sorted(missing_rules))
              )
          if stats["summary_elements"] != 5:
              raise SystemExit(
                  f"Expected 5 summary elements, got "
                  f"{stats['summary_elements']}"
              )
          if stats["h4_elements"] != 1:
              raise SystemExit(
                  f"Expected 1 H4 element, got {stats['h4_elements']}"
              )
          if stats["button_elements"] != 1:
              raise SystemExit(
                  f"Expected 1 button element, got "
                  f"{stats['button_elements']}"
              )

          Path("/tmp/official-jp-v13r1-stats.txt").write_text(
              "\n".join(f"{k}={v}" for k, v in stats.items())
              + f"\nunique_heading_rules={len(HEADING_RULES)}"
              + f"\nmatched_heading_rules={len(seen_heading_rules)}"
              + f"\nchanged_pages={len(changed_pages)}\n",
              encoding="utf-8",
          )

          print("OFFICIAL JAPANESE WRAP V1.3R1 PREP PASS")
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stats = Path(
              "/tmp/official-jp-v13r1-stats.txt"
          ).read_text(encoding="utf-8")
          print(stats)

          assert "summary_elements=5" in stats
          assert "h4_elements=1" in stats
          assert "button_elements=1" in stats

          # Cross-tag regression check:
          about = Path("about.html").read_text(encoding="utf-8")
          assert "店舗で使える形" in about
          assert "にする。" in about
          assert "&#8288;" in about

          # Remaining HIGH regression checks:
          sharoushi = Path(
              "systems/sharoushi.html"
          ).read_text(encoding="utf-8")
          shuttle = Path(
              "systems/shuttle.html"
          ).read_text(encoding="utf-8")
          used_car = Path(
              "systems/used-car.html"
          ).read_text(encoding="utf-8")

          assert "&#8288;" in sharoushi
          assert "&#8288;" in shuttle
          assert "&#8288;" in used_car

          assert Path(
              ".github/workflows/japanese-mobile-reaudit-v1.yml"
          ).exists()

          print("OFFICIAL JAPANESE WRAP V1.3R1 STATIC QA PASS")
          PY

      - name: Commit V1.3R1 and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f \
            .github/workflows/official-japanese-wrap-fix-v1-3.yml
          git add -u

          echo "Changed paths:"
          git diff --cached --name-only

          if git diff --cached --name-only | grep -E '\.(js|css)$'; then
            echo "ERROR: V1.3R1 must not change JavaScript or CSS"
            exit 1
          fi

          git commit -m \
            "Finish OFFICIAL Japanese mobile wraps V1.3R1"
          git push origin HEAD:main

      - name: Wait for public V1.3R1 HTML
        shell: bash
        run: |
          set -e
          URL="https://dpro-shop.com/about.html?qa=${GITHUB_SHA}-${GITHUB_RUN_ID}"

          for i in $(seq 1 60); do
            page="$(curl -fsSL "$URL" 2>/dev/null || true)"
            if printf '%s' "$page" | grep -q "&#8288;"; then
              echo "OFFICIAL Japanese wrap V1.3R1 is live"
              exit 0
            fi
            echo "Waiting for V1.3R1 HTML... ${i}/60"
            sleep 5
          done

          echo "V1.3R1 source committed, but public HTML not confirmed."
          exit 1

      - name: Dispatch Japanese mobile reaudit V1.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run japanese-mobile-reaudit-v1.yml --ref main
          echo "Japanese mobile reaudit V1.1 dispatched after V1.3R1"
