name: DPRO Clinic Shuttle Official Release R2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-official-release-r2.yml"
      - ".github/workflows/clinic-shuttle-official-release-r2.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-official-release-r2
  cancel-in-progress: false

jobs:
  official-release-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout official site
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard committed official source and SYSTEM FINAL LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ccc531610b8fa9721e8e2c9dd8eb9709e12dcb70" || {
            echo "OFFICIAL source head drift"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }

      - name: Verify committed 55-product official sources
        run: python .github/workflows/clinic-shuttle-official-release-r2.py sourceqa

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Corrected responsive public QA
        run: python .github/workflows/clinic-shuttle-official-release-r2.py liveqa

      - name: Build official release manifest
        run: python .github/workflows/clinic-shuttle-official-release-r2.py manifest

      - name: Commit corrected official QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clinic-shuttle-release
          git commit -m "Record clinic shuttle official responsive QA"
          git push origin main

      - name: Remove one-shot official workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f \
            .github/workflows/clinic-shuttle-official-release-r1.yml \
            .github/workflows/clinic-shuttle-official-release-r1.py \
            .github/workflows/clinic-shuttle-official-release-r2.yml \
            .github/workflows/clinic-shuttle-official-release-r2.py
          git commit -m "Remove completed clinic shuttle official release workflows"
          git push origin main
