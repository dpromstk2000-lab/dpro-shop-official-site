name: DPRO CHAT B Medical Official Copy Final

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-shop-official-site" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/dpro-shop-official-site, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize MEDICAL customer-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("systems/medical.html")
          if not p.exists():
              raise SystemExit("systems/medical.html not found")

          s = p.read_text(encoding="utf-8")
          before = s

          # Apply broad, order-independent customer-facing terminology replacements.
          replacements = [
              ("DPRO SHOP / DPRO MEDICAL OFFICIAL SITE V1.2.1 / 公開デモ", "DPRO SHOP / DPRO MEDICAL / 公開デモ"),
              ("DPRO SHOP / DPRO MEDICAL OFFICIAL SITE V1.2.1 / 公開DEMO", "DPRO SHOP / DPRO MEDICAL / 公開デモ"),
              ("OFFICIAL SITE / DPRO MEDICAL", "医療機関向けDPROシステム"),
              ("OFFICIAL GUIDE", "導入・運用ガイド"),
              ("OFFICIAL SITEでは、", "このページでは、"),
              ("PRODUCT SITEで詳しく見る", "製品詳細を見る"),
              ("PRODUCT SITEを見る", "製品詳細を見る"),
              ("PRODUCT SITE ↗", "製品詳細 ↗"),
              ("INTRODUCTION FLOW", "導入の流れ"),
              ("SECURITY & BOUNDARY", "安全な運用"),
              ("PUBLIC DEMO", "公開デモ"),
              ("REAL CUSTOMER LIVE", "実医院での運用"),
              ("LIVE VERIFY", "最終確認"),
              ("GO LIVE", "運用開始"),
              ("LIVE DEMO", "公開デモ"),
              ("公開LIVE DEMO", "公開デモ"),
              ("公開DEMO", "公開デモ"),
              ("30秒LIVE DEMO", "30秒公開デモ"),
              ("DPRO MEDICAL LIVE DEMO", "DPRO MEDICAL 公開デモ"),
              ("診療診療パターン", "診療パターン"),
              ("Cloudflare Binding", "外部接続設定"),
              ("production E2E", "一連の動作確認"),
              ("live API", "本番接続"),
              ("tenant / clinic", "医院情報"),
              ("LINE / LIFF", "LINE連携"),
              ("Supabase", "データ環境"),
              ("Worker", "接続処理"),
              ("domain", "公開URL"),
              ("role / patient scope", "役割ごとの利用範囲"),
              ("role / patient", "役割ごとの利用範囲"),
              ("CORE", "共通基盤"),
              ("本番DB書込み", "本番環境のデータ更新"),
              ("秘密鍵", "本番用の機密情報"),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          # Smooth out phrases after broad replacements.
          s = s.replace("別共通基盤", "別の基盤")
          s = s.replace("同じ共通基盤のルール", "共通基盤のルール")
          s = s.replace("同じ共通基盤のまま", "同じ共通基盤のまま")
          s = s.replace(
              "公開デモをそのまま本番利用するのではなく、実医院ごとに設定・認証・本番環境・外部連携・端末を確認して運用開始します。",
              "公開デモをそのまま本番利用するのではなく、実医院ごとに設定・認証・外部連携・端末を確認してから運用を開始します。"
          )
          s = s.replace(
              "医院情報、スタッフ、本番DB、接続処理、LINE連携、公開URL等を設定。",
              "医院情報、スタッフ権限、LINE連携など、運用に必要な設定を行います。"
          )
          s = s.replace(
              "外部接続設定、本番接続、一連の動作確認、実端末を確認して本番開始。",
              "実際のURLと端末で一連の操作を確認してから運用を開始します。"
          )
          s = s.replace(
              "患者認証とスタッフ認証を分け、医院情報 / 役割ごとの利用範囲をサーバー側で確認する設計を維持します。",
              "患者向けとスタッフ向けの認証を分け、役割に応じて利用できる画面と情報を適切に制御します。"
          )
          s = s.replace(
              "実医院受注後に医院専用設定・本番データ環境・外部接続設定・接続処理・LINE連携・公開URL・E2E・実端末を正式確認します。",
              "受注後に医院専用設定、スタッフ権限、LINE連携、実際のURLと端末を確認してから運用を開始します。"
          )

          # Internal CSS comments must not carry release/internal labels either.
          s = s.replace("/* DPRO MEDICAL OFFICIAL HERO VISIBILITY HOTFIX V1.2.1", "/* DPRO MEDICAL HERO VISIBILITY HOTFIX")
          s = s.replace("legacy OFFICIAL .hero-grid effect rules.", "legacy shared .hero-grid effect rules.")

          for forbidden in [
              "OFFICIAL SITE",
              "OFFICIAL GUIDE",
              "PRODUCT SITE",
              "V1.2.1",
              "CORE",
              "tenant / clinic",
              "Worker",
              "Supabase",
              "Cloudflare",
              "Binding",
              "LIFF",
              "production E2E",
              "live API",
              "GO LIVE",
              "LIVE VERIFY",
              "PUBLIC DEMO",
              "REAL CUSTOMER LIVE",
              "公開DEMO",
              "LIVE DEMO",
          ]:
              if forbidden in s:
                  raise SystemExit(f"customer-facing/internal token remains: {forbidden}")

          for required in [
              "医療機関向けDPROシステム",
              "製品詳細",
              "導入・運用ガイド",
              "導入の流れ",
              "安全な運用",
              "共通基盤",
              "運用を開始",
          ]:
              if required not in s:
                  raise SystemExit(f"expected customer-facing wording missing: {required}")

          for required_url in [
              "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/medical.html",
              "https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html",
              "https://lin.ee/YxJGXV6D",
          ]:
              if required_url not in s:
                  raise SystemExit(f"required URL missing after patch: {required_url}")

          if s != before:
              p.write_text(s, encoding="utf-8")

          print("MEDICAL OFFICIAL CUSTOMER COPY FINAL:", "CHANGED" if s != before else "ALREADY_OK")
          PY

      - name: Static customer copy QA
        shell: bash
        run: |
          for token in 'OFFICIAL SITE' 'OFFICIAL GUIDE' 'PRODUCT SITE' 'V1.2.1' 'CORE' 'Worker' 'Supabase' 'Cloudflare' 'LIFF' 'GO LIVE' 'LIVE VERIFY' 'LIVE DEMO'; do
            if grep -q "$token" systems/medical.html; then
              echo "Forbidden token remains: $token" >&2
              exit 1
            fi
          done
          grep -q '医療機関向けDPROシステム' systems/medical.html
          grep -q '導入・運用ガイド' systems/medical.html
          grep -q '導入の流れ' systems/medical.html
          grep -q '安全な運用' systems/medical.html
          grep -q '共通基盤' systems/medical.html
          echo 'MEDICAL OFFICIAL customer copy QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-medical-official-copy-final.yml"
          git add "systems/medical.html"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize CHAT B MEDICAL official customer copy"
          git push
