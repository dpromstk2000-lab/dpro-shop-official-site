name: DPRO CONNECT Google OAuth Relay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Google OAuth relay
        shell: bash
        run: |
          mkdir -p connect/google
          echo '' | base64 -d > connect/google/callback.html

      - name: Validate
        shell: bash
        run: |
          test -f connect/google/callback.html
          grep -q 'dpro-connect-v1/api/oauth/google/callback' connect/google/callback.html
          grep -q 'noindex,nofollow' connect/google/callback.html
          grep -q 'no-referrer' connect/google/callback.html
          grep -q 'history.replaceState' connect/google/callback.html
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connect/google/callback.html
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Add DPRO CONNECT Google OAuth relay"
          git push
