name: JAPANESE mobile visual reaudit V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/japanese-mobile-reaudit-v1.yml'

permissions:
  contents: read

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          path: official
          fetch-depth: 1

      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          repository: dpromstk2000-lab/dpro-line-systems-site
          ref: main
          path: product
          fetch-depth: 1

      - name: Build customer-facing seed inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          def is_noindex(html):
              for tag in re.findall(r'<meta\b[^>]*>', html, flags=re.I|re.S):
                  name = re.search(r'\bname\s*=\s*["\']([^"\']+)["\']', tag, flags=re.I)
                  content = re.search(r'\bcontent\s*=\s*["\']([^"\']*)["\']', tag, flags=re.I)
                  if name and content and name.group(1).lower() == 'robots' and 'noindex' in content.group(1).lower():
                      return True
              return False

          def paths(repo):
              rows = subprocess.check_output(['git','-C',repo,'ls-files','*.html'],text=True).splitlines()
              out=[]
              skip_product={'systems/member.html','systems/owner.html','systems/owner-ipad.html','systems/staff.html'}
              for p in rows:
                  if p.startswith(('.github/','.dpro/','.dpro-next/')): continue
                  if repo=='product' and p in skip_product: continue
                  full=Path(repo)/p
                  try: html=full.read_text(encoding='utf-8',errors='ignore')
                  except Exception: continue
                  if is_noindex(html): continue
                  out.append(p)
              return out

          def url(base,p):
              if p=='index.html': return base
              if p.endswith('/index.html'): return base+p[:-10]
              return base+p

          items=[]
          for p in paths('official'):
              items.append({'site':'OFFICIAL','path':p,'url':url('https://dpro-shop.com/',p)})
          for p in paths('product'):
              items.append({'site':'PRODUCT','path':p,'url':url('https://dpromstk2000-lab.github.io/dpro-line-systems-site/',p)})

          Path('audit-output').mkdir(exist_ok=True)
          Path('audit-output/seed-urls.json').write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Seed pages:',len(items))
          PY

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium

      - name: Run Japanese mobile reaudit including embedded demos
        shell: bash
        run: |
          cat > japanese-mobile-reaudit.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const seeds = JSON.parse(fs.readFileSync('audit-output/seed-urls.json', 'utf8'));
          const outDir = path.resolve('audit-output');
          const shotDir = path.join(outDir, 'screenshots');
          fs.mkdirSync(shotDir, { recursive: true });

          const WIDTH = 390;
          const HEIGHT = 844;
          const MAX_DISCOVERED = 220;
          const MAX_DEPTH = 2;

          function normalizeUrl(raw, base) {
            try {
              const u = new URL(raw, base);
              if (!['http:', 'https:'].includes(u.protocol)) return null;
              u.hash = '';
              return u.toString();
            } catch { return null; }
          }

          function allowedDocumentUrl(url) {
            try {
              const u = new URL(url);
              const h = u.hostname.toLowerCase();
              const allowedHost =
                h === 'dpro-shop.com' ||
                h === 'www.dpro-shop.com' ||
                h === 'dpromstk2000-lab.github.io' ||
                h.endsWith('.pages.dev');
              if (!allowedHost) return false;
              if (/\.(?:png|jpe?g|gif|webp|svg|css|js|json|pdf|zip|woff2?|ttf|ico)(?:$|\?)/i.test(u.pathname + u.search)) return false;
              if (/\/api\//i.test(u.pathname) && !/\.html$/i.test(u.pathname)) return false;
              return true;
            } catch { return false; }
          }

          function isDemoLike(url, text='') {
            const s = `${url} ${text}`.toLowerCase();
            return /(demo|live|preview|integrated|today-board|system-check|hp-demo|体験|実画面|操作デモ|統合)/i.test(s);
          }

          function slug(s) {
            return s.replace(/^https?:\/\//,'').replace(/[?#].*$/,'').replace(/[^a-zA-Z0-9._-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,150) || 'root';
          }

          async function inspectPage(page, item) {
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e.message || e)));

            let response = null;
            let status = null;
            let navError = null;
            try {
              for (let attempt = 1; attempt <= 2; attempt += 1) {
                response = await page.goto(item.url, { waitUntil: 'domcontentloaded', timeout: 22000 });
                await page.waitForLoadState('networkidle', { timeout: 5000 }).catch(()=>{});
                status = response ? response.status() : null;
                if (!status || status < 500 || attempt === 2) break;
                await page.waitForTimeout(500);
              }
              await page.addStyleTag({content:`
                *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;caret-color:transparent!important}
                .reveal,.v33-reveal,.js .reveal{opacity:1!important;transform:none!important;visibility:visible!important}
                .section{content-visibility:visible!important;contain-intrinsic-size:auto!important}
              `}).catch(()=>{});
              await page.waitForFunction(() => {
                const links = [...document.querySelectorAll('link[rel="stylesheet"]')];
                return links.every(link => !!link.sheet);
              }, { timeout: 5000 }).catch(()=>{});
              await page.evaluate(() => document.fonts?.ready).catch(()=>{});
              await page.waitForFunction(() => {
                const items = [...document.querySelectorAll('.dpro-jp-keep')];
                if (!items.length) return true;
                return items.every(el => getComputedStyle(el).whiteSpace === 'nowrap');
              }, { timeout: 5000 }).catch(()=>{});
              await page.waitForTimeout(160);
              await page.evaluate(async () => {
                const maxY = Math.max(document.body?.scrollHeight || 0, document.documentElement.scrollHeight || 0);
                const step = Math.max(500, Math.floor(innerHeight * .82));
                for (let y = 0; y < maxY; y += step) {
                  scrollTo(0, y);
                  await new Promise(r => setTimeout(r, 6));
                }
                scrollTo(0,0);
              }).catch(()=>{});
              await page.waitForTimeout(220);
            } catch (e) {
              navError = String(e.message || e);
            }

            let audit = { title:'', issues:[], discovered:[], bodyText:'' };
            if (!navError) {
              audit = await page.evaluate(() => {
                const visible = el => {
                  const cs = getComputedStyle(el);
                  if (cs.display === 'none' || cs.visibility === 'hidden' || Number(cs.opacity || 1) < .03) return false;
                  const r = el.getBoundingClientRect();
                  return r.width > 4 && r.height > 4;
                };

                const jp = /[ぁ-んァ-ヶ一-龠々ー]/;
                const badStart = /^[、。，．！？!?）」』】）》〉〕］）)％%：:；;]/;
                const splitTokens = [
                  'から','まで','ので','ため','なら','けれど','けど','です','ます','でした','ました',
                  'として','について','によって','による','できる','できます','できない','ありません',
                  'ホームページ','受付システム','システム','お客様','店舗運営','LINE公式','一続き','つなぐ','取り置き','ケーキ','カルテ','マグネット','メニュー','診察券QR','集中する','向け','システム料金','分かりやすく','まとめる','高機能','読取'
                ];

                function charRects(el) {
                  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
                    acceptNode(node) {
                      const p = node.parentElement;
                      if (!p || ['SCRIPT','STYLE','NOSCRIPT'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
                      return node.nodeValue && node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                    }
                  });
                  const chars = [];
                  let node;
                  while ((node = walker.nextNode())) {
                    const text = node.nodeValue || '';
                    let offset = 0;
                    for (const ch of Array.from(text)) {
                      const start = offset;
                      offset += ch.length;
                      if (!ch.trim()) continue;
                      const range = document.createRange();
                      try {
                        range.setStart(node, start);
                        range.setEnd(node, offset);
                      } catch { continue; }
                      const rect = range.getBoundingClientRect();
                      if (rect.width > 0 && rect.height > 0) chars.push({ ch, top: Math.round(rect.top), left: rect.left });
                    }
                  }
                  return chars;
                }

                function linesOf(el) {
                  const chars = charRects(el);
                  const lines = [];
                  for (const c of chars) {
                    let line = lines.find(l => Math.abs(l.top - c.top) <= 2);
                    if (!line) { line = { top:c.top, chars:[] }; lines.push(line); }
                    line.chars.push(c.ch);
                  }
                  lines.sort((a,b)=>a.top-b.top);
                  return lines.map(l => l.chars.join('').replace(/\s+/g,''));
                }

                function splitTokenAtBoundary(prev, next) {
                  for (const token of splitTokens) {
                    for (let i=1; i<token.length; i++) {
                      if (prev.endsWith(token.slice(0,i)) && next.startsWith(token.slice(i))) return token;
                    }
                  }
                  return null;
                }

                function selectorHint(el) {
                  if (el.id) return `#${el.id}`;
                  const cls = [...el.classList].slice(0,3).join('.');
                  return `${el.tagName.toLowerCase()}${cls ? '.'+cls : ''}`;
                }

                const rawCandidates = [
                  ...document.querySelectorAll('h1,h2,h3,h4,summary,button,a[class*="button"],a[class*="btn"],[class*="cta"] a,[class*="headline"],[class*="hero"] p,[class*="lead"]')
                ];
                const seen = new Set();
                const candidates = rawCandidates.filter(el => {
                  if (seen.has(el)) return false;
                  seen.add(el);
                  if (!visible(el)) return false;
                  const text = (el.innerText || el.textContent || '').trim().replace(/\s+/g,' ');
                  if (!jp.test(text)) return false;
                  if (el.tagName === 'A' && text.includes('機能を詳しく見る')) return false;
                  if (el.tagName === 'BUTTON' && text.includes('＋') && /[？?]/.test(text)) return false;
                  if (text.length < 4 || text.length > 180) return false;
                  const fs = parseFloat(getComputedStyle(el).fontSize || '0');
                  if (/^(P|DIV|SPAN)$/i.test(el.tagName) && fs < 20) return false;
                  return true;
                });

                const issues = [];
                let issueId = 0;
                for (const el of candidates) {
                  const lines = linesOf(el).filter(Boolean);
                  if (lines.length < 2) continue;
                  const full = lines.join('');
                  const reasons = [];
                  for (let i=1; i<lines.length; i++) {
                    const prev = lines[i-1], next = lines[i];
                    const token = splitTokenAtBoundary(prev, next);
                    if (token) reasons.push({type:'SPLIT_TOKEN', severity:'HIGH', boundary:i, token, prev, next});
                    if (badStart.test(next)) reasons.push({type:'BAD_LINE_START', severity:'HIGH', boundary:i, prev, next});
                    const clean = next.replace(/[、。！？!?）」』】）》〉〕］）)]/g,'');
                    if (full.length >= 8 && jp.test(clean) && clean.length <= 1) {
                    const severity = ['SUMMARY','BUTTON'].includes(el.tagName) ? 'MEDIUM' : 'HIGH';
                    reasons.push({type:'ORPHAN_LINE', severity, boundary:i, prev, next});
                  }
                  else if (full.length >= 10 && jp.test(clean) && i === lines.length-1 && clean.length <= 2) {
                    reasons.push({type:'SHORT_LAST_LINE', severity:'MEDIUM', boundary:i, prev, next});
                  }
                  }
                  if (!reasons.length) continue;
                  const id = `dpro-wrap-${++issueId}`;
                  el.setAttribute('data-dpro-wrap-issue', id);
                  issues.push({
                    id,
                    tag: el.tagName,
                    selector: selectorHint(el),
                    text: (el.innerText || el.textContent || '').trim().replace(/\s+/g,' ').slice(0,180),
                    lines,
                    reasons,
                    fontSize: getComputedStyle(el).fontSize,
                    width: Math.round(el.getBoundingClientRect().width)
                  });
                }

                const discovered = [];
                const attrs = ['src','data-src','data-demo-src','data-demo-url','data-live-src','data-live-url','href'];
                for (const el of document.querySelectorAll('iframe,a,[data-src],[data-demo-src],[data-demo-url],[data-live-src],[data-live-url]')) {
                  for (const a of attrs) {
                    const raw = el.getAttribute?.(a);
                    if (!raw) continue;
                    discovered.push({ raw, tag:el.tagName, text:(el.innerText||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,100), attr:a });
                  }
                }

                return {
                  title: document.title,
                  issues,
                  discovered,
                  bodyText: (document.body?.innerText || '').slice(0,1000)
                };
              });
            }

            const discovered = [];
            for (const d of audit.discovered || []) {
              const u = normalizeUrl(d.raw, item.url);
              if (!u || !allowedDocumentUrl(u)) continue;
              if (d.tag === 'IFRAME' || d.attr !== 'href' || isDemoLike(u, d.text)) {
                discovered.push({url:u, parent:item.url, via:`${d.tag}.${d.attr}`, text:d.text});
              }
            }

            const screenshotNames = [];
            if (!navError && audit.issues?.length) {
              const fullName = `page_${slug(item.url)}.jpg`;
              try {
                await page.screenshot({path:path.join(shotDir, fullName), fullPage:true, type:'jpeg', quality:58});
                screenshotNames.push(fullName);
              } catch {}

              for (const issue of audit.issues.slice(0,6)) {
                try {
                  const loc = page.locator(`[data-dpro-wrap-issue="${issue.id}"]`).first();
                  await loc.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(50);
                  const name = `issue_${slug(item.url)}_${issue.id}.png`;
                  await loc.screenshot({path:path.join(shotDir,name)});
                  issue.screenshot = name;
                  screenshotNames.push(name);
                } catch {}
              }
            }

            return {
              ...item,
              status,
              navError,
              pageErrors,
              title:audit.title,
              issues:audit.issues || [],
              discovered,
              screenshots:screenshotNames
            };
          }

          async function auditBatch(browser, items, label) {
            const results = new Array(items.length);
            let cursor = 0;
            const workers = 8;
            async function worker() {
              const context = await browser.newContext({viewport:{width:WIDTH,height:HEIGHT}, deviceScaleFactor:1, isMobile:true, hasTouch:true});
              while (true) {
                const idx = cursor++;
                if (idx >= items.length) break;
                const item = items[idx];
                process.stdout.write(`[${label} ${idx+1}/${items.length}] ${item.url}\n`);
                const page = await context.newPage();
                try { results[idx] = await inspectPage(page,item); }
                catch (e) { results[idx] = {...item,status:null,navError:String(e.message||e),pageErrors:[],issues:[],discovered:[],screenshots:[]}; }
                await page.close().catch(()=>{});
              }
              await context.close();
            }
            await Promise.all(Array.from({length:workers},()=>worker()));
            return results.filter(Boolean);
          }

          async function main() {
            const browser = await chromium.launch({headless:true});
            const seen = new Set(seeds.map(x=>x.url));
            const allResults = [];

            let current = seeds.map(x=>({...x,depth:0,kind:'BASE'}));
            for (let depth=0; depth<=MAX_DEPTH && current.length; depth++) {
              const res = await auditBatch(browser,current,depth===0?'BASE':`EMBED${depth}`);
              allResults.push(...res);
              if (depth === MAX_DEPTH) break;
              const next = [];
              for (const r of res) {
                for (const d of r.discovered || []) {
                  if (seen.has(d.url)) continue;
                  seen.add(d.url);
                  if (seen.size > seeds.length + MAX_DISCOVERED) break;
                  next.push({site:'EMBED/DEMO',path:d.url,url:d.url,depth:depth+1,kind:'EMBED/DEMO',parent:d.parent,via:d.via,linkText:d.text});
                }
              }
              current = next;
            }

            await browser.close();

            const issueRows = [];
            for (const r of allResults) {
              for (const i of r.issues || []) {
                const maxSeverity = i.reasons.some(x=>x.severity==='HIGH') ? 'HIGH' : 'MEDIUM';
                issueRows.push({
                  severity:maxSeverity,
                  site:r.site,
                  url:r.url,
                  title:r.title,
                  text:i.text,
                  lines:i.lines,
                  reasons:i.reasons,
                  screenshot:i.screenshot || null,
                  parent:r.parent || null,
                  via:r.via || null,
                });
              }
            }
            issueRows.sort((a,b)=>(a.severity==='HIGH'?0:1)-(b.severity==='HIGH'?0:1));

            const high = issueRows.filter(x=>x.severity==='HIGH').length;
            const medium = issueRows.filter(x=>x.severity==='MEDIUM').length;
            const embeddedPages = new Set(allResults.filter(x=>x.kind==='EMBED/DEMO').map(x=>x.url)).size;
            const navErrors = allResults.filter(x=>x.navError || (x.status && x.status>=400));
            const summary = {
              basePages: seeds.length,
              embeddedDemoPages: embeddedPages,
              totalMobilePagesAudited: allResults.length,
              highIssues: high,
              mediumIssues: medium,
              issueElements: issueRows.length,
              navigationErrors: navErrors.length,
              status: high ? 'ISSUES_FOUND' : (medium ? 'REVIEW' : 'CLEAN')
            };

            fs.writeFileSync(path.join(outDir,'report.json'), JSON.stringify({summary,issues:issueRows,results:allResults},null,2));

            let md = `# 日本語改行・スマホ実画面 再監査\n\n`;
            md += `**Status:** ${summary.status}\n\n`;
            md += `- OFFICIAL + PRODUCT 基本ページ: ${summary.basePages}\n`;
            md += `- 発見した埋め込み/DEMOページ: ${summary.embeddedDemoPages}\n`;
            md += `- スマホ390px監査ページ合計: ${summary.totalMobilePagesAudited}\n`;
            md += `- HIGH: ${summary.highIssues}\n`;
            md += `- MEDIUM: ${summary.mediumIssues}\n`;
            md += `- Navigation errors: ${summary.navigationErrors}\n\n`;

            if (issueRows.length) {
              md += `## 改行問題\n\n`;
              for (const x of issueRows.slice(0,200)) {
                md += `### [${x.severity}] ${x.url}\n`;
                md += `- Text: ${x.text}\n`;
                md += `- Lines: ${x.lines.map(s=>`「${s}」`).join(' / ')}\n`;
                md += `- Reason: ${x.reasons.map(r=>r.type + (r.token?`(${r.token})`:'' )).join(', ')}\n`;
                if (x.parent) md += `- Embedded from: ${x.parent}\n`;
                if (x.screenshot) md += `- Screenshot: screenshots/${x.screenshot}\n`;
                md += `\n`;
              }
            }

            if (navErrors.length) {
              md += `## 読み込み確認\n\n`;
              for (const x of navErrors.slice(0,80)) md += `- ${x.url} → ${x.status ?? 'ERR'} ${x.navError || ''}\n`;
              md += `\n`;
            }

            fs.writeFileSync(path.join(outDir,'report.md'),md);
            fs.writeFileSync(path.join(outDir,'audit-status.txt'),summary.status+'\n');

            const csv = ['severity,site,url,text,lines,reasons,screenshot'];
            const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
            for (const x of issueRows) csv.push([x.severity,x.site,x.url,x.text,x.lines.join(' | '),x.reasons.map(r=>r.type+(r.token?`:${r.token}`:'')).join(' | '),x.screenshot].map(q).join(','));
            fs.writeFileSync(path.join(outDir,'issues.csv'),csv.join('\n'));

            console.log(JSON.stringify(summary,null,2));

            const top = issueRows.slice(0,20);
            const summaryLines = [
              '## 日本語改行・スマホ実画面 再監査',
              '',
              `- Status: **${summary.status}**`,
              `- 基本ページ: ${summary.basePages}`,
              `- 埋め込み/DEMO: ${summary.embeddedDemoPages}`,
              `- 監査合計: ${summary.totalMobilePagesAudited}`,
              `- HIGH: ${summary.highIssues}`,
              `- MEDIUM: ${summary.mediumIssues}`,
              '',
              '### 上位問題'
            ];
            for (const x of top) summaryLines.push(`- **${x.severity}** ${x.url} — ${x.lines.join(' / ')}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines.join('\n')+'\n');
          }

          main().catch(err=>{
            console.error(err);
            fs.mkdirSync('audit-output',{recursive:true});
            fs.writeFileSync('audit-output/audit-status.txt','AUDIT_ERROR\n');
            fs.writeFileSync('audit-output/fatal.txt',String(err.stack||err));
            process.exit(1);
          });

          NODE
          node japanese-mobile-reaudit.js

      - name: Upload Japanese mobile reaudit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-mobile-reaudit
          path: audit-output/
          retention-days: 7
          compression-level: 6

      - name: Audit complete
        if: always()
        shell: bash
        run: |
          echo "Audit status:"
          cat audit-output/audit-status.txt 2>/dev/null || true
          echo "This workflow reports issues but does not modify either site."
