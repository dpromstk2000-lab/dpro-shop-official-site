name: DPRO Clinic Shuttle HA Official Footer Dedupe R1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-ha-official-footer-dedupe-r1.yml"
      - ".github/workflows/clinic-shuttle-ha-official-footer-dedupe-r1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clinic-shuttle-ha-official-footer-dedupe-r1
  cancel-in-progress: false

jobs:
  footer-dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Guard current HEADs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c04ed151cec254aa1e5345f9d64b5ed1752f47d1" || {
            echo "OFFICIAL drift before footer fix"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift"; exit 1;
          }
          PRODUCT_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-line-systems-site.git refs/heads/main | awk '{print $1}')"
          test "$PRODUCT_HEAD" = "a1fc0ee49518d1deb71990df8a4c31624225ccbe" || {
            echo "PRODUCT drift"; exit 1;
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve runner
        run: cp .github/workflows/clinic-shuttle-ha-official-footer-dedupe-r1.py /tmp/clinic-footer-r1.py

      - name: Remove duplicated static footer
        run: python /tmp/clinic-footer-r1.py patch

      - name: Commit footer fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/clinic-shuttle.html
          git rm -f \
            .github/workflows/clinic-shuttle-ha-official-footer-dedupe-r1.yml \
            .github/workflows/clinic-shuttle-ha-official-footer-dedupe-r1.py
          git commit -m "Remove duplicate clinic shuttle OFFICIAL footer"
          FINAL_HEAD="$(git rev-parse HEAD)"
          echo "FINAL_OFFICIAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          git push origin main

      - name: Install browser QA
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify exactly one public footer
        run: python /tmp/clinic-footer-r1.py publicqa

      - uses: actions/upload-artifact@v4
        with:
          name: clinic-shuttle-ha-official-footer-r1-evidence
          path: release-evidence-ha-official-footer-r1/
          if-no-files-found: error
          retention-days: 30
