name: DPRO CENTRAL 54 official source cleanup
on:
  push:
    paths:
      - .github/workflows/central-54-source-cleanup.yml
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize OFFICIAL SITE central 54 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          # Public count claims: update only catalog-count phrases, never PRODUCT 52 numbering.
          replacements = {
              'data-product-count>52<':'data-product-count>54<',
              '52業種別システム':'54業種別システム',
              '52の業種別DPROシステム':'54の業種別DPROシステム',
              '52の完成DPROシステム':'54の完成DPROシステム',
              '52製品カタログ':'54製品カタログ',
              '52製品・PC':'54製品・PC',
              'PRODUCT SITE / 52製品':'PRODUCT SITE / 54製品',
              '>52システムから探す<':'>54システムから探す<',
              '>52システムの公式説明を見る<':'>54システムの公式説明を見る<',
              '"dateModified":"2026-08-18"':'"dateModified":"2026-09-03"',
          }

          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              for a,b in replacements.items():
                  s=s.replace(a,b)
              p.write_text(s,encoding='utf-8')

          hub=Path('systems/index.html').read_text(encoding='utf-8')
          root=Path('index.html').read_text(encoding='utf-8')
          cfg=Path('site-config.js').read_text(encoding='utf-8')
          runtime=Path('systems/systems.js').read_text(encoding='utf-8')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')

          assert 'productCount: 54' in cfg
          assert '"numberOfItems":54' in hub
          assert '"position":53' in hub and '/systems/landscape-exterior' in hub
          assert '"position":54' in hub and '/systems/pest-env' in hub
          assert '54システムの公式説明' in hub
          assert '52業種別システム説明ページ' not in hub
          assert '52の完成DPROシステム' not in hub
          assert 'data-product-count>52<' not in root
          assert 'data-product-count>54<' in root
          assert '>54システム説明<' in runtime
          assert sitemap.count('https://dpro-shop.com/systems/landscape-exterior')==1
          assert sitemap.count('https://dpro-shop.com/systems/pest-env')==1
          assert Path('systems/landscape-exterior.html').exists()
          assert Path('systems/pest-env.html').exists()

          subprocess.check_call(['node','--check','site-config.js'])
          subprocess.check_call(['node','--check','systems/systems.js'])
          print('OFFICIAL_SITE_CENTRAL_54_SOURCE_CLEANUP=PASS')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/central-54-source-cleanup.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize OFFICIAL SITE canonical 54 source"
          git push
