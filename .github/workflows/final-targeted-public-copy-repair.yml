name: FINAL Targeted Public Copy Repair R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-targeted-public-copy-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard target files against baseline drift
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='ba162b2da76fd6222644198da7b614946afb1131'
          git cat-file -e "${BASELINE}^{commit}"
          if ! git diff --quiet "$BASELINE" HEAD -- index.html line-operation.html systems/index.html systems/estate.html; then
            echo 'Target files changed after the approved baseline. Abort without touching them.' >&2
            git diff --name-only "$BASELINE" HEAD -- index.html line-operation.html systems/index.html systems/estate.html >&2
            exit 2
          fi

      - name: Apply targeted public copy repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          report = []

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              report.append(f'REPLACE {path}: old_count={count}')
              if count != expected:
                  raise SystemExit(f'Unexpected match count in {path}: {count} for {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 00-001: public product/system count 50 -> 51 (semantic count only)
          replace_exact(
              'systems/index.html',
              '<b>50</b><span>DPRO LINE SYSTEMS',
              '<b>51</b><span>DPRO LINE SYSTEMS'
          )
          replace_exact(
              'line-operation.html',
              '<strong data-product-count>50</strong><span>LIVE DEMO PRODUCTS</span>',
              '<strong data-product-count>51</strong><span>LIVE DEMO PRODUCTS</span>'
          )

          # 00-015: avoid universal automatic-reception wording on the shared official top page
          replace_exact(
              'index.html',
              '<h3><em>DPRO</em>で自動受付・管理</h3>',
              '<h3><em>DPRO</em>で受付情報をまとめて管理</h3>'
          )

          # 00-004: remove implementation/infrastructure terms from ordinary ESTATE public copy
          replace_exact(
              'systems/estate.html',
              '公開デモは架空情報だけを使用し、本番は契約店舗専用のGitHub・Worker・データベースで運用します。',
              '公開デモは架空情報だけを使用し、本番は契約店舗専用の運用環境・保存先で運用します。'
          )
          replace_exact(
              'systems/estate.html',
              'API、保存先、認証、画面動作、デモ分離などを導入前にDPRO SHOP側で確認します。',
              '保存先、認証、画面動作、デモ分離などを導入前にDPRO SHOP側で確認します。'
          )
          replace_exact(
              'systems/estate.html',
              '公開デモは架空データを使用し、本番環境とはGitHub・Worker・データベースを分離します。',
              '公開デモは架空データを使用し、本番環境とは運用環境・保存先を分けています。'
          )

          # Focused QA: exact targets + safe semantic checks only.
          systems_index = Path('systems/index.html').read_text(encoding='utf-8')
          line_operation = Path('line-operation.html').read_text(encoding='utf-8')
          top = Path('index.html').read_text(encoding='utf-8')
          estate = Path('systems/estate.html').read_text(encoding='utf-8')

          checks = {
              'systems index old product count removed': '<b>50</b><span>DPRO LINE SYSTEMS' not in systems_index,
              'systems index new product count present': systems_index.count('<b>51</b><span>DPRO LINE SYSTEMS') == 1,
              'ItemList numberOfItems remains 51': '"numberOfItems":51' in systems_index,
              'line operation old live-demo count removed': '<strong data-product-count>50</strong><span>LIVE DEMO PRODUCTS</span>' not in line_operation,
              'line operation new live-demo count present': line_operation.count('<strong data-product-count>51</strong><span>LIVE DEMO PRODUCTS</span>') == 1,
              'top automatic-reception wording removed': '<h3><em>DPRO</em>で自動受付・管理</h3>' not in top,
              'top replacement wording present': top.count('<h3><em>DPRO</em>で受付情報をまとめて管理</h3>') == 1,
              'estate implementation terms removed': not re.search(r'GitHub|Worker|Cloudflare|Supabase|データベース|\bAPI\b', estate, re.I),
          }

          # Any data-product-count=50 is definitely a stale public product count, so this is safe to block repo-wide.
          stale_product_count = []
          pat = re.compile(r'data-product-count[^>]*>\s*50\s*<', re.I)
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8', errors='replace')
              if pat.search(text):
                  stale_product_count.append(str(p))
          checks['repo-wide data-product-count 50 = 0'] = not stale_product_count
          report.append('stale_data_product_count_files=' + ';'.join(stale_product_count))

          # Verification-only controls from the start package; do not mutate them.
          pet = Path('systems/pet-salon.html').read_text(encoding='utf-8', errors='replace')
          terms = Path('terms.html').read_text(encoding='utf-8', errors='replace')
          flower = Path('systems/flower-shop.html').read_text(encoding='utf-8', errors='replace')
          report.append(f'00-016 VERIFY ONLY pet-salon リアルタイム count={pet.count("リアルタイム")}')
          report.append('00-003 VERIFY ONLY terms provider-name counts=' + ','.join(f'{x}:{terms.count(x)}' for x in ('GitHub','Supabase','Cloudflare')))
          report.append(f'00-017 VERIFY ONLY flower exact broad-safety count={flower.count("確認済みの安全設計")}')

          for name, ok in checks.items():
              report.append(f'{"PASS" if ok else "FAIL"}: {name}')
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              Path('/tmp/final_targeted_public_copy_repair_report.txt').write_text('\n'.join(report)+'\n', encoding='utf-8')
              print('\n'.join(report))
              raise SystemExit('Focused QA failed: ' + '; '.join(failed))

          report.append('production_business_mutation=0')
          report.append('worker_api_db_supabase_changes=0')
          report.append('target_files=index.html;line-operation.html;systems/index.html;systems/estate.html')
          Path('/tmp/final_targeted_public_copy_repair_report.txt').write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Remove temporary workflow from final tree
        shell: bash
        run: rm -f .github/workflows/final-targeted-public-copy-repair.yml

      - name: Scope diff gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected=".github/workflows/final-targeted-public-copy-repair.yml index.html line-operation.html systems/estate.html systems/index.html "
          echo "Changed files: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected diff scope: $actual" >&2
            exit 3
          fi

      - name: Upload static QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-targeted-public-copy-repair-r2-evidence
          path: /tmp/final_targeted_public_copy_repair_report.txt
          if-no-files-found: error

      - name: Commit and push final repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html line-operation.html systems/index.html systems/estate.html .github/workflows/final-targeted-public-copy-repair.yml
          git commit -m 'FINAL targeted public copy repair R2 (00-001 00-004 00-015)'
          git push origin HEAD:main
