name: FINAL Targeted Public Copy Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-targeted-public-copy-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Baseline guard and targeted repair
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='ba162b2da76fd6222644198da7b614946afb1131'
          PARENT="$(git rev-parse HEAD^)"
          if [ "$PARENT" != "$BASELINE" ]; then
            echo "Baseline mismatch: expected parent $BASELINE, got $PARENT" >&2
            exit 2
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          report = []
          changed = []

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              report.append(f'REPLACE {path}: count={count} :: {old} -> {new}')
              if count != expected:
                  raise SystemExit(f'Unexpected match count in {path}: {count} for {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(path)

          # 00-001: semantic public product/system counts only. Do not touch ItemList position 50.
          replace_exact(
              'systems/index.html',
              '<b>50</b><span>DPRO LINE SYSTEMS',
              '<b>51</b><span>DPRO LINE SYSTEMS'
          )
          replace_exact(
              'line-operation.html',
              '<strong data-product-count>50</strong><span>LIVE DEMO PRODUCTS</span>',
              '<strong data-product-count>51</strong><span>LIVE DEMO PRODUCTS</span>'
          )

          # 00-015: remove universal auto-reception implication from shared official top copy.
          replace_exact(
              'index.html',
              '<h3><em>DPRO</em>で自動受付・管理</h3>',
              '<h3><em>DPRO</em>で受付情報をまとめて管理</h3>'
          )

          # 00-004: ordinary public language on ESTATE page; keep infrastructure details out of owner/customer copy.
          replace_exact(
              'systems/estate.html',
              '公開デモは架空情報だけを使用し、本番は契約店舗専用のGitHub・Worker・データベースで運用します。',
              '公開デモは架空情報だけを使用し、本番は契約店舗専用の運用環境・保存先で運用します。'
          )
          replace_exact(
              'systems/estate.html',
              'API、保存先、認証、画面動作、デモ分離などを導入前にDPRO SHOP側で確認します。',
              '保存先、認証、画面動作、デモ分離などを導入前にDPRO SHOP側で確認します。'
          )
          replace_exact(
              'systems/estate.html',
              '公開デモは架空データを使用し、本番環境とはGitHub・Worker・データベースを分離します。',
              '公開デモは架空データを使用し、本番環境とは運用環境・保存先を分けています。'
          )

          # Repository-wide static QA for 00-001.
          count_patterns = [
              re.compile(r'data-product-count[^>]*>\s*50\s*<', re.I),
              re.compile(r'50\s*(?:製品|システム|PRODUCTS?|SYSTEMS?)', re.I),
              re.compile(r'(?:製品|システム|PRODUCTS?|SYSTEMS?)[^<\n]{0,24}\b50\b', re.I),
              re.compile(r'numberOfItems\s*["\']?\s*[:=]\s*["\']?50\b', re.I),
          ]
          suspicious_counts = []
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8', errors='replace')
              for pat in count_patterns:
                  for m in pat.finditer(text):
                      snippet = text[max(0,m.start()-100):min(len(text),m.end()+100)].replace('\n',' ')
                      suspicious_counts.append((str(p), snippet))
          report.append(f'00-001 suspicious semantic legacy-50 hits after repair={len(suspicious_counts)}')
          for path, snippet in suspicious_counts:
              report.append(f'  COUNT_HIT {path}: {snippet}')
          if suspicious_counts:
              raise SystemExit('Remaining semantic legacy-50 candidate(s) found; aborting before commit')

          # 00-004 sweep: hard infrastructure exposition terms in public systems/*.html.
          infra = re.compile(r'GitHub|Worker|Cloudflare|Supabase|データベース|system-check|endpoint', re.I)
          infra_hits = []
          api_hits = []
          for p in Path('systems').glob('*.html'):
              text = p.read_text(encoding='utf-8', errors='replace')
              for m in infra.finditer(text):
                  snippet = text[max(0,m.start()-120):min(len(text),m.end()+120)].replace('\n',' ')
                  infra_hits.append((str(p), m.group(0), snippet))
              for m in re.finditer(r'\bAPI\b', text, re.I):
                  snippet = text[max(0,m.start()-120):min(len(text),m.end()+120)].replace('\n',' ')
                  api_hits.append((str(p), snippet))
          report.append(f'00-004 hard infrastructure hits after ESTATE repair={len(infra_hits)}')
          for path, term, snippet in infra_hits:
              report.append(f'  INFRA_HIT {path} [{term}]: {snippet}')
          report.append(f'00-004 API occurrences for manual context review={len(api_hits)}')
          for path, snippet in api_hits:
              report.append(f'  API_HIT {path}: {snippet}')
          if infra_hits:
              raise SystemExit('Remaining hard infrastructure exposition term(s) in systems/*.html; aborting before commit')

          # 00-015 sweep in shared/root official pages only.
          auto_hits = []
          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8', errors='replace')
              for pat in (r'DPRO.{0,20}自動受付', r'自動受付・管理'):
                  for m in re.finditer(pat, text):
                      auto_hits.append((str(p), text[max(0,m.start()-100):min(len(text),m.end()+100)].replace('\n',' ')))
          report.append(f'00-015 shared official universal auto-reception hits after repair={len(auto_hits)}')
          for path, snippet in auto_hits:
              report.append(f'  AUTO_HIT {path}: {snippet}')
          if auto_hits:
              raise SystemExit('Remaining shared universal auto-reception claim(s) found; aborting before commit')

          # Verification-only checks; report only, never modify.
          pet = Path('systems/pet-salon.html').read_text(encoding='utf-8', errors='replace')
          terms = Path('terms.html').read_text(encoding='utf-8', errors='replace')
          flower = Path('systems/flower-shop.html').read_text(encoding='utf-8', errors='replace')
          report.append(f'00-016 VERIFY ONLY pet-salon リアルタイム count={pet.count("リアルタイム")}')
          report.append('00-003 VERIFY ONLY terms provider-name counts=' + ','.join(f'{x}:{terms.count(x)}' for x in ('GitHub','Supabase','Cloudflare')))
          report.append(f'00-017 VERIFY ONLY flower exact broad-safety count={flower.count("確認済みの安全設計")}')

          expected = {'systems/index.html','line-operation.html','index.html','systems/estate.html'}
          if set(changed) != expected:
              raise SystemExit(f'Unexpected changed target set: {set(changed)!r}')
          report.append('production_business_mutation=0')
          report.append('worker_api_db_supabase_changes=0')
          report.append('target_files=' + ';'.join(sorted(expected)))

          Path('/tmp/final_targeted_public_copy_repair_report.txt').write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Remove temporary workflow from final tree
        run: rm -f .github/workflows/final-targeted-public-copy-repair.yml

      - name: Scope diff gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected=".github/workflows/final-targeted-public-copy-repair.yml index.html line-operation.html systems/estate.html systems/index.html "
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected diff scope: $actual" >&2
            exit 3
          fi

      - name: Upload static QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-targeted-public-copy-repair-evidence
          path: /tmp/final_targeted_public_copy_repair_report.txt
          if-no-files-found: error

      - name: Commit and push final repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html line-operation.html systems/index.html systems/estate.html .github/workflows/final-targeted-public-copy-repair.yml
          git commit -m 'FINAL targeted public copy repair (00-001 00-004 00-015)'
          git push origin HEAD:main
