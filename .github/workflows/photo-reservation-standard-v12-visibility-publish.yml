name: Publish DPRO Photo Reservation Standard V1.2 Visibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update photo studio product page to V1.2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("systems/photo-studio.html")
          if not path.exists():
              raise SystemExit("ERROR: systems/photo-studio.html not found")

          s = path.read_text(encoding="utf-8")

          replacements = {
              "<!-- DPRO PHOTO RESERVATION STANDARD V1.1 SYSTEM LINKED -->":
              "<!-- DPRO PHOTO RESERVATION STANDARD V1.2 SYSTEM LINKED -->",

              "<h3>DPRO 写真館WEB予約<br>STANDARD V1.1</h3>":
              "<h3>DPRO 写真館WEB予約<br>STANDARD V1.2</h3>",

              "DPROシステムを共通マスターとして、撮影プラン・料金・予約受付期間・営業時間・定休日・臨時休業をWEB予約へ反映するDPRO共通デモです。LINE公式からも同じ予約導線を利用できます。":
              "DPROシステムを共通マスターとして、撮影プラン・料金・予約受付期間・営業時間・定休日・臨時休業をWEB予約へ反映するDPRO共通デモです。V1.2では定休日・営業情報・カレンダー状態をより見やすく整理し、LINE公式からも同じ予約導線を利用できます。",

              "<ul><li>DPRO登録の撮影プラン・料金をWEBへ反映</li><li>定休日・臨時休業・特別営業を予約枠へ反映</li><li>LINE公式＋WEB予約＋DPRO顧客・予約管理を連携</li></ul>":
              "<ul><li>DPRO登録の撮影プラン・料金をWEBへ反映</li><li>営業時間・定休日・臨時休業・特別営業を見やすく表示</li><li>LINE公式＋WEB予約＋DPRO顧客・予約管理を連携</li></ul>",

              "DPRO PHOTO / LINE + WEB + SYSTEM / STANDARD V1.1":
              "DPRO PHOTO / LINE + WEB + SYSTEM / STANDARD V1.2",

              "DPROシステムの設定がWEB予約へ反映される共通予約UXを、PC・スマートフォンで確認できます。":
              "DPROシステムの設定がWEB予約へ反映される共通予約UXを、定休日・営業情報まで含めてPC・スマートフォンで確認できます。",

              ">DPRO 写真館WEB予約 SYSTEM LINKED</a>":
              ">DPRO 写真館WEB予約 V1.2 SYSTEM LINKED</a>",
          }

          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit("ERROR: expected V1.1 text not found: " + repr(missing))

          for old, new in replacements.items():
              s = s.replace(old, new, 1)

          path.write_text(s, encoding="utf-8")
          print("Updated:", path)
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          s = Path("systems/photo-studio.html").read_text(encoding="utf-8")
          required = [
              "<!-- DPRO PHOTO RESERVATION STANDARD V1.2 SYSTEM LINKED -->",
              "DPRO 写真館WEB予約<br>STANDARD V1.2",
              "DPRO PHOTO / LINE + WEB + SYSTEM / STANDARD V1.2",
              "営業時間・定休日・臨時休業・特別営業を見やすく表示",
              "DPRO 写真館WEB予約 V1.2 SYSTEM LINKED",
              "https://dpromstk2000-lab.github.io/dpro-photo-reservation-demo/",
          ]
          missing = [x for x in required if x not in s]
          forbidden = [
              "<!-- DPRO PHOTO RESERVATION STANDARD V1.1 SYSTEM LINKED -->",
              "DPRO 写真館WEB予約<br>STANDARD V1.1",
              "DPRO PHOTO / LINE + WEB + SYSTEM / STANDARD V1.1",
              "Studio PICTURE",
              "STUDIO PICTURE",
          ]
          remain = [x for x in forbidden if x in s]
          if missing:
              raise SystemExit("ERROR: missing V1.2 markers: " + repr(missing))
          if remain:
              raise SystemExit("ERROR: old/specific markers remain: " + repr(remain))
          print("Validation OK")
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/photo-studio.html
          git commit -m "Publish DPRO photo reservation visibility V1.2"
          git push
