name: OFFICIAL final visual fix V1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-fix-official-v1.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OFFICIAL
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply OFFICIAL mobile layout fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          global_css = Path("styles.css")
          systems_css = Path("systems/systems.css")

          if not global_css.exists() or not systems_css.exists():
              raise SystemExit("Required OFFICIAL CSS not found")

          marker_global = "/* FINAL VISUAL QA FIX V1.0 / OFFICIAL GLOBAL */"
          marker_system = "/* FINAL VISUAL QA FIX V1.0 / OFFICIAL SYSTEM HERO */"

          global_fix = r"""
          /* FINAL VISUAL QA FIX V1.0 / OFFICIAL GLOBAL */
          h3{
            text-wrap:pretty;
          }
          @media(max-width:680px){
            .legal-page .footer-inner{
              grid-template-columns:1fr!important;
            }
            .legal-page .footer-links{
              grid-template-columns:1fr!important;
              min-width:0!important;
            }
            .legal-page .footer-links > div{
              min-width:0!important;
            }
            .legal-page .footer-links a{
              max-width:100%!important;
              min-width:0!important;
              white-space:normal!important;
              overflow-wrap:anywhere;
            }
          }
          """

          system_fix = r"""
          /* FINAL VISUAL QA FIX V1.0 / OFFICIAL SYSTEM HERO */
          @media(max-width:960px){
            body.system-product-page .product-hero-inner,
            body.system-product-page .product-hero-inner > *,
            body.system-product-page .product-hero-copy,
            body.system-product-page .product-hero-copy > *,
            body.system-product-page .product-hero-actions,
            body.system-product-page .product-hero-actions > *{
              min-width:0!important;
              max-width:100%!important;
            }
          }
          @media(max-width:760px){
            body.system-product-page .product-hero-actions .button{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              white-space:normal!important;
              overflow-wrap:anywhere;
              text-align:center;
              box-sizing:border-box;
            }
          }
          """

          g = global_css.read_text(encoding="utf-8")
          if marker_global not in g:
              global_css.write_text(
                  g.rstrip() + "\n\n" + textwrap.dedent(global_fix).strip() + "\n",
                  encoding="utf-8",
              )

          s = systems_css.read_text(encoding="utf-8")
          if marker_system not in s:
              systems_css.write_text(
                  s.rstrip() + "\n\n" + textwrap.dedent(system_fix).strip() + "\n",
                  encoding="utf-8",
              )

          print("OFFICIAL visual fixes prepared")
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("styles.css").read_text(encoding="utf-8")
          p = Path("systems/systems.css").read_text(encoding="utf-8")
          assert "FINAL VISUAL QA FIX V1.0 / OFFICIAL GLOBAL" in s
          assert "FINAL VISUAL QA FIX V1.0 / OFFICIAL SYSTEM HERO" in p
          assert ".legal-page .footer-links" in s
          assert ".product-hero-actions .button" in p
          assert Path(".github/workflows/final-visual-qa.yml").exists()
          print("OFFICIAL STATIC QA PASS")
          PY

      - name: Commit OFFICIAL fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/final-visual-fix-official-v1.yml
          git add styles.css systems/systems.css

          git diff --cached --name-only
          git commit -m "Fix OFFICIAL final mobile visual QA issues"
          git push origin HEAD:main

      - name: Wait for OFFICIAL deployment
        shell: bash
        run: |
          set -e
          GLOBAL_URL="https://dpro-shop.com/styles.css?qa=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          SYSTEM_URL="https://dpro-shop.com/systems/systems.css?qa=${GITHUB_SHA}-${GITHUB_RUN_ID}"

          for i in $(seq 1 60); do
            global_css="$(curl -fsSL "$GLOBAL_URL" 2>/dev/null || true)"
            systems_css="$(curl -fsSL "$SYSTEM_URL" 2>/dev/null || true)"
            if printf '%s' "$global_css" | grep -q "FINAL VISUAL QA FIX V1.0 / OFFICIAL GLOBAL" \
              && printf '%s' "$systems_css" | grep -q "FINAL VISUAL QA FIX V1.0 / OFFICIAL SYSTEM HERO"; then
              echo "OFFICIAL deployment confirmed"
              exit 0
            fi
            echo "Waiting for OFFICIAL deployment... ${i}/60"
            sleep 5
          done

          echo "OFFICIAL source was committed, but live deployment was not confirmed in time."
          exit 1

      - name: Dispatch FINAL visual QA V1.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run final-visual-qa.yml --ref main
          echo "FINAL visual QA V1.1 dispatched"
