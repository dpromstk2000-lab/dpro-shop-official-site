name: DPRO OFFICIAL GREEN Blog Demo Link R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct Blog CMS demo link
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "patch.py", "exec"))
      - name: Validate
        shell: bash
        run: |
          grep -q 'ブログCMS DEMO' systems/green-rental.html
          grep -q 'view=blog' systems/green-rental.html
      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/dpro-official-green-blog-demo-link-r1.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add direct GREEN Blog CMS demo link"
          git push
