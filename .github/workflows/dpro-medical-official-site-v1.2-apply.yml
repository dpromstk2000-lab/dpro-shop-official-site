name: DPRO MEDICAL OFFICIAL SITE V1.2 APPLY

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-official-site-v1.2-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply OFFICIAL SITE V1.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import re

          medical_html = base64.b64decode("").decode("utf-8")
          Path("systems/medical.html").write_text(medical_html, encoding="utf-8")

          hub = Path("systems/index.html")
          text = hub.read_text(encoding="utf-8")

          # Normalize visible/static 50 -> 51 copy without touching unrelated numbers.
          replacements = [
              ("DPRO SHOP公式の50業種別システム説明ページ", "DPRO SHOP公式の51業種別システム説明ページ"),
              ("業種別DPROシステム｜50システム", "業種別DPROシステム｜51システム"),
              ("50の完成DPROシステム", "51の完成DPROシステム"),
              ("50の業種別DPROシステム", "51の業種別DPROシステム"),
              ("50システムから探す", "51システムから探す"),
              ("PRODUCT SITE / 50製品", "PRODUCT SITE / 51製品"),
              ("50製品・PC・スマホ・iPad・デモ操作", "51製品・PC・スマホ・iPad・デモ操作"),
              ("50 OFFICIAL GUIDES", "51 OFFICIAL GUIDES"),
              ("50システム説明", "51システム説明"),
              ("50製品を実際に触る", "51製品を実際に触る"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          # Patch JSON-LD safely.
          def patch_jsonld(match):
              raw = match.group(1)
              try:
                  data = json.loads(raw)
              except Exception:
                  return match.group(0)

              def visit(node):
                  if not isinstance(node, dict):
                      return
                  if node.get("@type") == "CollectionPage":
                      if isinstance(node.get("name"), str):
                          node["name"] = node["name"].replace("50システム", "51システム")
                      if isinstance(node.get("description"), str):
                          node["description"] = node["description"].replace("50の業種別", "51の業種別")
                      node["dateModified"] = "2026-08-18"
                  if node.get("@type") == "ItemList" and isinstance(node.get("itemListElement"), list):
                      items = node["itemListElement"]
                      exists = any(isinstance(x, dict) and x.get("url") == "https://dpro-shop.com/systems/medical" for x in items)
                      if not exists:
                          items.append({
                              "@type": "ListItem",
                              "position": 51,
                              "url": "https://dpro-shop.com/systems/medical",
                              "name": "DPRO MEDICAL"
                          })
                      for i, item in enumerate(items, 1):
                          if isinstance(item, dict):
                              item["position"] = i
                      node["numberOfItems"] = len(items)
                  for value in node.values():
                      if isinstance(value, dict):
                          visit(value)
                      elif isinstance(value, list):
                          for child in value:
                              if isinstance(child, dict):
                                  visit(child)

              visit(data)
              return '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(",",":")) + '</script>'

          text = re.sub(
              r'<script type="application/ld\+json">(.*?)</script>',
              patch_jsonld,
              text,
              count=1,
              flags=re.S
          )

          # Add MEDICAL as a real static hub card so SEO/initial HTML and JS agree.
          if 'data-dpro-medical-card="1"' not in text:
              card = (
                  '<a class="sys33-card" data-system-category="medical" data-dpro-medical-card="1" href="medical">'
                  '<span class="sys33-card__cat">医療・ペット</span>'
                  '<h3>DPRO MEDICAL</h3>'
                  '<p>予約・WEB問診・受付・院内進行・医院管理・医院HP・6診療PRESET</p>'
                  '<span class="sys33-card__more">公式説明を見る <b>→</b></span>'
                  '</a>'
              )
              text, n = re.subn(
                  r'(<div[^>]*class="[^"]*sys33-grid[^"]*"[^>]*>)',
                  r'\1' + card,
                  text,
                  count=1
              )
              if n != 1:
                  raise SystemExit("QA FAILED: sys33-grid insertion point not found")

          # Static filter/result counts where present.
          text = re.sub(r'(<[^>]+data-filter-count="all"[^>]*>)50(</[^>]+>)', r'\g<1>51\g<2>', text)
          text = re.sub(r'(<[^>]+data-filter-count="medical"[^>]*>)4(</[^>]+>)', r'\g<1>5\g<2>', text)
          text = text.replace("50件を表示中", "51件を表示中")

          # Ensure any remaining official hub metadata/copy that uses exact 50-system wording is aligned.
          text = text.replace("｜50システムの公式説明", "｜51システムの公式説明")
          text = text.replace("50システムの公式説明", "51システムの公式説明")

          hub.write_text(text, encoding="utf-8")

          # Upgrade the existing hub addon marker; keep it as a safe runtime guard.
          runtime = Path("systems/systems.js")
          rtext = runtime.read_text(encoding="utf-8")
          rtext = rtext.replace(
              "DPRO SHOP OFFICIAL / DPRO MEDICAL HUB ADDON V1.0",
              "DPRO SHOP OFFICIAL / DPRO MEDICAL HUB ADDON V1.2"
          )
          runtime.write_text(rtext, encoding="utf-8")

          # QA
          med = Path("systems/medical.html").read_text(encoding="utf-8")
          hub_text = hub.read_text(encoding="utf-8")
          run_text = runtime.read_text(encoding="utf-8")

          assert "OFFICIAL SITE V1.2" in med
          assert "30秒LIVE DEMOを体験" in med
          assert "INTRODUCTION FLOW" in med
          assert "REAL CUSTOMER LIVE" in med
          assert 'data-dpro-medical-card="1"' in hub_text
          assert "DPRO MEDICAL" in hub_text
          assert '"numberOfItems":51' in hub_text
          assert "https://dpro-shop.com/systems/medical" in hub_text
          assert "DPRO MEDICAL HUB ADDON V1.2" in run_text

          print("QA PASS: DPRO MEDICAL OFFICIAL SITE V1.2")
          PY

      - name: Commit OFFICIAL SITE V1.2
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/medical.html systems/index.html systems/systems.js
          git commit -m "DPRO MEDICAL OFFICIAL SITE V1.2"
          git push
