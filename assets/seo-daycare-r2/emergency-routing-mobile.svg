<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 960"><rect width="420" height="960" rx="28" fill="#eef8f3"/><g font-family="sans-serif"><text x="28" y="58" font-size="17" font-weight="700" fill="#0a8f5b">EMERGENCY FAMILY ROUTING</text><text x="28" y="100" font-size="27" font-weight="800" fill="#102b22">一斉送信だけで終わらない。</text><text x="28" y="138" font-size="27" font-weight="800" fill="#0a8f5b">未確認なら、次のご家族へ。</text><rect x="35" y="190" width="350" height="175" rx="24" fill="#073c2a"/><text x="60" y="232" font-size="16" font-weight="700" fill="#b9f31d">STEP 01</text><text x="60" y="272" font-size="25" font-weight="800" fill="#fff">緊急一斉連絡</text><text x="60" y="310" font-size="18" fill="#d8e9e1">災害・臨時休業・送迎遅延</text><path d="M210 380v48" stroke="#0a8f5b" stroke-width="7"/><path d="M194 416l16 20 16-20" fill="none" stroke="#0a8f5b" stroke-width="7"/><rect x="35" y="445" width="350" height="175" rx="24" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="60" y="487" font-size="16" font-weight="700" fill="#0a8f5b">STEP 02</text><text x="60" y="527" font-size="25" font-weight="800" fill="#102b22">確認状況</text><text x="60" y="565" font-size="18" fill="#566b62">確認済み / 未確認を把握</text><path d="M210 635v48" stroke="#0a8f5b" stroke-width="7"/><path d="M194 671l16 20 16-20" fill="none" stroke="#0a8f5b" stroke-width="7"/><rect x="35" y="700" width="350" height="190" rx="24" fill="#fff" stroke="#a9d9c1" stroke-width="3"/><text x="60" y="742" font-size="16" font-weight="700" fill="#0a8f5b">STEP 03</text><text x="60" y="782" font-size="25" font-weight="800" fill="#102b22">次順位へ段階配信</text><text x="60" y="820" font-size="18" fill="#566b62">主連絡先 → 第2連絡先</text><text x="60" y="852" font-size="18" fill="#566b62">再送 / 自動追加送信</text><text x="210" y="930" text-anchor="middle" font-size="15" font-weight="700" fill="#073c2a">送信・確認・再送・段階配信を履歴で確認</text></g></svg>