<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="36" fill="#f4faf7"/><text x="70" y="90" font-family="sans-serif" font-size="28" font-weight="700" fill="#0a8f5b">MORNING ABSENCE FLOW</text><text x="70" y="145" font-family="sans-serif" font-size="42" font-weight="800" fill="#102b22">朝の欠席連絡を、現場の確認まで一直線に。</text><g font-family="sans-serif"><rect x="85" y="235" width="250" height="190" rx="26" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="115" y="280" font-size="18" font-weight="700" fill="#0a8f5b">01 / FAMILY</text><text x="115" y="325" font-size="29" font-weight="800" fill="#102b22">LINEで欠席連絡</text><text x="115" y="370" font-size="21" fill="#566b62">利用日変更も送信</text><path d="M355 330h90" stroke="#0a8f5b" stroke-width="8"/><path d="M430 312l28 18-28 18" fill="none" stroke="#0a8f5b" stroke-width="8"/><rect x="465" y="235" width="250" height="190" rx="26" fill="#073c2a"/><text x="495" y="280" font-size="18" font-weight="700" fill="#b9f31d">02 / PC</text><text x="495" y="325" font-size="29" font-weight="800" fill="#fff">未対応を確認</text><text x="495" y="370" font-size="21" fill="#d8e9e1">利用者情報へ紐づけ</text><path d="M735 330h90" stroke="#0a8f5b" stroke-width="8"/><path d="M810 312l28 18-28 18" fill="none" stroke="#0a8f5b" stroke-width="8"/><rect x="845" y="235" width="270" height="190" rx="26" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="875" y="280" font-size="18" font-weight="700" fill="#0a8f5b">03 / OPERATION</text><text x="875" y="325" font-size="29" font-weight="800" fill="#102b22">予定・送迎へ共有</text><text x="875" y="370" font-size="21" fill="#566b62">確認漏れを減らす</text></g></svg>