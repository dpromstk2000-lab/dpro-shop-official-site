<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900"><rect width="420" height="900" rx="28" fill="#f4faf7"/><g font-family="sans-serif"><text x="28" y="58" font-size="16" font-weight="700" fill="#0a8f5b">TRANSPORT: CONTACT vs OPERATION</text><text x="28" y="100" font-size="27" font-weight="800" fill="#102b22">「送迎連絡」と「運行管理」を</text><text x="28" y="136" font-size="27" font-weight="800" fill="#102b22">分けて考える。</text><rect x="35" y="195" width="350" height="260" rx="24" fill="#073c2a"/><text x="60" y="238" font-size="16" font-weight="700" fill="#b9f31d">DPRO DAYCARE</text><text x="60" y="280" font-size="25" font-weight="800" fill="#fff">家族との送迎連絡</text><text x="60" y="325" font-size="18" fill="#d8e9e1">・欠席 / 利用日変更</text><text x="60" y="358" font-size="18" fill="#d8e9e1">・送迎時刻の確認</text><text x="60" y="391" font-size="18" fill="#d8e9e1">・今日の利用状況</text><text x="210" y="510" text-anchor="middle" font-size="42" font-weight="800" fill="#0a8f5b">＋</text><rect x="35" y="555" width="350" height="260" rx="24" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="60" y="598" font-size="16" font-weight="700" fill="#0a8f5b">DPRO TRANSPORT</text><text x="60" y="640" font-size="25" font-weight="800" fill="#102b22">配車・便・運行管理</text><text x="60" y="685" font-size="18" fill="#566b62">・車両 / スタッフ</text><text x="60" y="718" font-size="18" fill="#566b62">・乗降順 / 当日便</text><text x="60" y="751" font-size="18" fill="#566b62">・出発 / 到着 / 引渡し</text></g></svg>