<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">介護施設の緊急一斉連絡と段階配信</title><desc id="d">一斉送信後、未確認の場合に次順位家族へ段階的に連絡し履歴を残す流れ</desc><rect width="1200" height="620" rx="36" fill="#eef8f3"/><text x="70" y="84" font-family="sans-serif" font-size="28" font-weight="700" fill="#0a8f5b">EMERGENCY FAMILY ROUTING</text><text x="70" y="140" font-family="sans-serif" font-size="42" font-weight="800" fill="#102b22">一斉送信だけで終わらない。</text><text x="70" y="190" font-family="sans-serif" font-size="42" font-weight="800" fill="#0a8f5b">未確認なら、次のご家族へ。</text><g font-family="sans-serif"><rect x="70" y="265" width="250" height="220" rx="26" fill="#073c2a"/><text x="100" y="310" font-size="18" font-weight="700" fill="#b9f31d">STEP 01</text><text x="100" y="350" font-size="28" font-weight="800" fill="#fff">緊急一斉連絡</text><text x="100" y="397" font-size="21" fill="#d8e9e1">災害・臨時休業</text><text x="100" y="430" font-size="21" fill="#d8e9e1">送迎遅延など</text><path d="M330 375h90" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round"/><path d="M405 357l28 18-28 18" fill="none" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="265" width="250" height="220" rx="26" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="470" y="310" font-size="18" font-weight="700" fill="#0a8f5b">STEP 02</text><text x="470" y="350" font-size="28" font-weight="800" fill="#102b22">確認状況</text><text x="470" y="397" font-size="21" fill="#566b62">確認済み / 未確認</text><text x="470" y="430" font-size="21" fill="#566b62">誰に送ったかを記録</text><path d="M700 375h90" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round"/><path d="M775 357l28 18-28 18" fill="none" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="810" y="265" width="320" height="220" rx="26" fill="#fff" stroke="#a9d9c1" stroke-width="3"/><text x="840" y="310" font-size="18" font-weight="700" fill="#0a8f5b">STEP 03</text><text x="840" y="350" font-size="28" font-weight="800" fill="#102b22">次順位へ段階配信</text><text x="840" y="397" font-size="21" fill="#566b62">主連絡先 → 第2連絡先</text><text x="840" y="430" font-size="21" fill="#566b62">再送 / 自動追加送信</text><rect x="70" y="520" width="1060" height="58" rx="18" fill="#dff4e9"/><text x="600" y="558" text-anchor="middle" font-size="22" font-weight="700" fill="#073c2a">送信対象・確認状況・再送・段階配信を履歴で確認</text></g></svg>