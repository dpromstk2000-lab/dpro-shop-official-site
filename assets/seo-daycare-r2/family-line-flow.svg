<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">デイサービス家族LINE連絡の流れ</title><desc id="d">家族のLINEから施設管理PC、現場スタッフへ情報がつながる図</desc><rect width="1200" height="560" rx="36" fill="#f3faf6"/><text x="70" y="90" font-family="sans-serif" font-size="28" font-weight="700" fill="#0a8f5b">FAMILY CONTACT FLOW</text><text x="70" y="145" font-family="sans-serif" font-size="42" font-weight="800" fill="#102b22">家族の連絡を、施設の確認までつなぐ。</text><g font-family="sans-serif"><rect x="80" y="230" width="260" height="210" rx="28" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="110" y="275" font-size="20" font-weight="700" fill="#0a8f5b">01 / FAMILY LINE</text><text x="110" y="325" font-size="30" font-weight="800" fill="#102b22">家族LINE</text><text x="110" y="372" font-size="22" fill="#566b62">欠席・利用変更</text><text x="110" y="405" font-size="22" fill="#566b62">送迎確認・持ち物</text><path d="M360 335h105" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round"/><path d="M452 317l28 18-28 18" fill="none" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="230" width="260" height="210" rx="28" fill="#083f2d"/><text x="510" y="275" font-size="20" font-weight="700" fill="#b9f31d">02 / FACILITY PC</text><text x="510" y="325" font-size="30" font-weight="800" fill="#fff">施設管理PC</text><text x="510" y="372" font-size="22" fill="#dcebe4">未対応・確認済み</text><text x="510" y="405" font-size="22" fill="#dcebe4">利用者情報と紐づけ</text><path d="M760 335h105" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round"/><path d="M852 317l28 18-28 18" fill="none" stroke="#0a8f5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="880" y="230" width="240" height="210" rx="28" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="910" y="275" font-size="20" font-weight="700" fill="#0a8f5b">03 / STAFF</text><text x="910" y="325" font-size="30" font-weight="800" fill="#102b22">現場共有</text><text x="910" y="372" font-size="22" fill="#566b62">利用予定・送迎</text><text x="910" y="405" font-size="22" fill="#566b62">必要な対応へ</text></g></svg>