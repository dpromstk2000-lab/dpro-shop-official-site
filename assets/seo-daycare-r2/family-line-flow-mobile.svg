<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900"><rect width="420" height="900" rx="28" fill="#f3faf6"/><g font-family="sans-serif"><text x="28" y="58" font-size="18" font-weight="700" fill="#0a8f5b">FAMILY CONTACT FLOW</text><text x="28" y="100" font-size="28" font-weight="800" fill="#102b22">家族の連絡を、</text><text x="28" y="136" font-size="28" font-weight="800" fill="#102b22">施設の確認までつなぐ。</text><rect x="35" y="190" width="350" height="160" rx="24" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="60" y="230" font-size="16" font-weight="700" fill="#0a8f5b">01 / FAMILY LINE</text><text x="60" y="270" font-size="25" font-weight="800" fill="#102b22">家族LINE</text><text x="60" y="308" font-size="18" fill="#566b62">欠席・利用変更・送迎確認</text><path d="M210 365v52" stroke="#0a8f5b" stroke-width="7"/><path d="M194 405l16 20 16-20" fill="none" stroke="#0a8f5b" stroke-width="7"/><rect x="35" y="435" width="350" height="160" rx="24" fill="#073c2a"/><text x="60" y="475" font-size="16" font-weight="700" fill="#b9f31d">02 / FACILITY PC</text><text x="60" y="515" font-size="25" font-weight="800" fill="#fff">施設管理PC</text><text x="60" y="553" font-size="18" fill="#d8e9e1">未対応・確認済みを把握</text><path d="M210 610v52" stroke="#0a8f5b" stroke-width="7"/><path d="M194 650l16 20 16-20" fill="none" stroke="#0a8f5b" stroke-width="7"/><rect x="35" y="680" width="350" height="160" rx="24" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="60" y="720" font-size="16" font-weight="700" fill="#0a8f5b">03 / STAFF</text><text x="60" y="760" font-size="25" font-weight="800" fill="#102b22">現場共有</text><text x="60" y="798" font-size="18" fill="#566b62">利用予定・送迎・必要対応へ</text></g></svg>