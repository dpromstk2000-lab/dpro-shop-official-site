<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900"><rect width="420" height="900" rx="28" fill="#f4faf7"/><g font-family="sans-serif"><text x="28" y="58" font-size="18" font-weight="700" fill="#0a8f5b">MORNING ABSENCE FLOW</text><text x="28" y="102" font-size="27" font-weight="800" fill="#102b22">朝の欠席連絡を、</text><text x="28" y="138" font-size="27" font-weight="800" fill="#102b22">現場の確認まで一直線に。</text><rect x="35" y="190" width="350" height="160" rx="24" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="60" y="232" font-size="16" font-weight="700" fill="#0a8f5b">01 / FAMILY</text><text x="60" y="272" font-size="25" font-weight="800" fill="#102b22">LINEで欠席連絡</text><text x="60" y="310" font-size="18" fill="#566b62">利用日変更も送信</text><path d="M210 365v52" stroke="#0a8f5b" stroke-width="7"/><path d="M194 405l16 20 16-20" fill="none" stroke="#0a8f5b" stroke-width="7"/><rect x="35" y="435" width="350" height="160" rx="24" fill="#073c2a"/><text x="60" y="477" font-size="16" font-weight="700" fill="#b9f31d">02 / PC</text><text x="60" y="517" font-size="25" font-weight="800" fill="#fff">未対応を確認</text><text x="60" y="555" font-size="18" fill="#d8e9e1">利用者情報へ紐づけ</text><path d="M210 610v52" stroke="#0a8f5b" stroke-width="7"/><path d="M194 650l16 20 16-20" fill="none" stroke="#0a8f5b" stroke-width="7"/><rect x="35" y="680" width="350" height="160" rx="24" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="60" y="722" font-size="16" font-weight="700" fill="#0a8f5b">03 / OPERATION</text><text x="60" y="762" font-size="25" font-weight="800" fill="#102b22">予定・送迎へ共有</text><text x="60" y="800" font-size="18" fill="#566b62">確認漏れを減らす</text></g></svg>