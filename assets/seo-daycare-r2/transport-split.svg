<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590"><rect width="1200" height="590" rx="36" fill="#f4faf7"/><text x="70" y="90" font-family="sans-serif" font-size="28" font-weight="700" fill="#0a8f5b">TRANSPORT: CONTACT vs OPERATION</text><text x="70" y="145" font-family="sans-serif" font-size="42" font-weight="800" fill="#102b22">「送迎連絡」と「運行管理」を分けて考える。</text><g font-family="sans-serif"><rect x="90" y="235" width="455" height="260" rx="30" fill="#073c2a"/><text x="130" y="290" font-size="20" font-weight="700" fill="#b9f31d">DPRO DAYCARE</text><text x="130" y="340" font-size="32" font-weight="800" fill="#fff">家族との送迎連絡</text><text x="130" y="395" font-size="23" fill="#d8e9e1">・欠席 / 利用日変更</text><text x="130" y="432" font-size="23" fill="#d8e9e1">・送迎時刻の確認</text><text x="130" y="469" font-size="23" fill="#d8e9e1">・今日の利用状況</text><rect x="655" y="235" width="455" height="260" rx="30" fill="#fff" stroke="#cfe5da" stroke-width="3"/><text x="695" y="290" font-size="20" font-weight="700" fill="#0a8f5b">DPRO TRANSPORT</text><text x="695" y="340" font-size="32" font-weight="800" fill="#102b22">配車・便・運行管理</text><text x="695" y="395" font-size="23" fill="#566b62">・車両 / スタッフ</text><text x="695" y="432" font-size="23" fill="#566b62">・乗降順 / 当日便</text><text x="695" y="469" font-size="23" fill="#566b62">・出発 / 到着 / 引渡し</text><path d="M565 365h70" stroke="#0a8f5b" stroke-width="8" stroke-dasharray="12 12"/></g></svg>