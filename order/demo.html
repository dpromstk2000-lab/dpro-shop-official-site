<!doctype html>

<title>DPRO ORDER｜公開体験DEMO</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",Meiryo,sans-serif;font-size:15px;color:#15374d;background:#f2f7fb;color-scheme:light}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:#007e6d}h1{font-size:clamp(1.4rem,3vw,1.9rem);margin:.3rem 0 1rem}h2{font-size:1.15rem;margin:0 0 14px}h3{font-size:1rem;margin:5px 0 12px}p{line-height:1.65}[hidden]{display:none!important}
.layout{min-height:100vh;display:flex}.sidebar{background:#14354d;color:#fff;width:228px;min-width:228px;padding:24px 15px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;line-height:1.2}.brand small{display:block;font-size:.73rem;font-weight:500;margin-top:6px}.brandmark{padding:13px 17px;border-radius:12px;background:#007d72;font-size:1.65rem}.menu{display:grid;gap:5px}.menu button{border:0;border-radius:9px;padding:12px;color:white;background:transparent;text-align:left;font-weight:700}.menu button:hover,.menu button.active{background:#25596b}.sidefoot{font-size:.78rem;line-height:1.7;margin-top:auto;opacity:.8}.workspace{flex:1;min-width:0}.topbar{background:#fff;border-bottom:1px solid #dbe7ed;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;min-height:65px;padding:12px 22px}.topcontrols{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.container{width:min(1130px,100%);margin:auto;padding:22px 20px 40px}
.panel{background:#fff;border:1px solid #dbe6ee;border-radius:14px;padding:22px;margin-bottom:17px;box-shadow:0 8px 26px #092b4608}.login{width:min(475px,100%);margin:7vh auto 20px;padding:30px}.eyebrow{font-size:.74rem;letter-spacing:.13em;font-weight:800;color:#007d6d}.lead{color:#546e81;font-size:.91rem}.ribbon{padding:11px 14px;border-radius:11px;background:#e8f5f1;border:1px solid #a5d9cb;margin-bottom:16px;color:#065c51;font-size:.86rem;line-height:1.6}.btn{background:#007c69;color:#fff;border:1px solid #007c69;border-radius:9px;padding:10px 15px;font-weight:750;min-height:43px}.btn:hover{background:#005f52}.btn.alt{background:#fff;border-color:#adc3d2;color:#173a52}.btn.alt:hover{background:#edf5f8}.btn.bad{background:#fff;border-color:#e0bab8;color:#a3302e}.btn.small{font-size:.83rem;min-height:36px;padding:7px 10px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid #dce8ee;border-radius:12px;padding:17px}.stat strong{display:block;font-size:1.7rem;margin-top:5px}.muted{font-size:.86rem;color:#647b8a;line-height:1.6}.empty{padding:24px;color:#718495;text-align:center}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:570px}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #e5edf1;vertical-align:top}.table th{font-size:.84rem;color:#547084;white-space:nowrap}.table small{color:#698292}.tag{background:#e9f0f7;color:#20516b;border-radius:30px;padding:4px 10px;white-space:nowrap;font-weight:750;font-size:.78rem;display:inline-block}.tag.submitted{background:#ffeed4;color:#8d5600}.tag.confirmed,.tag.partially_shipped{background:#e4f2ff;color:#18517e}.tag.shipped{background:#e3f6e8;color:#14603c}.tag.cancelled{background:#f8e9e9;color:#963e3e}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.field{display:grid;gap:6px;font-weight:670;font-size:.91rem}.field input,.field select,.field textarea,input,select,textarea{border:1px solid #b8cad7;background:white;border-radius:9px;padding:10px;min-height:43px;color:#16334b;max-width:100%}.field input,.field select,.field textarea{width:100%}.num{width:110px;max-width:110px}.roleSelect{width:auto;max-width:230px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #64bba7;outline-offset:2px}.issue{color:#b03b39;font-weight:700}.ok{color:#007963;font-weight:700}.note{background:#f1f8fc;border:1px solid #dae7f0;padding:12px;border-radius:10px;line-height:1.6;font-size:.87rem}.article{background:#fbfdff;border:1px solid #dce8ee;padding:15px;border-radius:10px;margin-bottom:12px}.divider{border:0;border-top:1px solid #e3ebf1;margin:16px 0}.grow{flex:1}.subhead{font-weight:750;margin-bottom:7px}#feedback{margin:10px 0;min-height:20px;font-weight:650;font-size:.9rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{margin:2px 0}.foot{font-size:.79rem;color:#688090;margin-top:20px}
@media(max-width:750px){.layout{display:block}.sidebar{width:100%;min-width:0;display:block;padding:13px}.brand{font-size:1rem}.brandmark{font-size:1.2rem;padding:9px 12px}.menu{display:flex;gap:4px;overflow-x:auto;margin-top:12px}.menu button{white-space:nowrap;padding:10px 11px}.sidefoot{display:none}.container{padding:15px 12px}.panel{padding:16px}.login{margin:18px auto}.topbar{padding:10px 12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ORDER sales-ready DEMO onboarding guidance */
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:15px}.guide-step{border:1px solid #dae6ef;border-radius:12px;padding:18px;background:#fbfdff}.guide-step>span{font-size:.75rem;letter-spacing:.05em;color:#006e61;font-weight:800}.guide-step h3{margin:8px 0}.guide-step p{font-size:.9rem;line-height:1.7;min-height:3.2em}.guide-message{display:block;width:100%;min-height:180px;line-height:1.8;background:#f6fafb;white-space:pre-wrap;margin:10px 0 14px;font-size:.9rem}
@media(max-width:750px){.guide-grid{grid-template-columns:1fr}.guide-step p{min-height:0}}
